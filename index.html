<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Year Ten</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1d2433;--mu:#5b6578;--ac:#5b3fd0;--ac2:#e9e4ff;--bd:#dde1ea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141c;--card:#1b1e29;--tx:#e8eaf2;--mu:#9aa3b8;--ac:#a58bff;--ac2:#2b2552;--bd:#2d3243}}
:root[data-theme="dark"]{--bg:#12141c;--card:#1b1e29;--tx:#e8eaf2;--mu:#9aa3b8;--ac:#a58bff;--ac2:#2b2552;--bd:#2d3243}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 Georgia,"Times New Roman",serif;display:flex;flex-direction:column;align-items:center}
#th{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:calc(14px + env(safe-area-inset-right,0px));font:600 14px system-ui,sans-serif;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;padding:7px 13px;cursor:pointer}
main{width:100%;max-width:860px;padding:56px 18px 40px;margin:auto 0;text-align:center}
h1{margin:0;font:800 clamp(40px,10vw,72px)/1.05 system-ui,sans-serif;letter-spacing:-.02em}
h1 span{color:var(--ac)}
.sub{color:var(--mu);font:17px system-ui,sans-serif;margin:10px 0 34px}
.grid{display:flex;flex-wrap:wrap;gap:22px;justify-content:center}
a.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;width:min(100%,270px);aspect-ratio:1/1;border-radius:50%;background:var(--card);border:2px solid var(--bd);color:var(--tx);text-decoration:none;box-shadow:0 8px 24px rgba(40,30,90,.12);transition:transform .18s,box-shadow .18s,border-color .18s,background .18s;padding:20px}
a.tile:hover,a.tile:focus-visible{transform:translateY(-6px) scale(1.03);border-color:var(--ac);background:var(--ac2);box-shadow:0 14px 32px rgba(91,63,208,.28);outline:none}
a.tile .e{font-size:56px;line-height:1}
a.tile .n{font:700 24px/1.15 system-ui,sans-serif}
a.tile .d{font:14px system-ui,sans-serif;color:var(--mu)}
footer{color:var(--mu);font:12px system-ui,sans-serif;padding:0 16px 22px;text-align:center}

.fb{width:100%;max-width:640px;margin:44px auto 0;text-align:left;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px}
.fb h2{margin:0 0 4px;font:700 22px system-ui,sans-serif}.fb p.sub{margin:0 0 12px;font-size:14px}
.fb input,.fb textarea{width:100%;font:16px system-ui,sans-serif;padding:9px 11px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);margin-bottom:8px}
.fb textarea{min-height:84px;resize:vertical}
.fb button{font:600 14px system-ui,sans-serif;border:1px solid var(--ac);background:var(--ac);color:#fff;border-radius:999px;padding:8px 18px;cursor:pointer}
.fb button.g{background:transparent;color:var(--mu);border-color:var(--bd);padding:3px 10px;font-size:12px}
.fb button:disabled{opacity:.5;cursor:default}
#fmsg{font:14px system-ui,sans-serif;color:var(--mu);margin:6px 0}
.pst{border-top:1px solid var(--bd);padding:10px 0}.pst b{font:600 14px system-ui,sans-serif}.pst small{color:var(--mu);font:12px system-ui,sans-serif;margin-left:6px}.pst p{margin:4px 0;white-space:pre-wrap;word-wrap:break-word}
.cnt{font:12px system-ui,sans-serif;color:var(--mu);margin-left:10px}
</style></head><body>
<button id="th" aria-label="Toggle dark mode">◐</button>
<main>
<h1>Year <span>Ten</span></h1>
<p class="sub">Choose a subject to open its study hub</p>
<div class="grid" id="grid"></div>
<section class="fb" id="fb"><h2>💬 Feedback</h2><p class="sub">Tell us what works, what's confusing, or what you'd like added. Please be kind and keep it about the website.</p>
<div id="fmsg">Loading feedback…</div>
<div id="fform" style="display:none"><input id="fnm" maxlength="40" placeholder="Your name (optional)"><textarea id="ftx" maxlength="500" placeholder="Write your feedback here…"></textarea><button id="fpost">Post feedback</button><span class="cnt" id="fcnt">0 / 500</span></div>
<div id="flist"></div></section>
</main>
<footer>To add a subject, add one line to the SUBJECTS list in this file.</footer>
<script>
/* Edit the links here. Both open the live Claude-hosted pages, which always show the newest version. */
const SUBJECTS=[
 {name:"Psychology",emoji:"🧠",note:"Study hub",href:"https://claude.ai/artifact/2e57UvmGP9cvY3iY42KTjv"},
 {name:"Specialist Maths",emoji:"📐",note:"Proof & complex numbers",href:"https://claude.ai/artifact/XLCxcFcJpkfV4MR6bsEpfN"}
];
document.getElementById("grid").innerHTML=SUBJECTS.map(s=>`<a class="tile" href="${s.href}"><span class="e">${s.emoji}</span><span class="n">${s.name}</span><span class="d">${s.note}</span></a>`).join("");
document.getElementById("th").onclick=()=>{const r=document.documentElement;const dk=r.dataset.theme=="dark"||(r.dataset.theme!="light"&&matchMedia("(prefers-color-scheme:dark)").matches);r.dataset.theme=dk?"light":"dark"};

/* ---- Feedback board (shared via the page's db; works on the Claude-hosted page) ---- */
(async()=>{
 const $=id=>document.getElementById(id),msg=t=>{$("fmsg").textContent=t};
 let db=null,user=null,uid=null,isOwner=false,docs=[];
 try{if(window.claude){db=await claude.use("db");user=await claude.use("user")}}catch(e){}
 if(!db){msg("Feedback works on the Claude-hosted version of this page when you are signed in to claude.ai. Open it from the published link to read or leave feedback.");return}
 let canWrite=false;
 try{uid=user?await user.id():null;isOwner=user?await user.isOwner():false;const w=user?await user.can("data.write"):null;canWrite=!!uid&&w!==false}catch(e){}
 if(canWrite){msg("");$("fform").style.display="block"}else msg("You can read feedback here. To post, ask the site owner to share this page with you as a Contributor.");
 const render=()=>{
  const all=[];docs.forEach(d=>(d.posts||[]).forEach(p=>all.push({o:d.id,...p})));all.sort((a,b)=>b.t-a.t);
  const box=$("flist");box.textContent="";
  if(!all.length){const e=document.createElement("p");e.className="sub";e.textContent="No feedback yet. Be the first!";box.appendChild(e);return}
  all.slice(0,50).forEach(p=>{
   const d=document.createElement("div");d.className="pst";
   const h=document.createElement("div"),n=document.createElement("b");n.textContent=p.name||"Anonymous";
   const dt=document.createElement("small");dt.textContent=new Date(p.t).toLocaleDateString();h.append(n,dt);
   if(p.o===uid||isOwner){const x=document.createElement("button");x.className="g";x.textContent="Delete";x.style.marginLeft="10px";x.onclick=()=>del(p);h.appendChild(x)}
   const t=document.createElement("p");t.textContent=p.text;d.append(h,t);box.appendChild(d)})};
 async function del(p){try{const r=db.doc("fb/"+p.o),c=await r.get(),cur=(c.exists&&c.data().posts)||[];await r.set({posts:cur.filter(x=>x.t!==p.t)})}catch(e){msg("Couldn't delete that ("+(e.code||"error")+").")}}
 $("ftx").oninput=()=>{$("fcnt").textContent=$("ftx").value.length+" / 500"};
 $("fpost").onclick=async()=>{
  const text=$("ftx").value.trim();if(!text||!uid)return;$("fpost").disabled=true;
  try{const r=db.doc("fb/"+uid),c=await r.get(),cur=(c.exists&&c.data().posts)||[];
   await r.set({posts:[{t:Date.now(),name:($("fnm").value.trim()||"Anonymous").slice(0,40),text:text.slice(0,500)},...cur].slice(0,30)});
   $("ftx").value="";$("fcnt").textContent="0 / 500";msg("Thanks! Your feedback is posted.")}
  catch(e){msg("Couldn't post that ("+(e.code||"error")+"). You may need Contributor access.")}
  $("fpost").disabled=false};
 db.collection("fb").onSnapshot(s=>{docs=s.docs.map(d=>({id:d.id,...(d.data()||{})}));render()},e=>msg("Couldn't load feedback ("+(e.code||"error")+")."));
})();
</script>
</body></html>
