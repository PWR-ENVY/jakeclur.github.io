\" text-anchor=\\\"end\\\">Siblings, reared together\u003c/text>\u003crect x=\\\"265\\\" y=\\\"104\\\" width=\\\"188\\\" height=\\\"20\\\" rx=\\\"3\\\" fill=\\\"#3b82c4\\\" fill-opacity=\\\".75\\\"/>\u003ctext class=\\\"b\\\" x=\\\"459.0\\\" y=\\\"118\\\" text-anchor=\\\"start\\\">.47\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"255\\\" y=\\\"148\\\" text-anchor=\\\"end\\\">Parent and child\u003c/text>\u003crect x=\\\"265\\\" y=\\\"134\\\" width=\\\"168\\\" height=\\\"20\\\" rx=\\\"3\\\" fill=\\\"#3b82c4\\\" fill-opacity=\\\".75\\\"/>\u003ctext class=\\\"b\\\" x=\\\"439.0\\\" y=\\\"148\\\" text-anchor=\\\"start\\\">.42\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"255\\\" y=\\\"178\\\" text-anchor=\\\"end\\\">Siblings, reared apart\u003c/text>\u003crect x=\\\"265\\\" y=\\\"164\\\" width=\\\"96\\\" height=\\\"20\\\" rx=\\\"3\\\" fill=\\\"#3b82c4\\\" fill-opacity=\\\".75\\\"/>\u003ctext class=\\\"b\\\" x=\\\"367.0\\\" y=\\\"178\\\" text-anchor=\\\"start\\\">.24\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"255\\\" y=\\\"208\\\" text-anchor=\\\"end\\\">Adoptive parent and adopted child\u003c/text>\u003crect x=\\\"265\\\" y=\\\"194\\\" width=\\\"76\\\" height=\\\"20\\\" rx=\\\"3\\\" fill=\\\"#d98a1f\\\" fill-opacity=\\\".75\\\"/>\u003ctext class=\\\"b\\\" x=\\\"347.0\\\" y=\\\"208\\\" text-anchor=\\\"start\\\">.19\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"255\\\" y=\\\"238\\\" text-anchor=\\\"end\\\">Cousins\u003c/text>\u003crect x=\\\"265\\\" y=\\\"224\\\" width=\\\"60\\\" height=\\\"20\\\" rx=\\\"3\\\" fill=\\\"#8e5bb5\\\" fill-opacity=\\\".75\\\"/>\u003ctext class=\\\"b\\\" x=\\\"331.0\\\" y=\\\"238\\\" text-anchor=\\\"start\\\">.15\u003c/text>\u003cline x1=\\\"265\\\" y1=\\\"8\\\" x2=\\\"265\\\" y2=\\\"252\\\" class=\\\"ln\\\"/>\u003ctext class=\\\"xs\\\" x=\\\"665\\\" y=\\\"262\\\" text-anchor=\\\"end\\\">Teal = 100% shared genes \u00b7 Blue = about 50% \u00b7 Purple = about 12.5% \u00b7 Orange = no shared genes\u003c/text>\u003c/svg>\u003cfigcaption>Approximate average IQ correlations (r) from Bouchard and McGue's 1981 review of familial studies; exact values differ slightly between sources. The closer the genetic relationship, the more similar the IQ scores.\u003c/figcaption>\u003c/figure>\\n\\n\u003ch3>Key studies\u003c/h3>\\n\u003cdiv class=\\\"sc\\\">\u003cb>Minnesota Study of Twins Reared Apart (Bouchard, Lykken, McGue, Segal and Tellegen, 1990)\u003c/b>\\n\u003cul>\\n\u003cli>\u003cb>Aim:\u003c/b> to find how much of the similarity in intelligence and personality is due to genes and how much to environment.\u003c/li>\\n\u003cli>\u003cb>Method:\u003c/b> ongoing since 1979 at the University of Minnesota; more than 100 sets of reared-apart twins or triplets. The 1990 IQ report focused on \u003cb>56 pairs of identical twins reared apart (MZA)\u003c/b>, recruited through publicity and word of mouth and tested for around 50 hours with intelligence tests (including the Wechsler scale), personality and other measures. They were compared with identical and fraternal twins reared together.\u003c/li>\\n\u003cli>\u003cb>Results:\u003c/b> the IQ correlation for identical twins reared apart was about \u003cb>.70\u003c/b>, suggesting about \u003cb>70% of the variation in IQ\u003c/b> was associated with genetic differences. The twins also showed striking similarities in personality, interests and attitudes.\u003c/li>\\n\u003cli>\u003cb>Conclusion:\u003c/b> genes have a strong influence on intelligence.\u003c/li>\\n\u003cli>\u003cb>Evaluation:\u003c/b> a strength is that it studied the rare case of twins separated early, using standardised, extensive testing. \u003cb>Criticisms:\u003c/b> small, self-selected sample; many twins had some contact before testing and were not fully separated from birth; adoptive homes were often similar (selective placement); the control group of fraternal twins reared apart was small; correlation in adulthood may not match childhood.\u003c/li>\\n\u003c/ul>\u003c/div>\\n\u003cdiv class=\\\"sc\\\">\u003cb>Bouchard and McGue (1981)\u003c/b> reviewed 111 studies of familial IQ correlations. Averages: identical twins together about .86, fraternal twins about .60, siblings about .47, identical twins apart about .72, siblings apart about .24. Overall, \u003cb>the more genes people share, the more similar their IQ\u003c/b>.\u003c/div>\\n\u003cdiv class=\\\"sc\\\">\u003cb>Adoption studies:\u003c/b>\\n\u003cul>\\n\u003cli>Adopted children's IQ tends to resemble their \u003cb>biological\u003c/b> parents more as they grow older, and adopted siblings raised together become less alike by adolescence (e.g. the Colorado Adoption Project).\u003c/li>\\n\u003cli>\u003cb>Capron and Duyme (1989, France):\u003c/b> children adopted into high-socioeconomic-status homes scored about 12 IQ points higher than similar children adopted into low-status homes, and children born to high-status parents scored higher than children born to low-status parents in the same type of home. \u003cb>Both genes and environment mattered.\u003c/b>\u003c/li>\\n\u003cli>Children severely deprived in Romanian orphanages scored lower on average and improved after adoption into good homes, with the best recovery for those adopted earliest (Rutter's studies).\u003c/li>\\n\u003c/ul>\u003c/div>\\n\u003cp>\u003cb>Overall estimate:\u003c/b> twin studies suggest heritability of IQ around .50 to .70 in adults. It tends to be lower in childhood (roughly 20% in infancy) and increases with age (60\u201380% in adulthood), as people choose and shape environments that match their genes.\u003c/p>\", \"qs\": [{\"t\": \"h\", \"r\": \"Q1\", \"q\": \"Summarise the Minnesota Study of Twins Reared Apart.\", \"a\": \"Bouchard et al. (1990) studied identical twins separated early and reared apart (56 pairs in the IQ report). Their IQ correlation was about .70, suggesting about 70% of the variation in IQ was linked to genes. Criticisms include a small, self-selected sample, contact between twins before testing and similar adoptive homes.\"}, {\"t\": \"x\", \"r\": \"Q2\", \"q\": \"What does a heritability of .70 for IQ mean, and what does it NOT mean?\", \"a\": \"It means about 70% of the differences in IQ within the group studied are associated with genetic differences. It does not mean 70% of any one person's intelligence is genetic, and it does not mean IQ cannot change.\"}]}, {\"id\": \"I5\", \"wk\": \"Topic 2: Intelligence\", \"title\": \"I5 Nature versus nurture: genes and environment\", \"th\": \"\u003cdiv class=\\\"box\\\">\u003cb>Success criterion:\u003c/b> I can explain how intelligence is influenced by both genetics and environment (nature and nurture).\u003c/div>\u003cdiv class=\\\"g2\\\">\\n\u003cdiv class=\\\"sc\\\">\u003ch3>Evidence for nature (genes)\u003c/h3>\u003cul>\u003cli>MZ twins are more alike than DZ twins, even when reared apart\u003c/li>\u003cli>IQ similarity rises with genetic relatedness\u003c/li>\u003cli>Adopted children's IQ comes to resemble their biological parents\u003c/li>\u003c/ul>\u003c/div>\\n\u003cdiv class=\\\"sc\\\">\u003ch3>Evidence for nurture (environment)\u003c/h3>\u003cul>\u003cli>\u003cb>Schooling:\u003c/b> each extra year of education is linked to a few IQ points\u003c/li>\u003cli>\u003cb>Nutrition and health:\u003c/b> prenatal and early malnutrition, lead exposure and alcohol exposure lower IQ\u003c/li>\u003cli>\u003cb>Enrichment and deprivation:\u003c/b> good early stimulation and quality early-childhood programs raise scores; neglect lowers them (Romanian orphans)\u003c/li>\u003cli>\u003cb>Flynn effect:\u003c/b> scores rose about 3 points per decade, far too fast for genes to explain\u003c/li>\u003cli>Even MZ twins reared apart are not identical in IQ (r about .7, not 1.0)\u003c/li>\u003c/ul>\u003c/div>\\n\u003c/div>\\n\u003cdiv class=\\\"box\\\">\u003cb>Interaction view (the current consensus):\u003c/b> intelligence results from genes and environment working together.\\n\u003cul>\u003cli>\u003cb>Reaction range:\u003c/b> genes set a range of possible outcomes; the environment decides where in that range a person ends up.\u003c/li>\\n\u003cli>\u003cb>Gene-environment correlation:\u003c/b> people with certain genes seek out or create certain environments (a curious child chooses books, which builds skills).\u003c/li>\\n\u003cli>\u003cb>Gene expression:\u003c/b> the environment can switch genes on or off (epigenetics).\u003c/li>\\n\u003cli>Some studies find heritability of IQ is lower in deprived environments and higher in enriched ones.\u003c/li>\u003c/ul>\u003c/div>\\n\u003cp>\u003cb>Careful thinking:\u003c/b> heritability describes differences within a group in a given environment. It does not explain differences \u003ci>between\u003c/i> groups. Example: seeds from the same bag planted in rich and poor soil can differ in height because of soil, even if height within each plot is mostly genetic. High heritability also does not mean an ability cannot be improved.\u003c/p>\", \"qs\": [{\"t\": \"h\", \"r\": \"Q1\", \"q\": \"Explain how genetics and environment both influence intelligence.\", \"a\": \"Twin, family and adoption studies show IQ similarity increases with genetic relatedness (genes). Schooling, nutrition, enrichment and the Flynn effect show the environment also matters. Genes and environment interact: genes set a range of possible outcomes and the environment affects where a person ends up.\"}, {\"t\": \"h\", \"r\": \"Q2\", \"q\": \"Why does the Flynn effect support the influence of environment on intelligence?\", \"a\": \"Average IQ scores rose about 3 points per decade, which is too fast to be caused by genetic change, so changes in environment (nutrition, schooling, stimulation) are likely involved.\"}]}, {\"id\": \"I6\", \"wk\": \"Topic 2: Intelligence\", \"title\": \"I6 IQ and EQ: accurate, misleading, or both?\", \"th\": \"\u003cdiv class=\\\"box\\\">\u003cb>Success criterion:\u003c/b> I can discuss whether IQ and EQ tests are accurate, misleading, or both.\u003c/div>\u003cp>\u003cb>Emotional intelligence (EQ)\u003c/b> is the ability to perceive, understand, use and manage emotions in yourself and others. The idea was developed by Salovey and Mayer (1990) and popularised by Goleman (1995), who described self-awareness, self-regulation, motivation, empathy and social skills. EQ is measured by \u003cb>ability tests\u003c/b> (e.g. MSCEIT, which asks people to solve emotion-based problems) and \u003cb>self-report questionnaires\u003c/b> (e.g. Bar-On EQ-i).\u003c/p>\\n\u003cdiv class=\\\"tw\\\">\u003ctable>\\n\u003ctr>\u003cth>\u003c/th>\u003cth>IQ tests\u003c/th>\u003cth>EQ tests\u003c/th>\u003c/tr>\\n\u003ctr>\u003ctd>\u003cb>Measures\u003c/b>\u003c/td>\u003ctd>Reasoning, knowledge, memory and speed\u003c/td>\u003ctd>Recognising, understanding and managing emotions\u003c/td>\u003c/tr>\\n\u003ctr>\u003ctd>\u003cb>Reliability\u003c/b>\u003c/td>\u003ctd>High; scores are stable and consistent\u003c/td>\u003ctd>Lower and varies by test; self-report scores can change with mood\u003c/td>\u003c/tr>\\n\u003ctr>\u003ctd>\u003cb>Validity\u003c/b>\u003c/td>\u003ctd>Good predictor of school achievement; moderate for work success\u003c/td>\u003ctd>Weaker evidence; moderate links to wellbeing, relationships and some job performance\u003c/td>\u003c/tr>\\n\u003ctr>\u003ctd>\u003cb>Strengths\u003c/b>\u003c/td>\u003ctd>Standardised, objective, well researched\u003c/td>\u003ctd>Captures social and emotional skills IQ ignores\u003c/td>\u003c/tr>\\n\u003ctr>\u003ctd>\u003cb>Problems\u003c/b>\u003c/td>\u003ctd>Cultural bias, test anxiety and stereotype threat, narrow focus, risk of labelling, Flynn effect\u003c/td>\u003ctd>No agreed definition; self-report is easy to fake or inflate (social desirability); overlaps with personality; \\\"correct\\\" emotional answers are subjective; claims that EQ matters more than IQ are not well supported\u003c/td>\u003c/tr>\\n\u003c/table>\u003c/div>\\n\u003cdiv class=\\\"box\\\">\u003cb>Verdict: both.\u003c/b> IQ tests are accurate and reliable for what they measure (mainly academic-type reasoning) but misleading if treated as a total measure of a person's worth or potential. EQ tests capture useful skills but have weaker reliability and validity and are more open to bias. Neither should be judged from a single score; they are most useful alongside other information.\u003c/div>\", \"qs\": [{\"t\": \"x\", \"r\": \"Q1\", \"q\": \"Are IQ and EQ tests accurate, misleading, or both?\", \"a\": \"Both. IQ tests are reliable and predict academic success but are narrow, can be culturally biased and are affected by anxiety and stereotype threat. EQ tests measure useful emotional skills but have weaker reliability and validity, rely on self-report that can be faked, and overlap with personality.\"}, {\"t\": \"h\", \"r\": \"Q2\", \"q\": \"Give two reasons EQ tests may be less valid than IQ tests.\", \"a\": \"There is no agreed definition of emotional intelligence; self-report tests can be faked or inflated; scores overlap with personality; and 'correct' emotional answers are subjective.\"}]}, {\"id\": \"E1\", \"wk\": \"Emotion and wellbeing (Lessons 7, 9 and 10)\", \"title\": \"E1 Theories of emotion (Lessons 7 and 9)\", \"th\": \"\u003ch3>What is emotion?\u003c/h3>\\n\u003cul>\\n\u003cli>Strong, short-lasting reactions to events, thoughts or memories, from external situations (a scary movie) or internal processes (remembering something embarrassing).\u003c/li>\\n\u003cli>\u003cb>Valence:\u003c/b> emotions are positive (joy, love) or negative (fear, anger).\u003c/li>\\n\u003c/ul>\\n\u003cdiv class=\\\"tw\\\">\u003ctable>\\n\u003ctr>\u003cth>Three components\u003c/th>\u003cth>Meaning\u003c/th>\u003cth>Example (snake near your foot)\u003c/th>\u003c/tr>\\n\u003ctr>\u003ctd>\u003cb>Physiological\u003c/b>\u003c/td>\u003ctd>Body changes (heart rate, sweating, butterflies, alertness)\u003c/td>\u003ctd>Heart rate increases\u003c/td>\u003c/tr>\\n\u003ctr>\u003ctd>\u003cb>Subjective feeling\u003c/b>\u003c/td>\u003ctd>What you feel inside; same situation can feel different to different people\u003c/td>\u003ctd>\\\"I feel scared\\\"\u003c/td>\u003c/tr>\\n\u003ctr>\u003ctd>\u003cb>Behavioural/expressive\u003c/b>\u003c/td>\u003ctd>Observable actions or expressions (smiling, crying, hugging, avoiding)\u003c/td>\u003ctd>Jump backwards\u003c/td>\u003c/tr>\\n\u003c/table>\u003c/div>\\n\u003ch3>Schachter and Singer's Two-Factor Theory (1962)\u003c/h3>\\n\u003cdiv class=\\\"box\\\">\u003cb>Emotion = physiological arousal + cognitive interpretation (label).\u003c/b> Arousal alone is not enough; we must work out \u003ci>why\u003c/i> we feel aroused. Same racing heart: rollercoaster \u2192 excitement; public speaking \u2192 nervousness; horror movie \u2192 fear.\u003c/div>\\n\u003cul>\\n\u003cli>\u003cb>Aim:\u003c/b> investigate whether emotion results from physiological arousal and cognitive interpretation of that arousal.\u003c/li>\\n\u003cli>\u003cb>Participants:\u003c/b> 184 male university students.\u003c/li>\\n\u003cli>\u003cb>Step 1, injection:\u003c/b> told it was a vitamin (\\\"Suproxin\\\"). Actually \u003cb>epinephrine (adrenaline)\u003c/b>, which causes arousal (shaky hands, fast heart rate), or a \u003cb>placebo\u003c/b>.\u003c/li>\\n\u003cli>\u003cb>Step 2, information:\u003c/b> \u003ci>correctly informed\u003c/i> (real side effects), \u003ci>misinformed\u003c/i> (wrong side effects), or \u003ci>not informed\u003c/i>.\u003c/li>\\n\u003cli>\u003cb>Step 3, situation:\u003c/b> waited with a \u003cb>confederate\u003c/b> (actor) who acted either euphoric/happy or angry.\u003c/li>\\n\u003cli>\u003cb>Step 4, measurement:\u003c/b> observed behaviour and a self-report questionnaire.\u003c/li>\\n\u003cli>\u003cb>Results:\u003c/b> uninformed/misinformed participants adopted the confederate's emotion. Informed participants did not copy it and blamed their feelings on the injection.\u003c/li>\\n\u003cli>\u003cb>Conclusion:\u003c/b> same body reaction can produce different emotions depending on the explanation. A racing heart does not automatically mean fear.\u003c/li>\\n\u003c/ul>\\n\u003cp>\u003cb>Criticisms:\u003c/b> repeated studies found the confederate had only a small impact; the theory focuses on the autonomic nervous system and ignores emotional processes in the central nervous system.\u003c/p>\\n\u003cp>\u003cb>Evaluating results (from the Lesson 7 activity):\u003c/b> results support the theory if arousal was similar (e.g. heart rate), emotional ratings differed, and context appeared to influence emotion. They do not fully support it if everyone reported the same emotion, context made little difference, or arousal alone predicted emotion.\u003c/p>\\n\u003cp>\u003cb>Rationale formula:\u003c/b> Theory says\u2026 \u2192 Therefore\u2026 \u2192 In this experiment\u2026 \u2192 We predict\u2026\u003c/p>\\n\u003ch3>Appraisal theory (Arnold and Lazarus)\u003c/h3>\\n\u003cdiv class=\\\"box\\\">\u003cb>Appraisal = evaluating the situation \u003ci>before\u003c/i> the emotion.\u003c/b> The evaluation triggers body reactions and the emotion itself. Emotion starts with interpretation, not just body reaction. (Magda Arnold introduced appraisal; Richard Lazarus expanded it.)\u003c/div>\\n\u003cdiv class=\\\"tw\\\">\u003ctable>\\n\u003ctr>\u003cth>\u003c/th>\u003cth>Primary appraisal: \\\"Is this a problem for me?\\\"\u003c/th>\u003cth>Secondary appraisal: \\\"Can I cope with this?\\\"\u003c/th>\u003c/tr>\\n\u003ctr>\u003ctd>\u003cb>Judges\u003c/b>\u003c/td>\u003ctd>How important the situation is\u003c/td>\u003ctd>Skills, resources, support, past experience, personality\u003c/td>\u003c/tr>\\n\u003ctr>\u003ctd>\u003cb>Categories\u003c/b>\u003c/td>\u003ctd>\u003cb>Harm/loss\u003c/b> (damage already done: \\\"I failed the test\\\"); \u003cb>Threat\u003c/b> (possible future damage: \\\"I might fail the next one\\\"); \u003cb>Positive\u003c/b> (opportunity or improvement: \\\"I can study harder and improve\\\"); \u003cb>Neutral/irrelevant\u003c/b> (\\\"My neighbour failed, not me\\\")\u003c/td>\u003ctd>Determines how stressed or calm we feel\u003c/td>\u003c/tr>\\n\u003c/table>\u003c/div>\\n\u003cp>Primary and secondary appraisal happen almost at the same time. Emotion depends on both the situation and coping ability.\u003c/p>\\n\u003cp>\u003cb>Jamie's speech example:\u003c/b> heart races, sees speech as a threat (fear of negative judgment) \u2192 anxiety (primary). Then he considers his preparation, rehearsal and notes \u2192 anxiety stays but is less intense (secondary).\u003c/p>\\n\u003cfigure>\u003csvg viewBox=\\\"0 0 680 232\\\" role=\\\"img\\\" aria-label=\\\"Comparing the two theories of emotion\\\">\u003cdefs>\u003cmarker id=\\\"m5\\\" viewBox=\\\"0 0 10 10\\\" refX=\\\"9\\\" refY=\\\"5\\\" markerWidth=\\\"7\\\" markerHeight=\\\"7\\\" orient=\\\"auto-start-reverse\\\">\u003cpath d=\\\"M0 0L10 5L0 10z\\\" style=\\\"fill:var(--a)\\\"/>\u003c/marker>\u003c/defs>\u003ctext class=\\\"b\\\" x=\\\"10\\\" y=\\\"28\\\" text-anchor=\\\"start\\\">Schachter and Singer: two-factor theory\u003c/text>\u003crect class=\\\"n\\\" x=\\\"10\\\" y=\\\"40\\\" width=\\\"150\\\" height=\\\"56\\\" rx=\\\"7\\\"/>\u003ctext class=\\\"b\\\" x=\\\"85.0\\\" y=\\\"58.0\\\" text-anchor=\\\"middle\\\">Event\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"85.0\\\" y=\\\"72.0\\\" text-anchor=\\\"middle\\\">e.g. racing heart\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"85.0\\\" y=\\\"86.0\\\" text-anchor=\\\"middle\\\">on a rollercoaster\u003c/text>\u003crect class=\\\"n\\\" x=\\\"186\\\" y=\\\"40\\\" width=\\\"150\\\" height=\\\"56\\\" rx=\\\"7\\\"/>\u003ctext class=\\\"b\\\" x=\\\"261.0\\\" y=\\\"58.0\\\" text-anchor=\\\"middle\\\">Physiological\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"261.0\\\" y=\\\"72.0\\\" text-anchor=\\\"middle\\\">arousal\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"261.0\\\" y=\\\"86.0\\\" text-anchor=\\\"middle\\\">(body reacts first)\u003c/text>\u003crect class=\\\"n\\\" x=\\\"362\\\" y=\\\"40\\\" width=\\\"150\\\" height=\\\"56\\\" rx=\\\"7\\\"/>\u003ctext class=\\\"b\\\" x=\\\"437.0\\\" y=\\\"58.0\\\" text-anchor=\\\"middle\\\">Cognitive\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"437.0\\\" y=\\\"72.0\\\" text-anchor=\\\"middle\\\">interpretation\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"437.0\\\" y=\\\"86.0\\\" text-anchor=\\\"middle\\\">(label the cause)\u003c/text>\u003crect class=\\\"n hi\\\" x=\\\"538\\\" y=\\\"40\\\" width=\\\"132\\\" height=\\\"56\\\" rx=\\\"7\\\"/>\u003ctext class=\\\"b\\\" x=\\\"604.0\\\" y=\\\"65.0\\\" text-anchor=\\\"middle\\\">Emotion\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"604.0\\\" y=\\\"79.0\\\" text-anchor=\\\"middle\\\">excitement\u003c/text>\u003cpath class=\\\"ar\\\" d=\\\"M160 68 L186 68\\\" marker-end=\\\"url(#m5)\\\"/>\u003cpath class=\\\"ar\\\" d=\\\"M336 68 L362 68\\\" marker-end=\\\"url(#m5)\\\"/>\u003cpath class=\\\"ar\\\" d=\\\"M512 68 L538 68\\\" marker-end=\\\"url(#m5)\\\"/>\u003ctext class=\\\"b\\\" x=\\\"10\\\" y=\\\"148\\\" text-anchor=\\\"start\\\">Lazarus: appraisal theory\u003c/text>\u003crect class=\\\"n\\\" x=\\\"10\\\" y=\\\"160\\\" width=\\\"150\\\" height=\\\"56\\\" rx=\\\"7\\\"/>\u003ctext class=\\\"b\\\" x=\\\"85.0\\\" y=\\\"178.0\\\" text-anchor=\\\"middle\\\">Event\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"85.0\\\" y=\\\"192.0\\\" text-anchor=\\\"middle\\\">e.g. a speech\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"85.0\\\" y=\\\"206.0\\\" text-anchor=\\\"middle\\\">in front of the class\u003c/text>\u003crect class=\\\"n\\\" x=\\\"186\\\" y=\\\"160\\\" width=\\\"290\\\" height=\\\"56\\\" rx=\\\"7\\\"/>\u003ctext class=\\\"b\\\" x=\\\"331.0\\\" y=\\\"178.0\\\" text-anchor=\\\"middle\\\">Appraisal (evaluate first)\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"331.0\\\" y=\\\"192.0\\\" text-anchor=\\\"middle\\\">Primary: is this important to me?\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"331.0\\\" y=\\\"206.0\\\" text-anchor=\\\"middle\\\">Secondary: can I cope with it?\u003c/text>\u003crect class=\\\"n hi\\\" x=\\\"502\\\" y=\\\"160\\\" width=\\\"168\\\" height=\\\"56\\\" rx=\\\"7\\\"/>\u003ctext class=\\\"b\\\" x=\\\"586.0\\\" y=\\\"185.0\\\" text-anchor=\\\"middle\\\">Arousal + emotion\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"586.0\\\" y=\\\"199.0\\\" text-anchor=\\\"middle\\\">e.g. anxiety\u003c/text>\u003cpath class=\\\"ar\\\" d=\\\"M160 188 L186 188\\\" marker-end=\\\"url(#m5)\\\"/>\u003cpath class=\\\"ar\\\" d=\\\"M476 188 L502 188\\\" marker-end=\\\"url(#m5)\\\"/>\u003c/svg>\u003cfigcaption>The key difference is the order. Two-factor: body arousal comes first, then we interpret it. Appraisal: we evaluate the situation first, and that triggers arousal and emotion.\u003c/figcaption>\u003c/figure>\\n\u003cdiv class=\\\"tw\\\">\u003ctable>\\n\u003ctr>\u003cth>Two-factor theory (Schachter and Singer)\u003c/th>\u003cth>Appraisal theory (Lazarus)\u003c/th>\u003c/tr>\\n\u003ctr>\u003ctd>Body arousal comes first, then we interpret it to produce emotion\u003c/td>\u003ctd>We evaluate the situation first, which triggers arousal and emotion\u003c/td>\u003c/tr>\\n\u003ctr>\u003ctd>Physiological reaction + cognitive label\u003c/td>\u003ctd>Primary appraisal + secondary appraisal\u003c/td>\u003c/tr>\\n\u003c/table>\u003c/div>\", \"qs\": [{\"t\": \"c\", \"r\": \"Q1\", \"q\": \"Identify the three components of emotion.\", \"a\": \"Physiological changes, subjective feelings, and behavioural/expressive responses.\"}, {\"t\": \"h\", \"r\": \"Q2\", \"q\": \"Explain the two-factor theory with an example.\", \"a\": \"Emotion needs physiological arousal plus a cognitive interpretation of its cause. Walking alone in the dark with a racing heart and sweating, you label it fear; the same arousal at a concert you label excitement.\"}, {\"t\": \"c\", \"r\": \"Q3\", \"q\": \"Explain the two components of appraisal theory.\", \"a\": \"Primary appraisal judges whether the situation is harmful, threatening, positive or irrelevant to you. Secondary appraisal judges whether you can cope, using your skills, resources and support.\"}, {\"t\": \"h\", \"r\": \"Q4\", \"q\": \"Distinguish physiological reaction from cognitive assessment (Schachter and Singer).\", \"a\": \"The physiological reaction is the body's arousal (racing heart, sweating). The cognitive assessment is the mind's explanation of what caused it. The label given decides which emotion is felt.\"}, {\"t\": \"h\", \"r\": \"Q5\", \"q\": \"Compare primary and secondary appraisal.\", \"a\": \"Primary: \\\"Is this important or a problem for me?\\\" (judges the situation). Secondary: \\\"Can I handle this?\\\" (judges coping resources). Both happen almost together and together determine the emotion and its intensity.\"}, {\"t\": \"x\", \"r\": \"Q6\", \"q\": \"A student's heart races before an exam. Explain the emotion they feel using BOTH the two-factor theory and appraisal theory.\", \"a\": \"Two-factor: the racing heart (arousal) comes first, then the student interprets it as nervousness because of the exam. Appraisal: the student first judges the exam (primary appraisal: a threat?) and whether they can cope (secondary appraisal), and that evaluation triggers the arousal and the emotion.\"}]}, {\"id\": \"E2\", \"wk\": \"Emotion and wellbeing (Lessons 7, 9 and 10)\", \"title\": \"E2 Coping and reappraisal\", \"th\": \"\u003cp>\u003cb>Coping potential\u003c/b> (part of secondary appraisal) is the ability to use problem-focused or emotion-focused coping.\u003c/p>\\n\u003cdiv class=\\\"g2\\\">\\n\u003cdiv class=\\\"sc\\\">\u003ch3>Problem-focused\u003c/h3>\u003cp>Deals with the \u003cb>cause\u003c/b> practically to reduce stress.\u003c/p>\u003cul>\\n\u003cli>\u003cb>Take control:\u003c/b> lost your job \u2192 update resume, search online\u003c/li>\\n\u003cli>\u003cb>Seek information:\u003c/b> diagnosed with an illness \u2192 get a second opinion\u003c/li>\\n\u003cli>\u003cb>Evaluate pros and cons:\u003c/b> list positives and negatives to clarify a decision\u003c/li>\u003c/ul>\u003c/div>\\n\u003cdiv class=\\\"sc\\\">\u003ch3>Emotion-focused\u003c/h3>\u003cp>Reduces the negative \u003cb>feelings\u003c/b> (embarrassment, fear, anxiety, frustration).\u003c/p>\u003cul>\\n\u003cli>Meditation, relaxation\u003c/li>\u003cli>Talking to friends and family\u003c/li>\u003cli>Physical exercise\u003c/li>\\n\u003cli>Distraction (TV, reading, games)\u003c/li>\u003cli>Denial or ignoring the problem\u003c/li>\u003cli>Expecting the worst-case scenario\u003c/li>\u003c/ul>\u003c/div>\\n\u003c/div>\\n\u003cdiv class=\\\"box\\\">\u003cb>Reappraisal:\u003c/b> a continual process of re-evaluating the situation and coping potential as new information arrives, which can change the emotion. It is a regulation strategy and a key mechanism in adaptive emotion regulation. Jamie lists the positives (sharing a topic, practising skills), recalls past successes, and reframes nerves as enthusiasm, so anxiety becomes a composed, motivated state.\u003c/div>\", \"qs\": [{\"t\": \"h\", \"r\": \"Q1\", \"q\": \"Classify each as problem-focused or emotion-focused coping: (a) making a study timetable after a poor result (b) going for a run to calm down (c) asking a teacher for feedback (d) ignoring the result.\", \"a\": \"(a) Problem-focused (taking control). (b) Emotion-focused (reducing feelings). (c) Problem-focused (seeking information). (d) Emotion-focused (denial or avoidance).\"}, {\"t\": \"c\", \"r\": \"Q2\", \"q\": \"What is reappraisal?\", \"a\": \"A continual process of re-evaluating the situation and your ability to cope as new information arrives, which can change the emotion felt (for example, reframing nerves as enthusiasm).\"}]}, {\"id\": \"E3\", \"wk\": \"Emotion and wellbeing (Lessons 7, 9 and 10)\", \"title\": \"E3 Physiology of emotion: limbic system and LeDoux (Lesson 10)\", \"th\": \"\u003cul>\\n\u003cli>Emotions involve the autonomic nervous system (heart rate, breathing, blood pressure changes) and limbic system structures.\u003c/li>\\n\u003cli>\u003cb>Limbic system:\u003c/b> interconnected brain areas, one of the oldest parts of the brain. Involved in recognising, expressing and regulating emotion, plus motivation, memory and learning.\u003c/li>\\n\u003cli>Knowledge comes from brain injury (lesion) studies, behavioural experiments and brain imaging. Key researchers: \u003cb>Papez, MacLean, LeDoux\u003c/b>.\u003c/li>\\n\u003c/ul>\\n\u003cdiv class=\\\"tw\\\">\u003ctable>\\n\u003ctr>\u003cth>Structure\u003c/th>\u003cth>Basic job\u003c/th>\u003cth>Role in emotion\u003c/th>\u003c/tr>\\n\u003ctr>\u003ctd>\u003cb>Thalamus\u003c/b>\u003c/td>\u003ctd>Sensory relay station\u003c/td>\u003ctd>Sends incoming sensory information (except smell) to the right brain areas\u003c/td>\u003c/tr>\\n\u003ctr>\u003ctd>\u003cb>Hypothalamus\u003c/b>\u003c/td>\u003ctd>Body regulation (\\\"body reaction\\\")\u003c/td>\u003ctd>Controls fight-flight-freeze and body reactions (heart rate, sweating, temperature)\u003c/td>\u003c/tr>\\n\u003ctr>\u003ctd>\u003cb>Amygdala\u003c/b>\u003c/td>\u003ctd>Emotion alarm system\u003c/td>\u003ctd>Detects danger and fear, triggers strong reactions, helps recognise emotions in others\u003c/td>\u003c/tr>\\n\u003ctr>\u003ctd>\u003cb>Hippocampus\u003c/b>\u003c/td>\u003ctd>Memory and context\u003c/td>\u003ctd>Stores emotional memories; remembers where and when events happened\u003c/td>\u003c/tr>\\n\u003ctr>\u003ctd>\u003cb>Cingulate gyrus\u003c/b>\u003c/td>\u003ctd>Emotional awareness and attention\u003c/td>\u003ctd>Lets you consciously feel emotions and focus on them (including physical or social pain)\u003c/td>\u003c/tr>\\n\u003ctr>\u003ctd>\u003cb>Basal ganglia\u003c/b>\u003c/td>\u003ctd>Reward, habits, decisions\u003c/td>\u003ctd>Recognises emotions in others, processes rewards (dopamine), influences emotional decisions\u003c/td>\u003c/tr>\\n\u003c/table>\u003c/div>\\n\u003ch3>LeDoux's biological model (two pathways, especially for fear)\u003c/h3>\\n\u003cdiv class=\\\"tw\\\">\u003ctable>\\n\u003ctr>\u003cth>\u003c/th>\u003cth>Short route (unconscious)\u003c/th>\u003cth>Long route (conscious)\u003c/th>\u003c/tr>\\n\u003ctr>\u003ctd>\u003cb>Path\u003c/b>\u003c/td>\u003ctd>Thalamus \u2192 Amygdala \u2192 Hypothalamus \u2192 ANS (bypasses sensory cortex and hippocampus)\u003c/td>\u003ctd>Thalamus \u2192 Cortex and Hippocampus \u2192 Amygdala \u2192 Hypothalamus\u003c/td>\u003c/tr>\\n\u003ctr>\u003ctd>\u003cb>Speed\u003c/b>\u003c/td>\u003ctd>Fast but can be inaccurate\u003c/td>\u003ctd>Slower but accurate\u003c/td>\u003c/tr>\\n\u003ctr>\u003ctd>\u003cb>Response\u003c/b>\u003c/td>\u003ctd>\\\"Thoughtless\\\", automatic; prepares for fight-flight-freeze; useful for survival\u003c/td>\u003ctd>\\\"Thoughtful\\\" appraisal; more appropriate response\u003c/td>\u003c/tr>\\n\u003ctr>\u003ctd>\u003cb>Example\u003c/b>\u003c/td>\u003ctd>Jump at a stick you think is a snake\u003c/td>\u003ctd>Realise it is a stick, calm down\u003c/td>\u003c/tr>\\n\u003c/table>\u003c/div>\\n\u003cfigure>\u003csvg viewBox=\\\"0 90 720 185\\\" role=\\\"img\\\" aria-label=\\\"LeDoux's short and long pathways for emotion\\\">\u003cdefs>\u003cmarker id=\\\"m6\\\" viewBox=\\\"0 0 10 10\\\" refX=\\\"9\\\" refY=\\\"5\\\" markerWidth=\\\"7\\\" markerHeight=\\\"7\\\" orient=\\\"auto-start-reverse\\\">\u003cpath d=\\\"M0 0L10 5L0 10z\\\" style=\\\"fill:var(--a)\\\"/>\u003c/marker>\u003c/defs>\u003crect class=\\\"n\\\" x=\\\"8\\\" y=\\\"110\\\" width=\\\"84\\\" height=\\\"44\\\" rx=\\\"7\\\"/>\u003ctext class=\\\"b\\\" x=\\\"50.0\\\" y=\\\"129.0\\\" text-anchor=\\\"middle\\\">Emotional\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"50.0\\\" y=\\\"143.0\\\" text-anchor=\\\"middle\\\">stimulus\u003c/text>\u003crect class=\\\"n\\\" x=\\\"120\\\" y=\\\"110\\\" width=\\\"92\\\" height=\\\"44\\\" rx=\\\"7\\\"/>\u003ctext class=\\\"b\\\" x=\\\"166.0\\\" y=\\\"129.0\\\" text-anchor=\\\"middle\\\">Thalamus\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"166.0\\\" y=\\\"143.0\\\" text-anchor=\\\"middle\\\">sensory relay\u003c/text>\u003crect class=\\\"n hi\\\" x=\\\"395\\\" y=\\\"110\\\" width=\\\"100\\\" height=\\\"44\\\" rx=\\\"7\\\"/>\u003ctext class=\\\"b\\\" x=\\\"445.0\\\" y=\\\"129.0\\\" text-anchor=\\\"middle\\\">Amygdala\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"445.0\\\" y=\\\"143.0\\\" text-anchor=\\\"middle\\\">alarm system\u003c/text>\u003crect class=\\\"n\\\" x=\\\"520\\\" y=\\\"110\\\" width=\\\"120\\\" height=\\\"44\\\" rx=\\\"7\\\"/>\u003ctext class=\\\"b\\\" x=\\\"580.0\\\" y=\\\"129.0\\\" text-anchor=\\\"middle\\\">Hypothalamus\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"580.0\\\" y=\\\"143.0\\\" text-anchor=\\\"middle\\\">body reaction\u003c/text>\u003crect class=\\\"n\\\" x=\\\"650\\\" y=\\\"176\\\" width=\\\"62\\\" height=\\\"44\\\" rx=\\\"7\\\"/>\u003ctext class=\\\"b\\\" x=\\\"681.0\\\" y=\\\"195.0\\\" text-anchor=\\\"middle\\\">ANS\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"681.0\\\" y=\\\"209.0\\\" text-anchor=\\\"middle\\\">body\u003c/text>\u003crect class=\\\"n\\\" x=\\\"250\\\" y=\\\"196\\\" width=\\\"140\\\" height=\\\"48\\\" rx=\\\"7\\\"/>\u003ctext class=\\\"b\\\" x=\\\"320.0\\\" y=\\\"217.0\\\" text-anchor=\\\"middle\\\">Cortex +\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"320.0\\\" y=\\\"231.0\\\" text-anchor=\\\"middle\\\">Hippocampus\u003c/text>\u003cpath class=\\\"ar\\\" d=\\\"M92 132 L120 132\\\" marker-end=\\\"url(#m6)\\\"/>\u003cpath class=\\\"ar\\\" d=\\\"M212 132 L395 132\\\" marker-end=\\\"url(#m6)\\\"/>\u003ctext class=\\\"b\\\" x=\\\"303\\\" y=\\\"122\\\" text-anchor=\\\"middle\\\">SHORT route\u003c/text>\u003ctext class=\\\"xs\\\" x=\\\"303\\\" y=\\\"106\\\" text-anchor=\\\"middle\\\">fast, unconscious, can be wrong\u003c/text>\u003cpath class=\\\"ar\\\" d=\\\"M166 154 L166 220 L250 220\\\" marker-end=\\\"url(#m6)\\\"/>\u003cpath class=\\\"ar\\\" d=\\\"M390 220 L445 220 L445 154\\\" marker-end=\\\"url(#m6)\\\"/>\u003ctext class=\\\"b\\\" x=\\\"205\\\" y=\\\"262\\\" text-anchor=\\\"start\\\">LONG route: slower, conscious, accurate\u003c/text>\u003cpath class=\\\"ar\\\" d=\\\"M495 132 L520 132\\\" marker-end=\\\"url(#m6)\\\"/>\u003cpath class=\\\"ar\\\" d=\\\"M580 154 L580 198 L650 198\\\" marker-end=\\\"url(#m6)\\\"/>\u003c/svg>\u003cfigcaption>Short route: thalamus to amygdala, bypassing the cortex and hippocampus (a quick 'thoughtless' reaction). Long route: thalamus to cortex and hippocampus, then amygdala, allowing a thoughtful appraisal. The hypothalamus and ANS produce the body response.\u003c/figcaption>\u003c/figure>\\n\u003cp>\u003cb>ANS role:\u003c/b> the sympathetic system turns the body ON (heart rate and breathing up); the parasympathetic calms it AFTER danger passes.\u003c/p>\", \"qs\": [{\"t\": \"h\", \"r\": \"Q1\", \"q\": \"Compare LeDoux's short and long pathways.\", \"a\": \"Short: thalamus straight to amygdala; fast, unconscious, can be wrong, aids survival. Long: thalamus to cortex and hippocampus then amygdala; slower, conscious, accurate, allows a planned response.\"}, {\"t\": \"c\", \"r\": \"Q2\", \"q\": \"State the role of the amygdala and the hippocampus in emotion.\", \"a\": \"Amygdala: the emotion alarm system that detects danger and triggers fear responses. Hippocampus: stores emotional memories and remembers where and when events happened.\"}]}, {\"id\": \"E4\", \"wk\": \"Emotion and wellbeing (Lessons 7, 9 and 10)\", \"title\": \"E4 Happiness and flow (Lesson 10)\", \"th\": \"\u003cul>\\n\u003cli>Happiness is a complex, multifaceted construct: \u003cb>wellbeing + positive emotions + life satisfaction\u003c/b>. It is not constant pleasure and often includes challenges.\u003c/li>\\n\u003cli>Studied because it is linked to better mental and physical health, stronger relationships, success at work and longer life. (About 6% of all books are about happiness.)\u003c/li>\\n\u003cli>\u003cb>Measured\u003c/b> by self-reports or reports from family/friends. Not always accurate, since people may present as happier than they feel.\u003c/li>\\n\u003cli>These factors \u003cb>do not simply cause happiness\u003c/b>: they both affect it AND are affected by it.\u003c/li>\\n\u003c/ul>\\n\u003cdiv class=\\\"tw\\\">\u003ctable>\\n\u003ctr>\u003cth>Factor\u003c/th>\u003cth>Key point\u003c/th>\u003c/tr>\\n\u003ctr>\u003ctd>\u003cb>Age\u003c/b>\u003c/td>\u003ctd>Younger people may feel more intense happiness; older people experience wider contentment\u003c/td>\u003c/tr>\\n\u003ctr>\u003ctd>\u003cb>Physical health\u003c/b>\u003c/td>\u003ctd>Generally strongest from adolescence to middle age; lower illness risk and less age-related decline link to higher happiness\u003c/td>\u003c/tr>\\n\u003ctr>\u003ctd>\u003cb>Culture\u003c/b>\u003c/td>\u003ctd>Cultural values shape what people think brings happiness. Bhutan shows strong social expectations and lower stress can support high happiness without high wealth\u003c/td>\u003c/tr>\\n\u003ctr>\u003ctd>\u003cb>Religion\u003c/b>\u003c/td>\u003ctd>Active practitioners often report higher happiness, likely from regular social interaction, community and belonging\u003c/td>\u003c/tr>\\n\u003ctr>\u003ctd>\u003cb>Income and employment\u003c/b>\u003c/td>\u003ctd>Employment and enough income for basic needs raise happiness; beyond that, more money adds little\u003c/td>\u003c/tr>\\n\u003ctr>\u003ctd>\u003cb>Intentional activities\u003c/b>\u003c/td>\u003ctd>Deliberate behaviours chosen to boost happiness: mindfulness, flow activities, gratitude, acts of kindness\u003c/td>\u003c/tr>\\n\u003c/table>\u003c/div>\\n\u003ch3>The flow experience (Csikszentmihalyi, 1975)\u003c/h3>\\n\u003cdiv class=\\\"box\\\">\u003cb>Flow\u003c/b> = a mental state of complete focus and immersion in an activity. It occurs when \u003cb>skill level matches challenge\u003c/b>. Seen in artists and musicians absorbed in creating. People are often happiest in flow.\u003c/div>\\n\u003cfigure>\u003csvg viewBox=\\\"0 0 620 272\\\" role=\\\"img\\\" aria-label=\\\"Flow occurs when skill matches challenge\\\">\u003cpolygon points=\\\"70,230 70,200 250,20 280,20 280,50 100,230\\\" fill=\\\"#2e9e6b\\\" fill-opacity=\\\".35\\\" stroke=\\\"#2e9e6b\\\" stroke-width=\\\"2\\\"/>\u003cline x1=\\\"60\\\" y1=\\\"240\\\" x2=\\\"360\\\" y2=\\\"240\\\" class=\\\"ln\\\"/>\u003cline x1=\\\"60\\\" y1=\\\"240\\\" x2=\\\"60\\\" y2=\\\"10\\\" class=\\\"ln\\\"/>\u003ctext class=\\\"s\\\" x=\\\"210\\\" y=\\\"262\\\" text-anchor=\\\"middle\\\">Skill level \u2192\u003c/text>\u003ctext class=\\\"s\\\" transform=\\\"translate(22 130) rotate(-90)\\\" text-anchor=\\\"middle\\\">Challenge \u2192\u003c/text>\u003ctext class=\\\"b\\\" transform=\\\"translate(150 140) rotate(-45)\\\" text-anchor=\\\"middle\\\">FLOW\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"120\\\" y=\\\"42\\\" text-anchor=\\\"middle\\\">Challenge higher\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"120\\\" y=\\\"56\\\" text-anchor=\\\"middle\\\">than skill\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"300\\\" y=\\\"208\\\" text-anchor=\\\"middle\\\">Challenge lower\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"300\\\" y=\\\"222\\\" text-anchor=\\\"middle\\\">than skill\u003c/text>\u003ctext class=\\\"b\\\" x=\\\"400\\\" y=\\\"70\\\" text-anchor=\\\"start\\\">Flow happens when\u003c/text>\u003ctext class=\\\"b\\\" x=\\\"400\\\" y=\\\"88\\\" text-anchor=\\\"start\\\">skill matches challenge.\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"400\\\" y=\\\"114\\\" text-anchor=\\\"start\\\">To stay in flow, the\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"400\\\" y=\\\"128\\\" text-anchor=\\\"start\\\">challenge must keep\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"400\\\" y=\\\"142\\\" text-anchor=\\\"start\\\">rising as skill grows.\u003c/text>\u003c/svg>\u003cfigcaption>Flow (Csikszentmihalyi, 1975) sits in the band where skill level and challenge are balanced.\u003c/figcaption>\u003c/figure>\\n\u003cp>\u003cb>Six features:\u003c/b>\u003c/p>\\n\u003cul>\\n\u003cli>Intense, focused concentration on the present moment\u003c/li>\\n\u003cli>Merging of action and awareness\u003c/li>\\n\u003cli>Loss of reflective self-consciousness\u003c/li>\\n\u003cli>A sense of personal control over the situation/activity\u003c/li>\\n\u003cli>An altered experience of time\u003c/li>\\n\u003cli>Experiencing the activity as rewarding\u003c/li>\\n\u003c/ul>\\n\u003cdiv class=\\\"g2\\\">\\n\u003cdiv class=\\\"sc\\\">\u003ch3>Benefits\u003c/h3>\u003cul>\u003cli>More positive affect and life satisfaction (Diener's subjective wellbeing)\u003c/li>\u003cli>Greater happiness and success; sense of accomplishment\u003c/li>\u003cli>Develops skills and expertise (needs increasing challenge); builds confidence\u003c/li>\u003cli>Higher intrinsic motivation, self-directed learning, better performance, lower anxiety, higher self-esteem\u003c/li>\u003cli>Practice improves performance, which makes flow more likely again\u003c/li>\u003c/ul>\u003c/div>\\n\u003cdiv class=\\\"sc\\\">\u003ch3>Criticisms and concerns\u003c/h3>\u003cul>\u003cli>Can become addictive for frequent experiencers\u003c/li>\u003cli>Everyday life may feel boring or less rewarding by comparison\u003c/li>\u003cli>Can make coping with normal activities harder\u003c/li>\u003c/ul>\u003cp>Flow is a key concept in \u003cb>positive psychology\u003c/b> (focus on wellbeing, not illness).\u003c/p>\u003c/div>\\n\u003c/div>\", \"qs\": [{\"t\": \"c\", \"r\": \"Q1\", \"q\": \"List the six features of the flow experience.\", \"a\": \"Intense focused concentration on the present; merging of action and awareness; loss of self-consciousness; a sense of personal control; an altered sense of time; the activity feels rewarding.\"}, {\"t\": \"h\", \"r\": \"Q2\", \"q\": \"Explain why age, health or culture are not simple causes of happiness.\", \"a\": \"These factors both affect happiness and are affected by it (for example, happier people may stay healthier), and happiness is measured by self-report that is not always accurate, so the relationship is two-way and not simply cause and effect.\"}]}];\nconst GR=[[\"Topic 1: Role of the brain\", [\"B1\", \"B2\", \"B3\", \"B4\", \"B5\", \"B6\"]], [\"Topic 2: Intelligence\", [\"I1\", \"I2\", \"I3\", \"I4\", \"I5\", \"I6\"]], [\"Emotion and wellbeing\", [\"E1\", \"E2\", \"E3\", \"E4\"]]];\nconst SH={\"B1\": \"Neuron\", \"B2\": \"Brain regions\", \"B3\": \"Lobes\", \"B4\": \"Localisation\", \"B5\": \"History & ethics\", \"B6\": \"Nervous system\", \"I1\": \"IQ\", \"I2\": \"IQ tests\", \"I3\": \"Validity & reliability\", \"I4\": \"Heritability\", \"I5\": \"Nature & nurture\", \"I6\": \"IQ vs EQ\", \"E1\": \"Emotion theories\", \"E2\": \"Coping\", \"E3\": \"Limbic system\", \"E4\": \"Happiness & flow\"};\nconst BL={\"B1\": \"The five parts of a neuron and how a signal travels from dendrites to axon terminals.\", \"B2\": \"Hindbrain, midbrain and forebrain: structures and the behaviours each controls.\", \"B3\": \"The cortex, four lobes, primary areas and contralateral organisation.\", \"B4\": \"Broca's, Wernicke's and Geschwind's areas, and predicting the effects of damage.\", \"B5\": \"Gage, lobotomy, H.M. and more: how knowledge was gained and the ethics involved.\", \"B6\": \"CNS, PNS, somatic and autonomic systems, sympathetic and parasympathetic.\", \"I1\": \"What IQ is, the psychometric approach, the bell curve and how scores are compared.\", \"I2\": \"How the Stanford-Binet, WAIS-IV and WISC-V measure intelligence.\", \"I3\": \"Validity and reliability applied to IQ tests, and where they fall short.\", \"I4\": \"Twin, family and adoption studies, including the Minnesota study.\", \"I5\": \"How genes and environment interact to shape intelligence.\", \"I6\": \"Are IQ and EQ tests accurate, misleading or both?\", \"E1\": \"Components of emotion, two-factor theory and appraisal theory.\", \"E2\": \"Problem-focused and emotion-focused coping, and reappraisal.\", \"E3\": \"Limbic system structures and LeDoux's short and long pathways.\", \"E4\": \"What happiness is, what affects it, and the flow experience.\"};\nconst EX={\"B1\": [[\"Trace what happens when a neuron receives a message from another neuron and passes it on.\", \"1. Neurotransmitters from the previous neuron reach the \u003cb>dendrites\u003c/b>.\u003cbr>2. The \u003cb>cell body\u003c/b> combines the incoming signals and decides whether to fire.\u003cbr>3. The impulse travels along the \u003cb>axon\u003c/b>, sped up by the \u003cb>myelin sheath\u003c/b>.\u003cbr>4. At the \u003cb>axon terminals\u003c/b>, neurotransmitters are released into the synapse.\u003cbr>5. They pass the message on to the next neuron's dendrites.\"], [\"A disease strips the myelin from motor neurons. Predict the effect on movement.\", \"Myelin insulates the axon and speeds up the impulse. Without it, messages slow down or are disrupted, so muscles receive commands late or not at all. Expect weakness and slow or poorly coordinated movement.\"]], \"B2\": [[\"Name the structure and region for each: (a) controlling breathing during sleep (b) learning to ride a bike smoothly (c) planning tomorrow's study (d) turning your head toward a sudden noise.\", \"(a) Medulla, hindbrain: breathing and heart rate.\u003cbr>(b) Cerebellum, hindbrain: coordination and motor learning.\u003cbr>(c) Frontal cortex of the cerebrum, forebrain: planning.\u003cbr>(d) Midbrain (colliculi): reflex responses to sights and sounds.\"], [\"Why is damage to the brainstem often more life-threatening than damage to part of the forebrain?\", \"The brainstem includes the medulla and pons, which control breathing and heart rate. If these stop, survival is at risk. Forebrain damage usually changes thinking, movement or emotion rather than stopping vital functions.\"]], \"B3\": [[\"After an accident, a person can see and hear normally but cannot recognise familiar voices or faces. Which lobe is most likely affected?\", \"The \u003cb>temporal lobe\u003c/b>, which is involved in recognising voices, faces and objects, as well as hearing and memory.\"], [\"A stroke damages the left primary motor cortex. Which side of the body is affected and why?\", \"The \u003cb>right\u003c/b> side. Each hemisphere controls the opposite side of the body (contralateral organisation).\"]], \"B4\": [[\"Sam understands everything said to him but speaks slowly in short, halting phrases. Predict the damaged area and explain.\", \"\u003cb>Broca's area\u003c/b> (left frontal lobe), which controls speech production. This is Broca's aphasia: understanding is mostly intact but speech is slow and effortful. This is localisation of function: damage to one area affects one function.\"], [\"Explain how Broca's work with the patient 'Tan' supports localisation of function.\", \"Tan understood language but could only say 'tan'. After his death, an autopsy found damage in the left frontal lobe. Matching a specific loss (speech) to a specific damaged area, and finding the same pattern in later patients, showed that speech production is localised.\"]], \"B5\": [[\"Evaluate the ethics of lobotomy using three ethical ideas.\", \"\u003cb>Informed consent:\u003c/b> many patients were vulnerable (including children and people in institutions) and could not truly consent.\u003cbr>\u003cb>Harm and benefit:\u003c/b> there was little evidence it helped, yet it caused apathy, loss of personality, brain damage and death.\u003cbr>\u003cb>Vulnerable people:\u003c/b> patients with serious illness were easily pressured.\u003cbr>Overall the harms outweighed the benefits, so it is seen as unethical by modern standards.\"], [\"What can and what can't we conclude from one case such as Phineas Gage?\", \"We can say the frontal lobe is likely involved in personality, planning and impulse control. We cannot generalise to everyone: it is a single case, there was no control group or brain scan, and details came from second-hand reports.\"]], \"B6\": [[\"Describe the pathway when you touch a hot pan and pull your hand away.\", \"Skin receptors detect the heat. \u003cb>Sensory neurons\u003c/b> (PNS) carry the signal to the \u003cb>spinal cord\u003c/b>. The spinal cord triggers a \u003cb>reflex\u003c/b> and \u003cb>motor neurons\u003c/b> (PNS) tell the muscles to pull the hand away. The signal also goes up to the \u003cb>brain\u003c/b>, which recognises the sensation as pain.\"], [\"A loud bang makes your heart race. Which parts of the nervous system are involved?\", \"The perceived threat activates the \u003cb>sympathetic\u003c/b> branch of the \u003cb>autonomic\u003c/b> nervous system (part of the PNS), which speeds up heart rate and breathing automatically. Afterwards the \u003cb>parasympathetic\u003c/b> branch calms the body and restores normal function.\"]], \"I1\": [[\"A child aged 8 performs like an average 10-year-old. Calculate the ratio IQ.\", \"IQ = (mental age \u00f7 chronological age) \u00d7 100 = (10 \u00f7 8) \u00d7 100 = 125.\"], [\"With a mean of 100 and standard deviation of 15, about what percentage of people score above 115?\", \"About 68% score between 85 and 115, so about 32% score outside that range. Half of these (about 16%) score above 115.\"]], \"I2\": [[\"Choose the right Wechsler test for (a) a 14-year-old and (b) a 35-year-old, and name the index scores.\", \"(a) \u003cb>WISC-V\u003c/b> (ages 6 to 16): Verbal Comprehension, Visual Spatial, Fluid Reasoning, Working Memory, Processing Speed.\u003cbr>(b) \u003cb>WAIS-IV\u003c/b> (ages 16 to 90): Verbal Comprehension, Perceptual Reasoning, Working Memory, Processing Speed.\"], [\"A child has a high Verbal Comprehension score but a low Processing Speed score. What does this show?\", \"The child is strong at verbal reasoning and knowledge but slower at quick tasks such as Coding. The index scores give a profile of strengths and weaknesses that a single IQ number hides.\"]], \"I3\": [[\"A person scores 98 on an IQ test and 99 on the same test a week later. Which concept does this show?\", \"\u003cb>Reliability\u003c/b> (test-retest): the test gives consistent results. It does not by itself show the test is valid.\"], [\"A test written with English idioms is given to a student who has just learned English. Which concept is threatened?\", \"\u003cb>Validity.\u003c/b> A low score may reflect language difficulty rather than low intelligence, so the test is not measuring what it claims to (cultural and language bias).\"]], \"I4\": [[\"Interpret the Minnesota result of about .70 for identical twins reared apart.\", \"These twins share about 100% of their genes but grew up in different homes. A correlation of about .70 means their IQs were very similar despite different environments, suggesting about 70% of the variation in IQ is associated with genetic differences.\"], [\"Give two criticisms of the Minnesota study.\", \"1. Small, self-selected sample (twins recruited through publicity).\u003cbr>2. Many twins had contact before testing and were not separated at birth, and adoptive homes were often similar, so environment may not have been fully different.\"]], \"I5\": [[\"Explain how the Flynn effect supports the role of environment.\", \"Average IQ scores rose about 3 points per decade. Genes cannot change that fast across a population, so improvements in nutrition, schooling and stimulation are likely causes.\"], [\"A child has genes for high ability but grows up with very little stimulation. Predict the outcome using reaction range.\", \"Genes set a range of possible outcomes. In a poor environment the child is likely to end up at the lower end of that range; in an enriched environment they would reach the upper end.\"]], \"I6\": [[\"Evaluate whether a self-report EQ questionnaire is a valid measure of emotional intelligence.\", \"Concerns: answers can be faked or inflated; it measures how people see themselves rather than their actual ability; scores overlap with personality; there is no agreed definition of EQ. So its validity is weaker than IQ tests, although it may still capture useful information about emotional skills.\"], [\"Should a school use only an IQ test to judge a student's potential?\", \"No. IQ tests are reliable and predict school results moderately well (correlation about .5), but they are narrow, can be culturally biased, are affected by anxiety and conditions, and ignore creativity and emotional skills. Use IQ alongside other evidence.\"]], \"E1\": [[\"You hear a noise at night and your heart races. You then realise it is your cat. Explain the emotion using two-factor theory.\", \"Physiological arousal (racing heart) comes first. Then you interpret the cause. If you label it as an intruder you feel fear; once you label it as the cat you feel relief. The same arousal gives different emotions depending on the cognitive label.\"], [\"Use appraisal theory to explain Jamie's anxiety before a speech and why it eases.\", \"\u003cb>Primary appraisal:\u003c/b> Jamie sees the speech as a threat (fear of being judged), producing anxiety.\u003cbr>\u003cb>Secondary appraisal:\u003c/b> Jamie considers preparation, rehearsal and notes, so the coping potential is high and the anxiety becomes less intense.\"]], \"E2\": [[\"After failing a test, give one problem-focused and one emotion-focused response.\", \"Problem-focused: make a study plan or ask the teacher for feedback (dealing with the cause).\u003cbr>Emotion-focused: go for a run or talk to a friend to reduce the stress (dealing with the feelings).\"], [\"A student is nervous before a presentation. Show how reappraisal could change the emotion.\", \"The student lists positives (they know the topic, they have practised), recalls past successes and reframes nervous energy as enthusiasm. Re-evaluating the situation and coping ability reduces anxiety and turns it into a more motivated state.\"]], \"E3\": [[\"A stick on a walking track looks like a snake and you jump. Explain using LeDoux's pathways.\", \"\u003cb>Short route:\u003c/b> thalamus \u2192 amygdala \u2192 hypothalamus. It is fast and unconscious, so you jump before thinking.\u003cbr>\u003cb>Long route:\u003c/b> thalamus \u2192 cortex and hippocampus \u2192 amygdala. This slower route identifies it as a stick and you calm down.\"], [\"Why is it useful to have a fast route even though it can be wrong?\", \"If the object were a real snake, reacting quickly could save you. A false alarm costs little, but being too slow could cost a lot, so the fast route has a survival advantage.\"]], \"E4\": [[\"A guitarist loses track of time while practising a song slightly beyond their current skill. Which flow features appear?\", \"Intense concentration on the present, altered experience of time, loss of self-consciousness, a sense of control, and the activity feeling rewarding. This fits flow because the challenge matches their skill.\"], [\"Explain why more money does not keep increasing happiness.\", \"Employment and enough income for basic needs raise happiness, but beyond that more money adds little. Other factors such as relationships, health and meaningful activities matter more.\"]]};\nconst FC=[[\"Neuron: dendrites\", \"Receive signals from other neurons and pass them to the cell body.\"], [\"Neuron: cell body (soma)\", \"Contains the nucleus; keeps the cell alive and combines incoming signals.\"], [\"Neuron: axon\", \"Long fibre that carries the electrical impulse away from the cell body.\"], [\"Neuron: myelin sheath\", \"Fatty insulating layer around the axon that speeds up the signal.\"], [\"Neuron: axon terminals\", \"Release neurotransmitters into the synapse to pass the message on.\"], [\"Hindbrain\", \"Medulla, pons, cerebellum: breathing, heart rate, balance, coordination.\"], [\"Midbrain\", \"Reflexes to sights and sounds, alertness and movement control.\"], [\"Forebrain\", \"Cerebrum, thalamus, hypothalamus, limbic system: thought, emotion, memory, movement.\"], [\"Cerebellum\", \"Balance, posture and smooth, coordinated movement.\"], [\"Hypothalamus\", \"Regulates temperature, hunger, thirst; controls body reactions and hormones.\"], [\"Frontal lobe\", \"Planning, decisions, impulse control, voluntary movement, speech production.\"], [\"Parietal lobe\", \"Touch, temperature, pain and spatial awareness.\"], [\"Temporal lobe\", \"Hearing, language, memory, recognising voices and faces.\"], [\"Occipital lobe\", \"Vision.\"], [\"Contralateral organisation\", \"Each hemisphere controls the opposite side of the body.\"], [\"Localisation of function\", \"Different brain areas perform different functions, so damage effects can be predicted.\"], [\"Broca's area\", \"Left frontal lobe; speech production. Damage: Broca's aphasia (halting speech).\"], [\"Wernicke's area\", \"Left temporal lobe; language comprehension. Damage: fluent but meaningless speech.\"], [\"Why is lobotomy ethically concerning?\", \"Little evidence it worked, often no real consent, vulnerable patients, serious permanent harm.\"], [\"Who was H.M.?\", \"Patient whose hippocampi were removed (1953); could no longer form new memories.\"], [\"Somatic vs autonomic\", \"Somatic: voluntary movement. Autonomic: automatic body functions.\"], [\"Sympathetic vs parasympathetic\", \"Sympathetic speeds up (fight/flight). Parasympathetic calms (rest and digest).\"], [\"Psychometric approach\", \"Intelligence is measured with standardised tests and compared between people.\"], [\"IQ scale\", \"Mean 100, standard deviation 15; about 68% score 85 to 115.\"], [\"Ratio IQ formula\", \"(mental age \u00f7 chronological age) \u00d7 100 (Stern).\"], [\"Spearman's g\", \"General intelligence factor behind performance on many different mental tasks.\"], [\"Stanford-Binet\", \"From Binet-Simon (1905) and Terman (1916); ages about 2 to 85+; five factors.\"], [\"WAIS-IV\", \"Adults aged 16 to 90; four index scores plus Full Scale IQ.\"], [\"WISC-V\", \"Children aged 6 to 16; five primary index scores plus Full Scale IQ.\"], [\"Reliability\", \"Consistency: similar results on retest, split-half or between scorers.\"], [\"Validity\", \"Whether a test measures what it claims to measure.\"], [\"Heritability\", \"Proportion of differences in a trait within a population associated with genetic differences.\"], [\"Minnesota Twins Reared Apart (1990)\", \"Bouchard et al.; 56 pairs of identical twins reared apart; IQ correlation about .70.\"], [\"Twin study logic\", \"If genes matter, identical twins should be more alike than fraternal twins.\"], [\"Adoption study logic\", \"Compare adopted children with biological relatives (genes) and adoptive relatives (environment).\"], [\"Flynn effect\", \"Average IQ scores rose about 3 points per decade, too fast for genetic change.\"], [\"Reaction range\", \"Genes set a range of possible outcomes; environment decides where within it.\"], [\"EQ (emotional intelligence)\", \"Ability to perceive, understand, use and manage emotions (Salovey and Mayer; Goleman).\"], [\"Three components of emotion\", \"Physiological, subjective feeling, behavioural/expressive.\"], [\"Two-factor theory\", \"Emotion = physiological arousal + cognitive interpretation (Schachter and Singer, 1962).\"], [\"Appraisal theory\", \"Evaluate the situation first (primary: is it a problem? secondary: can I cope?), then emotion follows.\"], [\"Problem-focused coping\", \"Deals with the cause: take control, seek information, weigh pros and cons.\"], [\"Emotion-focused coping\", \"Reduces feelings: relaxation, talking, exercise, distraction, denial.\"], [\"Reappraisal\", \"Re-evaluating the situation and coping ability as new information arrives.\"], [\"LeDoux short route\", \"Thalamus \u2192 amygdala \u2192 hypothalamus: fast, unconscious, can be wrong.\"], [\"LeDoux long route\", \"Thalamus \u2192 cortex and hippocampus \u2192 amygdala: slower, conscious, accurate.\"], [\"Amygdala\", \"Emotion alarm system; detects danger and fear.\"], [\"Flow\", \"Complete absorption when skill matches challenge (Csikszentmihalyi, 1975).\"], [\"Happiness (psychology)\", \"Wellbeing + positive emotions + life satisfaction.\"]];\nconst BK={\"t1\": {\"t\": \"Topic 1: Role of the brain\", \"sh\": \"Topic 1 test\", \"tag\": \"Topic 1\", \"parts\": [{\"n\": \"Test\", \"mc\": [{\"q\": \"Which part of a neuron receives signals from other neurons?\", \"o\": [\"Axon\", \"Dendrites\", \"Axon terminals\", \"Myelin sheath\"], \"a\": 1, \"e\": \"Dendrites receive incoming signals and pass them to the cell body.\"}, {\"q\": \"What is the main function of the myelin sheath?\", \"o\": [\"To produce neurotransmitters\", \"To receive signals\", \"To insulate the axon and speed up the impulse\", \"To store DNA\"], \"a\": 2, \"e\": \"Myelin insulates the axon so the impulse travels faster.\"}, {\"q\": \"Which part of a neuron releases neurotransmitters into the synapse?\", \"o\": [\"Dendrites\", \"Cell body\", \"Axon terminals\", \"Myelin sheath\"], \"a\": 2, \"e\": \"The axon terminals release neurotransmitters to pass the message on.\"}, {\"q\": \"The medulla is part of which region, and what does it control?\", \"o\": [\"Forebrain; thinking\", \"Hindbrain; breathing and heart rate\", \"Midbrain; reflexes\", \"Forebrain; emotion\"], \"a\": 1, \"e\": \"The medulla is in the hindbrain and controls vital automatic functions.\"}, {\"q\": \"Which structure coordinates balance and smooth movement?\", \"o\": [\"Thalamus\", \"Hypothalamus\", \"Cerebellum\", \"Amygdala\"], \"a\": 2, \"e\": \"The cerebellum (hindbrain) coordinates balance and movement.\"}, {\"q\": \"Which lobe contains the primary visual cortex?\", \"o\": [\"Frontal\", \"Parietal\", \"Temporal\", \"Occipital\"], \"a\": 3, \"e\": \"Vision is processed in the occipital lobe.\"}, {\"q\": \"Damage to the right primary motor cortex most likely causes weakness on which side?\", \"o\": [\"The right side of the body\", \"The left side of the body\", \"Both sides equally\", \"Neither side\"], \"a\": 1, \"e\": \"Each hemisphere controls the opposite side of the body (contralateral).\"}, {\"q\": \"A patient speaks slowly and with effort but understands language well. Which area is most likely damaged?\", \"o\": [\"Wernicke's area\", \"Broca's area\", \"Geschwind's territory\", \"Primary visual cortex\"], \"a\": 1, \"e\": \"Broca's area controls speech production; damage causes Broca's aphasia.\"}, {\"q\": \"What is a main ethical concern about lobotomies?\", \"o\": [\"They were too expensive\", \"They caused serious harm to vulnerable patients, often without real informed consent\", \"They were done only on animals\", \"They took too long\"], \"a\": 1, \"e\": \"Lobotomies often caused severe harm with little evidence of benefit and weak consent.\"}, {\"q\": \"Which system controls voluntary movement of skeletal muscles?\", \"o\": [\"Somatic nervous system\", \"Autonomic nervous system\", \"Sympathetic nervous system\", \"Parasympathetic nervous system\"], \"a\": 0, \"e\": \"The somatic system controls voluntary movement.\"}, {\"q\": \"When you are frightened, which branch speeds up your heart rate?\", \"o\": [\"Parasympathetic\", \"Sympathetic\", \"Somatic\", \"Spinal cord\"], \"a\": 1, \"e\": \"The sympathetic branch prepares the body for fight or flight.\"}, {\"q\": \"What is the main role of the thalamus?\", \"o\": [\"Sensory relay station\", \"Balance\", \"Producing speech\", \"Storing memories\"], \"a\": 0, \"e\": \"The thalamus relays incoming sensory information to the right brain areas.\"}], \"sr\": [{\"q\": \"Describe the path of a signal through one neuron, using all five parts.\", \"a\": \"Dendrites receive neurotransmitters from the previous neuron; the cell body combines the signals and decides whether to fire; the impulse travels along the axon, sped up by the myelin sheath; the axon terminals release neurotransmitters into the synapse to pass the message on.\"}, {\"q\": \"A person has damage to Broca's area. Predict the effects and explain using localisation of function.\", \"a\": \"Speech would be slow, halting and effortful, but understanding mostly intact (Broca's aphasia). Localisation of function means different areas perform specific functions: Broca's area in the left frontal lobe controls speech production, so damage mainly affects speaking.\"}, {\"q\": \"Explain two ethical concerns about how early knowledge of the brain was gained.\", \"a\": \"(1) Lack of informed consent: patients such as those given lobotomies were often vulnerable and could not truly agree. (2) Harm outweighing benefit: procedures caused permanent damage (e.g. loss of personality, H.M.'s memory loss) with little evidence of benefit. Others: privacy, animal welfare.\"}, {\"q\": \"Describe what the hindbrain, midbrain and forebrain control, with one structure for each.\", \"a\": \"Hindbrain (e.g. medulla): breathing, heart rate, balance and coordination. Midbrain (e.g. colliculi): reflex responses to sights and sounds and alertness. Forebrain (e.g. cerebrum): thinking, language, memory, emotion and voluntary movement.\"}]}]}, \"t2\": {\"t\": \"Topic 2: Intelligence\", \"sh\": \"Topic 2 test\", \"tag\": \"Topic 2\", \"parts\": [{\"n\": \"Test\", \"mc\": [{\"q\": \"On modern IQ tests the average score and standard deviation are:\", \"o\": [\"50 and 10\", \"100 and 15\", \"100 and 10\", \"150 and 15\"], \"a\": 1, \"e\": \"Modern tests are set to a mean of 100 and a standard deviation of 15.\"}, {\"q\": \"Which test is a Wechsler scale designed for children aged 6 to 16?\", \"o\": [\"WAIS-IV\", \"WISC-V\", \"MSCEIT\", \"EQ-i\"], \"a\": 1, \"e\": \"The WISC-V is the Wechsler Intelligence Scale for Children.\"}, {\"q\": \"A person gets very similar scores when they take the same test twice. This shows the test is:\", \"o\": [\"Valid\", \"Reliable\", \"Culturally fair\", \"Biased\"], \"a\": 1, \"e\": \"Consistency over time is reliability (test-retest).\"}, {\"q\": \"A test that measures what it claims to measure has good:\", \"o\": [\"Validity\", \"Reliability\", \"Standardisation\", \"Heritability\"], \"a\": 0, \"e\": \"That is the definition of validity.\"}, {\"q\": \"A child has a mental age of 9 and a chronological age of 6. Their ratio IQ is:\", \"o\": [\"67\", \"100\", \"150\", \"54\"], \"a\": 2, \"e\": \"(9 \u00f7 6) \u00d7 100 = 150.\"}, {\"q\": \"About what percentage of people score between 85 and 115?\", \"o\": [\"34%\", \"50%\", \"68%\", \"95%\"], \"a\": 2, \"e\": \"That is within one standard deviation of the mean: about 68%.\"}, {\"q\": \"If genes influence intelligence, which pair should be MORE alike in IQ?\", \"o\": [\"Fraternal twins\", \"Identical twins\", \"Unrelated people\", \"Adoptive siblings\"], \"a\": 1, \"e\": \"Identical twins share about 100% of their genes.\"}, {\"q\": \"In the Minnesota study (1990), the IQ correlation for identical twins reared apart was about:\", \"o\": [\".15\", \".30\", \".70\", \"1.00\"], \"a\": 2, \"e\": \"About .70, suggesting about 70% of IQ variation is linked to genetic differences.\"}, {\"q\": \"Which is a criticism of the Minnesota study?\", \"o\": [\"It had too many participants\", \"Many twins had contact before testing and similar adoptive homes\", \"It used no IQ tests\", \"It only tested children\"], \"a\": 1, \"e\": \"Contact before testing and similar placements weaken the claim that environments were fully different.\"}, {\"q\": \"The Flynn effect refers to:\", \"o\": [\"Heritability increasing with age\", \"Average IQ scores rising over time\", \"IQ falling with age\", \"Twins being separated\"], \"a\": 1, \"e\": \"Average IQ scores rose about 3 points per decade through much of the 20th century.\"}, {\"q\": \"Which idea says genes set a range of possible outcomes and the environment decides where in that range a person ends up?\", \"o\": [\"Reaction range\", \"Flynn effect\", \"Standardisation\", \"Construct validity\"], \"a\": 0, \"e\": \"That is reaction range.\"}, {\"q\": \"Why are self-report EQ tests criticised?\", \"o\": [\"They take too long\", \"Answers can be faked or inflated\", \"They need twins\", \"They cannot be scored\"], \"a\": 1, \"e\": \"People can present themselves as more emotionally skilled than they are.\"}], \"sr\": [{\"q\": \"Compare the Stanford-Binet, WAIS-IV and WISC-V.\", \"a\": \"All are individually administered, standardised tests with deviation IQ scores (mean 100, SD 15). The Stanford-Binet (from Binet-Simon 1905 and Terman 1916) covers ages about 2 to 85+ and measures five factors. The WAIS-IV is for ages 16 to 90 with four index scores. The WISC-V is for ages 6 to 16 with five primary index scores.\"}, {\"q\": \"Explain validity and reliability and give one threat to the validity of IQ tests.\", \"a\": \"Reliability is consistency (e.g. similar scores on retest); validity is whether the test measures what it claims to. IQ tests are highly reliable. A threat to validity is cultural or language bias, where scores reflect background rather than intelligence (also stereotype threat and test anxiety).\"}, {\"q\": \"Using twin, family and adoption evidence, explain the extent to which intelligence is inherited.\", \"a\": \"Twin studies: identical twins are more alike than fraternal twins, and those reared apart (Minnesota, about .70) are still similar. Family studies: IQ similarity rises with genetic relatedness. Adoption studies: adopted children's IQ comes to resemble their biological parents. Together they suggest heritability of about .50 to .70 in adults, but not 100%, so environment matters too.\"}, {\"q\": \"Discuss whether IQ and EQ tests are accurate, misleading, or both.\", \"a\": \"IQ tests are reliable and predict school achievement moderately well, but are narrow and can be biased or affected by anxiety. EQ tests capture emotional skills but have weaker reliability and validity, rely on self-report that can be faked and overlap with personality. So both are useful but limited: accurate for what they measure and misleading if used alone.\"}, {\"q\": \"Explain how genes and environment interact to influence intelligence.\", \"a\": \"Genes set a reaction range of possible outcomes and the environment (nutrition, schooling, stimulation) decides where in that range a person ends up. People with certain genes also seek out particular environments, and the environment can change gene expression. Evidence: heritability of IQ rises with age while the Flynn effect and adoption studies show environment matters.\"}]}]}, \"t3\": {\"t\": \"Emotion and wellbeing\", \"sh\": \"Emotion test\", \"tag\": \"Emotion\", \"parts\": [{\"n\": \"Test\", \"mc\": [{\"q\": \"Which is NOT one of the three components of emotion?\", \"o\": [\"Physiological changes\", \"Subjective feeling\", \"Behavioural expression\", \"Standardised scoring\"], \"a\": 3, \"e\": \"The three components are physiological, subjective feeling and behavioural/expressive.\"}, {\"q\": \"In Schachter and Singer's experiment, what caused physiological arousal?\", \"o\": [\"A placebo\", \"Epinephrine (adrenaline)\", \"Insulin\", \"A loud noise\"], \"a\": 1, \"e\": \"Some participants were injected with epinephrine, others with a placebo.\"}, {\"q\": \"Two-factor theory says emotion is physiological arousal plus:\", \"o\": [\"A reflex\", \"A cognitive interpretation\", \"A memory\", \"A gene\"], \"a\": 1, \"e\": \"The person labels the arousal using the situation.\"}, {\"q\": \"Primary appraisal asks:\", \"o\": [\"Can I cope?\", \"Is this a problem for me?\", \"Why is my heart racing?\", \"What will others think?\"], \"a\": 1, \"e\": \"Primary appraisal judges how important or threatening the situation is.\"}, {\"q\": \"Which is an example of problem-focused coping?\", \"o\": [\"Meditating\", \"Watching TV to distract yourself\", \"Making a plan and seeking information\", \"Ignoring the problem\"], \"a\": 2, \"e\": \"Problem-focused coping deals with the cause.\"}, {\"q\": \"LeDoux's short pathway is best described as:\", \"o\": [\"Slow, conscious and accurate\", \"Fast, unconscious and can be inaccurate\", \"Slow, unconscious and accurate\", \"Fast, conscious and accurate\"], \"a\": 1, \"e\": \"Thalamus to amygdala is fast and unconscious, but can be wrong.\"}, {\"q\": \"Which structure acts as the brain's emotion alarm system?\", \"o\": [\"Hippocampus\", \"Amygdala\", \"Thalamus\", \"Cingulate gyrus\"], \"a\": 1, \"e\": \"The amygdala detects danger and triggers fear responses.\"}, {\"q\": \"Flow occurs when:\", \"o\": [\"Challenge is far above skill\", \"Skill level matches challenge\", \"There is no challenge\", \"The task is boring\"], \"a\": 1, \"e\": \"Flow occurs when skill and challenge are balanced.\"}, {\"q\": \"Which is a feature of flow?\", \"o\": [\"Constant self-criticism\", \"An altered experience of time\", \"Divided attention\", \"Boredom\"], \"a\": 1, \"e\": \"Time often seems to pass differently during flow.\"}, {\"q\": \"In psychology, happiness is best described as:\", \"o\": [\"Constant pleasure\", \"Wellbeing + positive emotions + life satisfaction\", \"The absence of challenges\", \"Having a lot of money\"], \"a\": 1, \"e\": \"Happiness includes wellbeing, positive emotions and life satisfaction.\"}], \"sr\": [{\"q\": \"Compare two-factor theory and appraisal theory of emotion.\", \"a\": \"Two-factor (Schachter and Singer): physiological arousal comes first, then we interpret it with a cognitive label to produce emotion. Appraisal (Arnold and Lazarus): we evaluate the situation first (primary: is it a problem? secondary: can I cope?) and that triggers arousal and emotion. The difference is the order.\"}, {\"q\": \"Describe problem-focused and emotion-focused coping with an example of each.\", \"a\": \"Problem-focused deals with the cause (e.g. making a study plan after a poor result). Emotion-focused reduces the negative feelings (e.g. exercising or talking to a friend to calm down).\"}, {\"q\": \"Explain LeDoux's short and long pathways using an example.\", \"a\": \"Short: thalamus to amygdala to hypothalamus; fast, unconscious, can be wrong (jumping at a stick that looks like a snake). Long: thalamus to cortex and hippocampus to amygdala; slower, conscious and accurate (realising it is a stick and calming down).\"}, {\"q\": \"Describe flow, with one benefit and one criticism.\", \"a\": \"Flow is complete focus and immersion when skill matches
