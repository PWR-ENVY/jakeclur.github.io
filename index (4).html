\u003cdiv id=\"bar\">\u003ci>\u003c/i>\u003c/div>\u003cdiv class=\"sub\" id=\"pc\" style=\"margin-top:4px\">\u003c/div>\u003c/header>\n\u003cnav id=\"nav\">\u003c/nav>\n\u003cmain id=\"main\">\u003c/main>\n\u003cfooter>\u003cbutton id=\"rb\">Reset ticks & flags\u003c/button>\u003cbr>\u003cbr>Questions refer to Cambridge Specialist Maths Units 1&2 (Evans et al.), Ch 7, Ch 12 and Edexcel FP1 Ch 1 & 3. Solutions written for study; check against the worked-solutions PDFs.\u003c/footer>\n\u003cbutton id=\"tut\" aria-label=\"Open study tutor\">\ud83d\udcac Ask the tutor\u003c/button>\n\u003caside id=\"dr\" aria-label=\"Study tutor\">\u003cdiv class=\"hd\">\u003cspan>Study tutor\u003c/span>\u003cspan>\u003cbutton id=\"kb\" style=\"display:none\" aria-label=\"API key settings\">\ud83d\udd11 Key\u003c/button> \u003cbutton id=\"tx\">\u2715\u003c/button>\u003c/span>\u003c/div>\n\u003cdiv id=\"msgs\">\u003cdiv class=\"m a\">Hi! Ask me anything about proof (7A\u20137E) or complex numbers: explain a method, check your working, or ask for a hint instead of the full answer.\u003c/div>\u003c/div>\n\u003cdiv class=\"chips\" id=\"ch\">\u003c/div>\n\u003cdiv id=\"kp\">\u003cb>Use the tutor in this file\u003c/b>\u003cbr>This copy is open outside Claude, so it needs your own Anthropic API key (from console.anthropic.com; API usage is billed separately from a claude.ai plan). The key is kept only in this browser and sent only to Anthropic.\u003cinput id=\"ki\" type=\"password\" placeholder=\"sk-ant-\u2026\" autocomplete=\"off\">\u003cbutton id=\"ks\">Save key\u003c/button> \u003cbutton id=\"kc\">Remove key\u003c/button> \u003cspan id=\"kst\">\u003c/span>\u003c/div>\n\u003cdiv id=\"tf\">\u003ctextarea id=\"ti\" rows=\"2\" placeholder=\"Type your question\u2026\">\u003c/textarea>\u003cbutton id=\"ts\">Send\u003c/button>\u003c/div>\u003c/aside>\n\u003cscript>\nconst Q=(t,r,q,a)=>({t,r,q,a});\nconst D=[\n{id:\"7A\",wk:\"Week 1\",title:\"7A Direct proof\",\nth:`\u003cp>A \u003cb>conditional\u003c/b> P \u21d2 Q says \u201cif P then Q\u201d. In a \u003cb>direct proof\u003c/b> you assume P and chain logical steps until you reach Q.\u003c/p>\n\u003cdiv class=\"box\">\u003cb>Toolkit\u003c/b>\u003cul>\u003cli>Even: n = 2k. Odd: n = 2k+1 (k \u2208 \u2124). Use \u003ci>different\u003c/i> letters for different numbers (m, n).\u003c/li>\u003cli>Divisible by d: n = dk.\u003c/li>\u003cli>Finish by writing the result as \u201c2(integer) or 2(integer)+1\u201d, naming the integer.\u003c/li>\u003cli>Inequalities: prove A \u2212 B > 0 instead of A > B (e.g. x\u00b2 \u2212 y\u00b2 = (x\u2212y)(x+y)).\u003c/li>\u003cli>Stuck? Split into \u003cb>cases\u003c/b> (odd/even).\u003c/li>\u003c/ul>\u003c/div>\n\u003cp>\u003cb>E1\u003c/b> odd+even: (2m+1)+2n = 2(m+n)+1, odd. Odd\u00d7odd: (2m+1)(2n+1) = 2(2mn+m+n)+1, odd. \u003cb>E2\u003c/b> p=5m, q=3n \u21d2 pq=15mn. \u003cb>E3\u003c/b> x>y>0: x\u00b2\u2212y\u00b2 = (x\u2212y)(x+y) > 0.\u003c/p>\n\u003cdiv class=\"box\">\u26a0 Never start from what you want to prove (E4 shows the false way). Work forwards, or reverse your scribbles.\u003c/div>`,\nqs:[\nQ(\"h\",\"Q1\",\"Let m, n be even. Prove (a) m+n even (b) mn even.\",\"m=2a, n=2b.\u003cbr>(a) m+n = 2(a+b), even.\u003cbr>(b) mn = 4ab = 2(2ab), even.\"),\nQ(\"h\",\"Q2\",\"m, n odd. Prove m+n even.\",\"m=2a+1, n=2b+1 \u21d2 m+n = 2a+2b+2 = 2(a+b+1), even.\"),\nQ(\"c\",\"Q5\",\"m, n are perfect squares. Show mn is a perfect square.\",\"m=a\u00b2, n=b\u00b2 (a,b \u2208 \u2124). mn = a\u00b2b\u00b2 = (ab)\u00b2, and ab \u2208 \u2124.\"),\nQ(\"h\",\"Q6\",\"m, n \u2208 \u2124. Prove (m+n)\u00b2 \u2212 (m\u2212n)\u00b2 is divisible by 4.\",\"(m+n)\u00b2\u2212(m\u2212n)\u00b2 = (m\u00b2+2mn+n\u00b2)\u2212(m\u00b2\u22122mn+n\u00b2) = 4mn = 4(mn), and mn \u2208 \u2124.\"),\nQ(\"h\",\"Q7\",\"n even. Prove n\u00b2\u22126n+5 is odd.\",\"n=2k: 4k\u00b2\u221212k+5 = 2(2k\u00b2\u22126k+2)+1, odd.\"),\nQ(\"c\",\"Q8\",\"n odd. Prove n\u00b2+8n+3 is even.\",\"n=2k+1: (4k\u00b2+4k+1)+(16k+8)+3 = 4k\u00b2+20k+12 = 2(2k\u00b2+10k+6), even.\"),\nQ(\"c\",\"Q11\",\"x, y \u2208 \u211d. Show x\u00b2+y\u00b2 \u2265 2xy.\",\"Work \u003ci>forwards\u003c/i> from something true: (x\u2212y)\u00b2 \u2265 0 for all real x,y.\u003cbr>\u21d2 x\u00b2\u22122xy+y\u00b2 \u2265 0 \u21d2 x\u00b2+y\u00b2 \u2265 2xy. \u220e\"),\nQ(\"h\",\"Q13\",\"(a) Show 11 as a difference of two squares. (b) Prove every odd number is a difference of two squares. (c) Write 101 as one.\",\"(a) 11 = 6\u00b2\u22125\u00b2 (36\u221225).\u003cbr>(b) odd n=2k+1: (k+1)\u00b2\u2212k\u00b2 = k\u00b2+2k+1\u2212k\u00b2 = 2k+1 \u2713.\u003cbr>(c) 101 = 2(50)+1, k=50: 101 = 51\u00b2\u221250\u00b2 (2601\u22122500).\"),\nQ(\"c\",\"Q14b\",\"n \u2208 \u2115. Prove n/(n+1) > (n\u22121)/n.\",\"Show the difference is positive:\u003cbr>n/(n+1) \u2212 (n\u22121)/n = [n\u00b2 \u2212 (n\u22121)(n+1)] / [n(n+1)] = [n\u00b2 \u2212 (n\u00b2\u22121)]/[n(n+1)] = 1/[n(n+1)] > 0. \u220e\"),\nQ(\"c\",\"Q15\",\"(a) Prove 1/10 \u2212 1/11 \u003c 1/100. (b) For n>0 prove 1/n \u2212 1/(n+1) \u003c 1/n\u00b2.\",\"(a) 1/10\u22121/11 = 1/110 \u003c 1/100 since 110 > 100.\u003cbr>(b) 1/n \u2212 1/(n+1) = 1/[n(n+1)]. Since n(n+1) = n\u00b2+n > n\u00b2 (n>0), 1/[n(n+1)] \u003c 1/n\u00b2. \u220e\")]},\n{id:\"7B\",wk:\"Week 1\",title:\"7B Proof by contrapositive\",\nth:`\u003cp>\u003cb>Negation:\u003c/b> write the exact opposite. Swap \u201cfor all\u201d \u2194 \u201cthere exists\u201d, and use \u003cb>De Morgan\u003c/b>: not(P and Q) = (not P) or (not Q); not(P or Q) = (not P) and (not Q).\u003c/p>\n\u003cdiv class=\"box\">\u003cb>Contrapositive\u003c/b> of P \u21d2 Q is (not Q) \u21d2 (not P). It is logically equivalent, so proving it proves the original. Use it when the hypothesis is messy but \u201cnot Q\u201d is clean (e.g. \u201cn\u00b2 even \u21d2 n even\u201d becomes \u201cn odd \u21d2 n\u00b2 odd\u201d).\u003c/div>\n\u003cp>\u003cb>E9:\u003c/b> n odd, n=2m+1 \u21d2 n\u00b2 = 2(2m\u00b2+2m)+1 odd, so \u201cn\u00b2 even \u21d2 n even\u201d. \u003cb>E11:\u003c/b> x\u003cy \u21d2 \u221ax\u003c\u221ay: contrapositive \u201c\u221ax \u2265 \u221ay \u21d2 x \u2265 y\u201d follows by squaring (E3).\u003c/p>\n\u003cdiv class=\"box\">\u26a0 Contrapositive \u2260 converse. Converse (Q \u21d2 P) can be false; contrapositive never is.\u003c/div>`,\nqs:[\nQ(\"h\",\"Q1\",\"Negate and say which of statement/negation is true: (a) 1>0 (b) 4 divisible by 8 (c) each pair of primes has an even sum (d) some rectangle has four equal sides.\",\"(a) P true; not P: 1\u22640 false.\u003cbr>(b) P false; not P: 4 is not divisible by 8, true.\u003cbr>(c) P false (2+3=5); not P: some pair of primes has an odd sum, true.\u003cbr>(d) P true (a square); not P: no rectangle has four equal sides, false.\"),\nQ(\"h\",\"Q5\",\"Contrapositive + proof (n \u2208 \u2124): (a) 3n+5 even \u21d2 n odd (b) n\u00b2 odd \u21d2 n odd (d) n\u00b2 not div. by 3 \u21d2 n not div. by 3 (e) n\u00b3+1 even \u21d2 n odd (g) m+n odd \u21d2 m\u2260n.\",\"(a) n even \u21d2 3n+5 odd: n=2k, 6k+5 = 2(3k+2)+1.\u003cbr>(b) n even \u21d2 n\u00b2 even: (2k)\u00b2 = 2(2k\u00b2).\u003cbr>(d) n div. by 3 \u21d2 n\u00b2 div. by 3: n=3k, n\u00b2=3(3k\u00b2).\u003cbr>(e) n even \u21d2 n\u00b3+1 odd: 8k\u00b3+1 = 2(4k\u00b3)+1.\u003cbr>(g) m=n \u21d2 m+n even: m+n = 2m.\"),\nQ(\"h\",\"Q6\",\"x, y \u2208 \u211d. Contrapositive and proof: (a) x\u00b2+3x\u003c0 \u21d2 x\u003c0 (c) x+y\u22652 \u21d2 x\u22651 or y\u22651 (d) 2x+3y\u226512 \u21d2 x\u22653 or y\u22652.\",\"(a) x \u2265 0 \u21d2 x\u00b2+3x \u2265 0: x\u00b2 \u2265 0 and 3x \u2265 0, sum \u2265 0.\u003cbr>(c) De Morgan: not(x\u22651 or y\u22651) = x\u003c1 and y\u003c1. Then x+y\u003c2, so x+y\u22652 fails. \u2713\u003cbr>(d) x\u003c3 and y\u003c2 \u21d2 2x+3y \u003c 6+6 = 12 \u2713.\"),\nQ(\"x\",\"Q8\",\"x, y>0. (a) Show \u221ax\u2212\u221ay = (x\u2212y)/(\u221ax+\u221ay). (b) Hence prove x>y \u21d2 \u221ax>\u221ay. (c) Give a simpler proof by contrapositive.\",\"(a) Multiply by (\u221ax+\u221ay)/(\u221ax+\u221ay): numerator (\u221ax)\u00b2\u2212(\u221ay)\u00b2 = x\u2212y.\u003cbr>(b) x>y \u21d2 x\u2212y>0; denominator >0, so \u221ax\u2212\u221ay>0.\u003cbr>(c) Contrapositive: \u221ax \u2264 \u221ay \u21d2 x \u2264 y. Square both (positive) sides (E3 idea): x \u2264 y. \u220e\")]},\n{id:\"7C\",wk:\"Week 2\",title:\"7C Proof by contradiction\",\nth:`\u003cp>\u003cb>Recipe:\u003c/b> (1) assume the statement is \u003ci>false\u003c/i>; (2) deduce something impossible (even = odd, 1 divisible by 7, two lowest-terms numbers sharing a factor\u2026); (3) conclude the assumption was wrong, so the statement is true.\u003c/p>\n\u003cdiv class=\"box\">\u003cb>Classics to know:\u003c/b> \u221a2 irrational (assume p/q in lowest terms \u21d2 p\u00b2 = 2q\u00b2 \u21d2 p even \u21d2 q even, contradiction). Infinitely many primes (N = product of all primes + 1). For irrationality of a\u02e3 = b: assume x = m/n, raise to power n.\u003c/div>\n\u003cp>\u003cb>E13:\u003c/b> Pythagorean triple cannot be all odd: a\u00b2+b\u00b2 would be even but c\u00b2 odd.\u003c/p>`,\nqs:[\nQ(\"h\",\"Q1\",\"Prove every triangle has an interior angle \u2265 60\u00b0.\",\"Suppose all three angles are \u003c 60\u00b0. Then the sum \u003c 180\u00b0, but a triangle's angle sum is exactly 180\u00b0. Contradiction. \u220e\"),\nQ(\"c\",\"Q2\",\"Prove there is no smallest positive rational number.\",\"Suppose r = p/q is the smallest positive rational. Then p/(2q) is also positive rational and p/(2q) \u003c p/q, contradicting minimality. \u220e\"),\nQ(\"h\",\"Q4\",\"3\u02e3 = 2. Prove x is irrational.\",\"Suppose x = p/q, p,q \u2208 \u2115 (x>0). 3^(p/q)=2 \u21d2 3\u1d56 = 2^q. LHS odd, RHS even. Contradiction \u220e.\"),\nQ(\"c\",\"Q10\",\"(a) Prove all primes p>2 are odd. (b) Prove no two primes sum to 1001.\",\"(a) If p even and p>2, it has factors 1, 2, p, so not prime.\u003cbr>(b) Suppose p+q = 1001 (odd). Then one prime is even, so equals 2, and the other is 999 = 27\u00d737, not prime. Contradiction \u220e.\"),\nQ(\"h\",\"Q14\",\"a, b \u2208 \u2124. Prove a\u00b2 \u2212 4b \u2212 2 \u2260 0.\",\"Suppose a\u00b2 = 4b+2 = 2(2b+1). Then a\u00b2 even \u21d2 a even (7B), a = 2k: 4k\u00b2 = 4b+2 \u21d2 2k\u00b2 = 2b+1, even = odd. Contradiction \u220e.\"),\nQ(\"h\",\"Q16\",\"(a) m\u00b2 is divisible by 4 or leaves remainder 1. (b) a\u00b2+b\u00b2=c\u00b2 \u21d2 a even or b even.\",\"(a) m=4n+r. r=0: 16n\u00b2. r=1: 16n\u00b2+8n+1 (rem 1). r=2: 16n\u00b2+16n+4 (div. by 4). r=3: 16n\u00b2+24n+9 = 4(4n\u00b2+6n+2)+1 (rem 1).\u003cbr>(b) Suppose a and b both odd. By (a) each of a\u00b2, b\u00b2 leaves remainder 1, so a\u00b2+b\u00b2 leaves remainder 2. But c\u00b2 leaves remainder 0 or 1. Contradiction \u220e.\")]},\n{id:\"7D\",wk:\"Week 2\",title:\"7D Equivalent statements\",\nth:`\u003cp>The \u003cb>converse\u003c/b> of P \u21d2 Q is Q \u21d2 P (may be false!). If both hold, P \u21d4 Q: \u201cP if and only if Q\u201d.\u003c/p>\n\u003cdiv class=\"box\">\u003cb>To prove P \u21d4 Q write two headed parts:\u003c/b>\u003cbr>(\u21d2) assume P, show Q.\u003cbr>(\u21d0) assume Q, show P.\u003cbr>To show a converse is false, give one counterexample (E16: 1+3 = 4 even but 1, 3 odd).\u003c/div>`,\nqs:[\nQ(\"h\",\"Q1\",\"Write down and prove the converse: (a) x\u2208\u211d: 2x+3=5 \u21d2 x=1 (b) n odd \u21d2 n\u22123 even (c) m\u00b2+2m+1 even \u21d2 m odd (d) n\u00b2 div. by 5 \u21d2 n div. by 5.\",\"(a) x=1 \u21d2 2x+3=5: 2+3=5 \u2713.\u003cbr>(b) n\u22123 even \u21d2 n odd: n\u22123=2k \u21d2 n=2(k+1)+1.\u003cbr>(c) m odd \u21d2 m\u00b2+2m+1 even: (m+1)\u00b2 = (2k+2)\u00b2 = 4(k+1)\u00b2, even.\u003cbr>(d) n div. by 5 \u21d2 n\u00b2 div. by 5: n=5k, n\u00b2=5(5k\u00b2).\"),\nQ(\"h\",\"Q2\",\"m, n even \u21d2 mn multiple of 4. Write the converse and show it is false.\",\"Converse: if mn is a multiple of 4 then m and n are even. Counterexample: m=1, n=4, mn=4 but m is odd.\"),\nQ(\"h\",\"Q3\",\"Which pairs are equivalent? (a) in China / in Asia (b) 2x=4 / x=2 (c) x>0 and y>0 / xy>0 (d) m even or n even / mn even.\",\"(a) No (Asia \u21cf China). (b) Yes. (c) No: x=y=\u22121 gives xy>0. (d) Yes.\"),\nQ(\"h\",\"Q4\",\"n \u2208 \u2124. Prove n+1 odd \u21d4 n+2 even.\",\"(\u21d2) n+1=2k+1 \u21d2 n+2 = 2k+2 = 2(k+1).\u003cbr>(\u21d0) n+2=2k \u21d2 n+1 = 2k\u22121 = 2(k\u22121)+1, odd.\"),\nQ(\"c\",\"Q5\",\"n \u2208 \u2115. Prove n\u00b2\u22124 is prime \u21d4 n=3.\",\"n\u00b2\u22124 = (n\u22122)(n+2).\u003cbr>(\u21d2) Suppose it is prime. n=1 gives \u22123, n=2 gives 0, neither prime, so n \u2265 3. If n\u22122 \u2265 2, both factors exceed 1, so it is composite. Hence n\u22122=1, n=3.\u003cbr>(\u21d0) n=3: 9\u22124=5, prime. \u220e\"),\nQ(\"h\",\"Q7\",\"n \u2208 \u2124. Prove n odd \u21d4 n = 4k\u00b11 for some k \u2208 \u2124.\",\"(\u21d2) n=2m+1. If m even (m=2k): n=4k+1. If m odd (m=2k\u22121): n = 4k\u22121.\u003cbr>(\u21d0) 4k+1 = 2(2k)+1 and 4k\u22121 = 2(2k\u22121)+1, both odd.\"),\nQ(\"h\",\"Q10\",\"Prove an integer is divisible by 4 \u21d4 its last two digits form a number divisible by 4.\",\"Write N = 100a + b, b = number from last two digits (0 \u2264 b \u2264 99).\u003cbr>(\u21d2) 4 | N and 4 | 100a \u21d2 4 | N\u2212100a = b.\u003cbr>(\u21d0) 4 | b and 4 | 100a \u21d2 4 | N. \u220e\")]},\n{id:\"7E\",wk:\"Week 2\",title:\"7E Disproving statements\",\nth:`\u003cp>\u003cb>For all\u003c/b> (universal): disprove with \u003cb>one counterexample\u003c/b> (satisfy P, break Q). \u003cb>There exists\u003c/b>: to disprove, prove the \u003cb>negation\u003c/b> (\u201cfor all \u2026 not \u2026\u201d), often by factorising.\u003c/p>\n\u003cdiv class=\"box\">\u003cb>Negating:\u003c/b> swap \u2200 \u2194 \u2203, then negate the rest. E19: not(for all n, 2\u207f \u2265 n+1) = there exists n with 2\u207f \u003c n+1.\u003cbr>\u003cb>Factorising trick:\u003c/b> n\u00b2+13n+42 = (n+6)(n+7) is never prime.\u003cbr>\u003cb>Irrational tricks:\u003c/b> \u221a2\u00b7\u221a2 = 2, \u221a2 + (\u2212\u221a2) = 0.\u003c/div>`,\nqs:[\nQ(\"h\",\"Q3\",\"Negate: (a) \u2203x\u2208\u211d: 2+x\u00b2=1\u2212x\u00b2 (b) \u2200n\u2208\u2115, 2n+1 prime (c) \u2203x,y: x\u003cy and x\u00b2>y\u00b2 (d) \u2200x,y,z: x\u003cy and y\u003cz \u21d2 x+y\u003cz (e) \u2203m,n\u2208\u2115: mn prime (f) \u2200n\u2208\u2115: 5 | 7\u207f\u22122\u207f.\",\"(a) For all x, 2+x\u00b2 \u2260 1\u2212x\u00b2.\u003cbr>(b) There exists n with 2n+1 not prime.\u003cbr>(c) For all x,y: x \u2265 y or x\u00b2 \u2264 y\u00b2 (De Morgan: not(A and B) = not A or not B).\u003cbr>(d) There exist x,y,z with x\u003cy, y\u003cz but x+y \u2265 z.\u003cbr>(e) For all m,n \u2208 \u2115, mn is not prime.\u003cbr>(f) There exists n with 7\u207f\u22122\u207f not divisible by 5.\"),\nQ(\"h\",\"Q4\",\"Find counterexamples: (a) 2n\u00b2\u22124n+31 prime \u2200n (b) (x+y)\u00b2=x\u00b2+y\u00b2 (c) x\u00b2>x \u2200x (d) n\u00b3\u2212n even \u21d2 n even (e) m+n \u2264 mn (f) 6 | mn \u21d2 6 | m or 6 | n.\",\"(a) n=31: 2\u00b731\u00b2\u22124\u00b731+31 is divisible by 31 and larger.\u003cbr>(b) x=1, y=\u22121: LHS 0, RHS 2.\u003cbr>(c) x=1/2: x\u00b2=1/4 \u003c 1/2.\u003cbr>(d) n=3: 24 even but 3 odd.\u003cbr>(e) m=n=1: 2 > 1.\u003cbr>(f) m=2, n=3: 6 | 6 but 6 \u2224 2 and 6 \u2224 3.\"),\nQ(\"c\",\"Q5a\",\"Show: \u2203n\u2208\u2115 with 9n\u00b2\u22121 prime is false.\",\"Negation: for all n \u2208 \u2115, 9n\u00b2\u22121 is not prime. 9n\u00b2\u22121 = (3n\u22121)(3n+1) with 3n\u22121 \u2265 2 and 3n+1 \u2265 4, so it is composite. \u220e (Also (c): 2+x\u00b2 = 1\u2212x\u00b2 \u21d2 x\u00b2 = \u22121/2, impossible.)\"),\nQ(\"h\",\"Q6\",\"Counterexamples (use \u221a2): (a) a, b irrational \u21d2 ab irrational (b) \u21d2 a+b irrational (c) \u21d2 a/b irrational.\",\"(a) a=b=\u221a2: ab = 2.\u003cbr>(b) a=\u221a2, b=\u2212\u221a2: a+b = 0.\u003cbr>(c) a=b=\u221a2: a/b = 1.\"),\nQ(\"c\",\"Q7\",\"a \u2208 \u2124. (a) Prove 4 | a \u21d2 4 | a\u00b2. (b) Show the converse is false.\",\"(a) a=4k \u21d2 a\u00b2 = 16k\u00b2 = 4(4k\u00b2).\u003cbr>(b) Converse: 4 | a\u00b2 \u21d2 4 | a. Counterexample a=2: 4 | 4 but 4 \u2224 2.\"),\nQ(\"h\",\"Q8\",\"a, b \u2208 \u2124. (a) Prove 3 | a\u2212b \u21d2 3 | a\u00b2\u2212b\u00b2. (b) Show the converse is false.\",\"(a) a\u2212b=3k \u21d2 a\u00b2\u2212b\u00b2 = (a\u2212b)(a+b) = 3k(a+b).\u003cbr>(b) a=2, b=1: a\u00b2\u2212b\u00b2=3 is divisible by 3 but a\u2212b=1 is not.\"),\nQ(\"x\",\"Q10\",\"Pair up numbers so each pair sums to a square. (a) Possible for {1..16}. (b) Impossible for {1..12}.\",\"(a) 1+8, 2+7, 3+6, 4+5 (=9); 9+16, 10+15, 11+14, 12+13 (=25).\u003cbr>(b) Possible square sums are 4, 9, 16 (max sum is 23). Forced pairs: 12 only works with 4 (sum 16); 11 with 5; 10 with 6; 9 with 7; 8 with 1. Left over: 2 and 3, but 2+3 = 5 is not a square. So no pairing exists \u220e.\"),\nQ(\"x\",\"Q11\",\"f(n)=an\u00b2+bn+c, a,b,c \u2208 \u2115, c \u2265 2. Show some f(n) is not prime.\",\"Take n=c: f(c) = ac\u00b2+bc+c = c(ac+b+1). Both factors are \u2265 2, so f(c) is composite. \u220e\")]},\n{id:\"C1\",wk:\"Weeks 3\u20135\",title:\"Complex numbers: arithmetic & conjugates\",\nth:`\u003cp>i\u00b2 = \u22121. A complex number is z = a + bi with Re z = a, Im z = b (both real). \u2102 is the set of all of them.\u003c/p>\n\u003cul>\u003cli>\u003cb>Add/subtract:\u003c/b> real with real, imaginary with imaginary.\u003c/li>\u003cli>\u003cb>Multiply:\u003c/b> expand like brackets, then i\u00b2 = \u22121. Powers of i repeat every 4: i, \u22121, \u2212i, 1.\u003c/li>\u003cli>\u003cb>Conjugate:\u003c/b> z\u0304 = a \u2212 bi. Then z + z\u0304 = 2a and z\u00b7z\u0304 = a\u00b2+b\u00b2 = |z|\u00b2, both real.\u003c/li>\u003cli>\u003cb>Divide:\u003c/b> multiply top and bottom by the conjugate of the denominator, like rationalising a surd.\u003c/li>\u003cli>\u003cb>Quadratics:\u003c/b> if b\u00b2\u22124ac \u003c 0, roots are x = (\u2212b \u00b1 i\u221a(4ac\u2212b\u00b2))/2a, a conjugate pair.\u003c/li>\u003cli>\u003cb>Equate parts:\u003c/b> a+bi = c+di \u21d2 a=c and b=d. Used to find square roots: let (x+yi)\u00b2 = given number.\u003c/li>\u003c/ul>\n\u003cdiv class=\"box\">\u26a0 \u221a(\u2212a)\u00b7\u221a(\u2212b) \u2260 \u221a(ab). Always write \u221a(\u22124) = 2i first.\u003c/div>`,\nqs:[\nQ(\"c\",\"A\",\"Simplify (2+5i)(3\u2212i).\",\"6 \u2212 2i + 15i \u2212 5i\u00b2 = 6 + 13i + 5 = 11 + 13i.\"),\nQ(\"c\",\"B\",\"Write (3+i)/(1\u22122i) as a + bi.\",\"\u00d7 (1+2i)/(1+2i): numerator 3+6i+i+2i\u00b2 = 1+7i; denominator 1+4 = 5. Answer 1/5 + (7/5)i.\"),\nQ(\"c\",\"C\",\"Solve z\u00b2 \u2212 4z + 13 = 0.\",\"Discriminant 16\u221252 = \u221236, \u221a = 6i. z = (4 \u00b1 6i)/2 = 2 \u00b1 3i.\"),\nQ(\"c\",\"D\",\"Find the square roots of 5 \u2212 12i (FP1 Ex 1G Q11 style).\",\"Let (a+bi)\u00b2 = 5\u221212i. Real: a\u00b2\u2212b\u00b2=5. Imag: 2ab=\u221212 \u21d2 b=\u22126/a. Then a\u00b2\u221236/a\u00b2 = 5 \u21d2 a\u2074\u22125a\u00b2\u221236=0 \u21d2 (a\u00b2\u22129)(a\u00b2+4)=0 \u21d2 a=\u00b13. So roots \u00b1(3 \u2212 2i). Check: (3\u22122i)\u00b2 = 9\u221212i\u22124 \u2713.\"),\nQ(\"c\",\"E\",\"Given a+2b+2ai = 4+6i with a,b real, find a, b.\",\"Imag: 2a=6 \u21d2 a=3. Real: 3+2b=4 \u21d2 b=1/2.\")]},\n{id:\"C2\",wk:\"Weeks 3\u20135\",title:\"Argand diagram, modulus, argument & polar form\",\nth:`\u003cp>Plot z = x + yi as the point (x, y); real axis horizontal, imaginary vertical. Addition = vector addition.\u003c/p>\n\u003cul>\u003cli>\u003cb>Modulus:\u003c/b> |z| = r = \u221a(x\u00b2+y\u00b2) (distance from origin).\u003c/li>\u003cli>\u003cb>Argument:\u003c/b> angle from the positive real axis, anticlockwise positive. \u003cb>Principal value:\u003c/b> \u2212\u03c0 &lt; Arg z \u2264 \u03c0.\u003c/li>\u003cli>\u003cb>Finding Arg:\u003c/b> sketch, let \u03b1 = arctan(|y|/|x|) (acute), then Quadrant 1: \u03b1 \u00b7 Q2: \u03c0\u2212\u03b1 \u00b7 Q3: \u2212(\u03c0\u2212\u03b1) \u00b7 Q4: \u2212\u03b1.\u003c/li>\u003cli>\u003cb>Polar form:\u003c/b> z = r(cos \u03b8 + i sin \u03b8) = r cis \u03b8.\u003c/li>\u003cli>\u003cb>Products:\u003c/b> |z\u2081z\u2082| = |z\u2081||z\u2082| and Arg adds. \u003cb>Quotients:\u003c/b> moduli divide, arguments subtract. \u003cb>Conjugate:\u003c/b> r cis(\u2212\u03b8).\u003c/li>\u003c/ul>\n\u003cdiv class=\"box\">\u26a0 Arg of a negative real number is \u03c0 (not \u2212\u03c0). Add/subtract 2\u03c0 if your argument lands outside (\u2212\u03c0, \u03c0].\u003c/div>`,\nqs:[\nQ(\"c\",\"F\",\"Find |z| and Arg z for z = \u22121 \u2212 \u221a3 i, and write in polar form.\",\"r = \u221a(1+3) = 2. \u03b1 = arctan(\u221a3) = \u03c0/3. Third quadrant: Arg = \u2212(\u03c0 \u2212 \u03c0/3) = \u22122\u03c0/3. z = 2 cis(\u22122\u03c0/3).\"),\nQ(\"c\",\"G\",\"z\u2081 = 2 cis(\u03c0/3), z\u2082 = 3 cis(\u03c0/4). Find z\u2081z\u2082 and z\u2081/z\u2082.\",\"z\u2081z\u2082 = 6 cis(\u03c0/3+\u03c0/4) = 6 cis(7\u03c0/12). z\u2081/z\u2082 = (2/3) cis(\u03c0/3\u2212\u03c0/4) = (2/3) cis(\u03c0/12).\"),\nQ(\"c\",\"H\",\"Find |z\u2081z\u2082| for z\u2081 = 1 + \u221a3 i, z\u2082 = \u22123 \u2212 3i (FP1 Ex 27).\",\"|z\u2081| = 2, |z\u2082| = 3\u221a2, so |z\u2081z\u2082| = 6\u221a2.\"),\nQ(\"c\",\"I\",\"Write 3\u221a2 cis(3\u03c0/4) in the form a + bi.\",\"cos(3\u03c0/4) = \u2212\u221a2/2, sin(3\u03c0/4) = \u221a2/2. 3\u221a2(\u2212\u221a2/2) = \u22123, same for imag. So \u22123 + 3i.\")]},\n{id:\"C3\",wk:\"Weeks 3\u20135\",title:\"De Moivre, roots, polynomials & loci\",\nth:`\u003cul>\u003cli>\u003cb>De Moivre:\u003c/b> (r cis \u03b8)\u207f = r\u207f cis(n\u03b8). To compute (1+i)\u2078: 1+i = \u221a2 cis(\u03c0/4), so = 16 cis(2\u03c0) = 16.\u003c/li>\u003cli>\u003cb>nth roots of w = r cis \u03b8:\u003c/b> z = r^(1/n) cis((\u03b8 + 2\u03c0k)/n), k = 0, 1, \u2026, n\u22121. They lie on a circle, equally spaced by 2\u03c0/n.\u003c/li>\u003cli>\u003cb>Real-coefficient polynomials:\u003c/b> non-real roots come in conjugate pairs. A pair \u03b1, \u1fb1 gives the real quadratic factor x\u00b2 \u2212 2Re(\u03b1)x + |\u03b1|\u00b2. Then divide to find remaining roots. (A cubic: 3 real, or 1 real + a pair.)\u003c/li>\u003cli>\u003cb>Loci:\u003c/b> |z\u2212w| = r circle (centre w, radius r). |z\u2212u| = |z\u2212w| perpendicular bisector line. Arg(z\u2212w) = \u03b8 ray from w (w excluded). Re z = k, Im z = k are lines.\u003c/li>\u003c/ul>`,\nqs:[\nQ(\"c\",\"J\",\"Compute (1+i)\u2078.\",\"1+i = \u221a2 cis(\u03c0/4). (\u221a2)\u2078 = 16, 8\u00b7\u03c0/4 = 2\u03c0. Answer 16.\"),\nQ(\"c\",\"K\",\"Find all cube roots of 8.\",\"8 = 8 cis 0. z = 2 cis(2\u03c0k/3): k=0: 2. k=1: 2(\u22121/2 + (\u221a3/2)i) = \u22121 + \u221a3 i. k=2: \u22121 \u2212 \u221a3 i.\"),\nQ(\"c\",\"L\",\"1+3i is a root of z\u00b3 + 6z + 20 = 0. Find the other roots.\",\"Conjugate 1\u22123i is a root. Quadratic factor z\u00b2 \u2212 2z + 10. Divide: z\u00b3+6z+20 = (z\u00b2\u22122z+10)(z+2). Roots: 1\u00b13i, \u22122. Check: sum of roots 0 \u2713.\"),\nQ(\"c\",\"M\",\"Describe (a) |z\u22122\u2212i| = 3 (b) |z\u22121| = |z+i|.\",\"(a) Circle, centre (2, 1), radius 3.\u003cbr>(b) Equidistant from (1,0) and (0,\u22121): (x\u22121)\u00b2+y\u00b2 = x\u00b2+(y+1)\u00b2 \u21d2 y = \u2212x, a line through the origin.\")]}\n];\nconst TAG=/(\u003c\\/?(?:b|i|br|p|ul|li|sup|sub)>|\u003cdiv class=\"box\">|\u003c\\/div>)/;\nconst W=/[A-Za-z0-9\u2080-\u2089\u00b2\u00b3\u207f\u03c0\u03b8\u221a\u1fb1\u0304\u1d56.|^]/;\nfunction mt(t,i,dir){let d=0;for(let k=i;k>=0&&k\u003ct.length;k+=dir){const c=t[k];if(\"([\".includes(c))d+=dir==-1?-1:1;else if(\")]\".includes(c))d+=dir==-1?1:-1;if(d==0)return k}return -1}\nfunction st(x){return /^[(\\[]/.test(x)&&mt(x,0,1)==x.length-1?x.slice(1,-1):x}\nfunction fr(t){\n for(let i=0;i\u003ct.length;i++){\n  if(t[i]!=\"/\")continue;\n  let l=i-1,r=i+1,l2=l,r2=r;\n  while(t[l2]==\" \")l2--;while(t[r2]==\" \")r2++;\n  if(\")]\".includes(t[l2]||\"#\")&&\"([\".includes(t[r2]||\"#\")){l=l2;r=r2}else if(t[l]==\" \"||t[r]==\" \")continue;\n  let ls,re;\n  if(\")]\".includes(t[l])){ls=mt(t,l,-1);if(ls\u003c0)continue}else{ls=l;while(ls>=0&&W.test(t[ls]))ls--;ls++}\n  if(\"([\".includes(t[r])){re=mt(t,r,1);if(re\u003c0)continue}else{re=r;while(re\u003ct.length){if(W.test(t[re]))re++;else if(t[re]==\"(\"&&t[re-1]==\"^\"){const j=mt(t,re,1);if(j\u003c0)break;re=j+1}else break}re--;while(t[re]==\".\")re--}\n  if(ls>l||re\u003cr)continue;\n  const A0=t.slice(ls,l+1),B0=t.slice(r,re+1),bad=x=>!/^[(\\[]/.test(x)&&/[A-Za-z]{3,}/.test(x);if(bad(A0)||bad(B0))continue;\n  const h='\u003cspan class=fr>\u003cspan class=nu>'+fr(st(t.slice(ls,l+1)))+'\u003c/span>\u003cspan class=de>'+fr(st(t.slice(r,re+1)))+'\u003c/span>\u003c/span>';\n  t=t.slice(0,ls)+h+t.slice(re+1);i=ls+h.length-1}\n return t}\nfunction fm(h){\n h=h.split(TAG).map((x,i)=>i%2?x:fr(x)).join(\"\");\n h=h.replace(/\\^\\(([^()]*)\\)/g,\"\u003csup>$1\u003c/sup>\").replace(/\\^([A-Za-z0-9])/g,\"\u003csup>$1\u003c/sup>\");\n return h.replace(/\u221a(\\([^()]*\\)|[A-Za-z0-9\u2080-\u2089\u00b2]+)/g,(m,g)=>'\u003cspan class=rd>\u221a\u003cspan class=ov>'+g.replace(/^\\((.*)\\)$/,\"$1\")+\"\u003c/span>\u003c/span>\")}\n\nconst BK={\nb12:{t:\"Chapter 12 Complex numbers\",tag:\"Weeks 3\u20135\",parts:[\n{n:\"Technology-free\",mc:[\n{q:\"The linear factors of z\u00b2 + 6z + 10 over \u2102 are:\",o:[\"(z+3+i)\u00b2\",\"(z+3\u2212i)\u00b2\",\"(z+3+i)(z\u22123+i)\",\"(z+3\u2212i)(z+3+i)\"],a:3,e:\"The roots are z = \u22123 \u00b1 i, so the factors are (z+3\u2212i)(z+3+i).\"},\n{q:\"If z = 1/(1\u2212i), r = |z| and \u03b8 = Arg z, then:\",o:[\"r = 2 and \u03b8 = \u03c0/4\",\"r = 1/2 and \u03b8 = \u03c0/4\",\"r = \u221a2 and \u03b8 = \u2212\u03c0/4\",\"r = 1/\u221a2 and \u03b8 = \u03c0/4\"],a:3,e:\"z = (1+i)/2, so r = \u221a2/2 = 1/\u221a2 and \u03b8 = \u03c0/4.\"},\n{q:\"When \u221a3 \u2212 i is divided by \u22121 \u2212 i, the modulus and Argument of the quotient are, respectively:\",o:[\"2\u221a2 and 7\u03c0/12\",\"\u221a2 and \u221211\u03c0/12\",\"\u221a2 and 7\u03c0/12\",\"2\u221a2 and \u221211\u03c0/12\"],a:2,e:\"Moduli: 2 \u00f7 \u221a2 = \u221a2. Arguments: \u2212\u03c0/6 \u2212 (\u22123\u03c0/4) = 7\u03c0/12.\"},\n{q:\"(\u221a2/2)(1 + i) can be expressed in polar form as:\",o:[\"cis(\u03c0/4)\",\"\u221a2 cis(\u03c0/4)\",\"\u2212\u221a2 cis(\u2212\u03c0/4)\",\"2 cis(\u03c0/4) cis(\u2212\u03c0/4)\"],a:0,e:\"1 + i = \u221a2 cis(\u03c0/4); multiplying by \u221a2/2 gives modulus 1.\"},\n{q:\"If z\u2081 = 6 cis(\u03c0/4) and z\u2082 = 2 cis(2\u03c0/3), then z\u2081z\u2082 is equal to:\",o:[\"8 cis(11\u03c0/12)\",\"4 cis(11\u03c0/12)\",\"12 cis(11\u03c0/12)\",\"8 cis(5\u03c0/12)\"],a:2,e:\"Multiply moduli (12), add arguments (\u03c0/4 + 2\u03c0/3 = 11\u03c0/12).\"},\n{q:\"If z = 1 \u2212 i\u221a3, then Arg z equals:\",o:[\"\u22122\u03c0/3\",\"\u22125\u03c0/6\",\"2\u03c0/3\",\"\u2212\u03c0/3\"],a:3,e:\"Fourth quadrant with reference angle \u03c0/3, so Arg z = \u2212\u03c0/3.\"}],\nsr:[\n{q:\"If z = 4 + 2i, determine (a) (z \u2212 z\u0304)\u00b2 (b) (z + i)(z \u2212 1) (c) 1/z.\",a:\"(a) z \u2212 z\u0304 = 4i, so (4i)\u00b2 = \u221216.\u003cbr>(b) (4+3i)(3+2i) = 12+8i+9i\u22126 = 6 + 17i.\u003cbr>(c) 1/z = z\u0304/|z|\u00b2 = (4\u22122i)/20 = 1/5 \u2212 (1/10)i.\"},\n{q:\"Solve for real x and y: (a) 2(x + iy) + (3i \u2212 4) = 7 + i (b) 2x + (y + 7)i = (2 + 3i)\u00b2.\",a:\"(a) Real: 2x \u2212 4 = 7, Imag: 2y + 3 = 1 \u21d2 x = 11/2, y = \u22121.\u003cbr>(b) (2+3i)\u00b2 = \u22125 + 12i \u21d2 2x = \u22125, y + 7 = 12 \u21d2 x = \u22125/2, y = 5.\"},\n{q:\"Simplify (2 \u2212 3i)/(1 + i).\",a:\"Multiply by (1\u2212i)/(1\u2212i): (2\u22123i)(1\u2212i)/2 = (\u22121\u22125i)/2 = \u22121/2 \u2212 (5/2)i.\"},\n{q:\"Factorise into linear factors over \u2102: (a) z\u00b2 + 49 (b) z\u00b2 + z + 1 (c) z\u00b2 + z + 2.\",a:\"(a) (z + 7i)(z \u2212 7i).\u003cbr>(b) Roots \u22121/2 \u00b1 (\u221a3/2)i: (z + 1/2 + (\u221a3/2)i)(z + 1/2 \u2212 (\u221a3/2)i).\u003cbr>(c) Roots \u22121/2 \u00b1 (\u221a7/2)i: (z + 1/2 + (\u221a7/2)i)(z + 1/2 \u2212 (\u221a7/2)i).\"},\n{q:\"Let z = i \u2212 \u221a3 and w = 1 \u2212 i. (a) Sketch both on an Argand diagram. (b) Find Arg z and Arg w. (c) Write z and w in modulus\u2013argument form. (d) Express in modulus\u2013argument form: (i) zw (ii) z/w (iii) z\u00b3 (iv) z\u0304 (v) (z w\u0304)\u00b2 (vi) w/z\u00b2.\",a:\"(a) z = (\u2212\u221a3, 1) in quadrant 2; w = (1, \u22121) in quadrant 4.\u003cbr>(b) Arg z = 5\u03c0/6, Arg w = \u2212\u03c0/4.\u003cbr>(c) z = 2 cis(5\u03c0/6), w = \u221a2 cis(\u2212\u03c0/4).\u003cbr>(d) (i) 2\u221a2 cis(7\u03c0/12) (ii) \u221a2 cis(\u221211\u03c0/12) (iii) 8 cis(\u03c0/2) (iv) 2 cis(\u22125\u03c0/6) (v) 8 cis(\u03c0/6) (vi) (\u221a2/4) cis(\u03c0/12).\"}]},\n{n:\"Technology-active\",mc:[\n{q:\"Let z = x + yi, where x, y \u2208 \u211d\u2216{0}. The expression which is not necessarily a real number is:\",o:[\"z\u00b2\",\"z z\u0304\",\"z\u207b\u00b9z\",\"Im(z)\"],a:0,e:\"z z\u0304 = |z|\u00b2, z\u207b\u00b9z = 1 and Im(z) are all real, but z\u00b2 = x\u00b2 \u2212 y\u00b2 + 2xyi has a non-zero imaginary part.\"},\n{q:\"Given z = \u22124i, then |z\u00b3| and Arg z\u00b3 are, respectively:\",o:[\"16 and 3\u03c0/2\",\"64 and \u03c0\",\"64 and 0\",\"64 and \u03c0/2\"],a:3,e:\"|z\u00b3| = 4\u00b3 = 64. z\u00b3 = (\u22124i)\u00b3 = 64i, so Arg = \u03c0/2.\"},\n{q:\"If x + iy = 1/(4 \u2212 3i), where x and y are real, then:\",o:[\"x = 4/25, y = \u22123/25\",\"x = 3/25, y = 4/25\",\"x = \u22123/7, y = 4/7\",\"x = 4/25, y = 3/25\"],a:3,e:\"1/(4\u22123i) = (4+3i)/25.\"},\n{q:\"Written in polar form, the complex number 3/5 + (4/5)i is approximately equal to:\",o:[\"cis(1.030)\",\"cis(0.927)\",\"cis(0.644)\",\"cis(0.540)\"],a:1,e:\"|z| = 1 and Arg = arctan(4/3) \u2248 0.927.\"},\n{q:\"In which quadrant does the complex number 4 cis(3.7) lie?\",o:[\"Quadrant 1\",\"Quadrant 2\",\"Quadrant 3\",\"Quadrant 4\"],a:2,e:\"\u03c0 \u2248 3.14 \u003c 3.7 \u003c 3\u03c0/2 \u2248 4.71, so it is in quadrant 3.\"},\n{q:\"Suppose z = x + iy where x and y are both positive reals. If |z| = 1 and |z \u2212 2 + i| = 2, then:\",o:[\"x = 2/5, y = 1/5\",\"x = 4/5, y = 3/5\",\"x = 3/5, y = 1/5\",\"x = 3/5, y = 4/5\"],a:1,e:\"x\u00b2 + y\u00b2 = 1 and (x\u22122)\u00b2 + (y+1)\u00b2 = 4 give y = 2x \u2212 1. Then 5x\u00b2 \u2212 4x = 0, so x = 4/5 and y = 3/5.\"}],\nsr:[\n{q:\"Simplify: (a) i(4 \u2212 6i) + 2(3 \u2212 2i) (b) (4 \u2212 i)(2 + i) \u2212 (3 \u2212 i)(2 + i).\",a:\"(a) 4i + 6 + 6 \u2212 4i = 12.\u003cbr>(b) (9 + 2i) \u2212 (7 + i) = 2 + i.\"},\n{q:\"Simplify each, n \u2208 \u2115 \u222a {0}: (a) i^(4n) (b) i^(4n+1) (c) i^(4n+2) (d) i^(4n+3).\",a:\"(a) 1 (b) i (c) \u22121 (d) \u2212i. (Powers of i repeat every 4.)\"},\n{q:\"Solve: (a) (z \u2212 1)\u00b2 = \u221214 (b) z\u00b2 \u2212 4z + 32 = 0.\",a:\"(a) z \u2212 1 = \u00b1i\u221a14, so z = 1 \u00b1 i\u221a14.\u003cbr>(b) z = (4 \u00b1 \u221a(\u2212112))/2 = 2 \u00b1 2i\u221a7 = 2(1 \u00b1 i\u221a7).\"},\n{q:\"Express z = 1 \u2212 \u221a3 i in polar form.\",a:\"|z| = 2, Arg z = \u2212\u03c0/3, so z = 2 cis(\u2212\u03c0/3).\"},\n{q:\"(a) Simplify (1 + 3i)\u00b2/(i(i \u2212 4)). (b) Determine the complex conjugate of 2z/(z + 2i) where z = 2 + i.\",a:\"(a) Numerator \u22128 + 6i; denominator \u22121 \u2212 4i. Result \u2212(16 + 38i)/17.\u003cbr>(b) 2z/(z+2i) = (4+2i)/(2+3i) = (14 \u2212 8i)/13, so the conjugate is (14 + 8i)/13.\"}]}]},\nb7:{t:\"Chapter 7 Number and proof\",tag:\"Weeks 1\u20132\",parts:[\n{n:\"Technology-free\",mc:[\n{q:\"If both m and n are odd positive integers, then:\",o:[\"m + n is odd\",\"3m + 2n is even\",\"3m + 5n is odd\",\"m\u00b2 + n\u00b2 is even\"],a:3,e:\"Odd\u00b2 is odd, and odd + odd is even.\"},\n{q:\"Suppose n is an integer. The converse of \u201cIf n\u00b2 is even, then n is even\u201d is:\",o:[\"If n is even, then n\u00b2 is even.\",\"If n\u00b2 is even, then n is odd.\",\"If n\u00b2 is odd, then n is odd.\",\"If n is odd, then n\u00b2 is odd.\"],a:0,e:\"The converse swaps hypothesis and conclusion.\"},\n{q:\"Statement: \u201c5n\u00b2 \u2212 4n + 1 is composite for every positive integer n.\u201d Its negation is:\",o:[\"5n\u00b2 \u2212 4n + 1 is prime for some prime n.\",\"5n\u00b2 \u2212 4n + 1 is prime for every prime n.\",\"5n\u00b2 \u2212 4n + 1 is prime for every positive integer n.\",\"5n\u00b2 \u2212 4n + 1 is prime for some positive integer n.\"],a:3,e:\"Negate \u201cfor all \u2026 composite\u201d to \u201cthere exists \u2026 not composite (prime)\u201d. (Keep the same set, positive integers.)\"},\n{q:\"Suppose n is a positive integer. The number 9n\u00b2 \u2212 4 is prime for:\",o:[\"no values of n\",\"one value of n\",\"two values of n\",\"three values of n\"],a:1,e:\"9n\u00b2 \u2212 4 = (3n\u22122)(3n+2). For n = 1 it is 5 (prime). For n \u2265 2 both factors exceed 1.\"},\n{q:\"Which statement is true?\",o:[\"m and n are odd if and only if m + n is even.\",\"m and n are even if and only if m + n and mn are even.\",\"m and n are even if and only if mn is a multiple of 4.\",\"m\u00b2 is divisible by 8 if and only if m is divisible by 8.\"],a:1,e:\"A fails for m, n both even; C fails for m = 1, n = 4; D fails for m = 4.\"},\n{q:\"The converse of which statement is true?\",o:[\"If n is divisible by 9, then n\u00b2 is divisible by 9.\",\"If m and n are odd, then m + n is even.\",\"If m and n are odd, then mn is odd.\",\"If m is odd and n is even, then m + n is odd.\"],a:2,e:\"The converse of C is \u201cif mn is odd then m and n are odd\u201d, which is true.\"},\n{q:\"For real x, y, the contrapositive of \u201cIf 2^x \u2265 2^y, then x \u2265 y\u201d is:\",o:[\"If 2^x \u003c 2^y, then x \u003c y.\",\"If 2^x \u2265 2^y, then x \u003c y.\",\"If x \u003c y, then 2^x \u003c 2^y.\",\"If x \u2265 y, then 2^x \u2265 2^y.\"],a:2,e:\"Contrapositive: (not Q) \u21d2 (not P), i.e. x \u003c y \u21d2 2^x \u003c 2^y.\"},\n{q:\"Statement: \u201cIf n\u00b2 is divisible by 4, then n is divisible by 4.\u201d Which value of n shows it is false?\",o:[\"n = 1\",\"n = 2\",\"n = 4\",\"n = 8\"],a:1,e:\"n = 2: n\u00b2 = 4 is divisible by 4, but 2 is not.\"},\n{q:\"Suppose P \u21d2 Q is true. Then:\",o:[\"Its converse will always be true.\",\"Its converse will always be false.\",\"Its negation will always be true.\",\"Its contrapositive will always be true.\"],a:3,e:\"A statement and its contrapositive are logically equivalent.\"},\n{q:\"Which pair is a counterexample to \u201cthe product of two irrational numbers is irrational\u201d?\",o:[\"\u221a2 and \u221a3\",\"\u221a2 and \u221a8\",\"\u221a3 and \u221a6\",\"\u221a8 and \u221a6\"],a:1,e:\"\u221a2 \u00d7 \u221a8 = \u221a16 = 4, which is rational.\"},\n{q:\"Alice always lies and Billy always tells the truth. Alice says that Billy would say that Ciara never lies. Then it can be determined that:\",o:[\"Ciara always lies\",\"Ciara is known to tell the truth\",\"Ciara usually tells the truth\",\"Ciara never tells the truth\"],a:0,e:\"Answer as given in the booklet (A). Alice\u2019s statement is false, so Billy would not say \u201cCiara never lies\u201d.\"},\n{q:\"Integers a, b, c: the product is even, the sum is odd, a + b is odd and b + c is odd. Then:\",o:[\"a, b and c are all odd.\",\"a is odd, b is even, c is odd.\",\"a is even, b is odd, c is even.\",\"a is odd, b is even, c is even.\"],a:2,e:\"a + b and b + c odd \u21d2 a and c have the same parity, opposite to b. If a, c are odd and b even the sum is even (not allowed), so a, c are even and b is odd.\"}],\nsr:[\n{q:\"(a) By expanding the right-hand side, prove n\u00b3 \u2212 1 = (n \u2212 1)(n\u00b2 + n + 1). (b) Using (a), prove that seven is the only prime number that is one less than a perfect cube.\",a:\"(a) (n\u22121)(n\u00b2+n+1) = n\u00b3 + n\u00b2 + n \u2212 n\u00b2 \u2212 n \u2212 1 = n\u00b3 \u2212 1.\u003cbr>(b) A number one less than a cube is n\u00b3 \u2212 1 = (n\u22121)(n\u00b2+n+1) with n \u2265 2. The factor n\u00b2 + n + 1 \u2265 7 > 1, so to be prime the other factor must be 1: n \u2212 1 = 1, n = 2, giving 7.\"},\n{q:\"a, b \u2208 \u211d. Statement: if ab is irrational then either a or b is irrational. (a) Write the contrapositive. (b) Prove it.\",a:\"(a) If a and b are both rational, then ab is rational.\u003cbr>(b) Let a = m/n and b = p/q with integers m, n, p, q and nq \u2260 0. Then ab = mp/(nq), a quotient of integers with nq \u2260 0, so ab is rational. \u220e\"},\n{q:\"Prove by mathematical induction: (a) 1/2 + 1/4 + \u2026 + 1/2^n = 1 \u2212 1/2^n (b) 9^n \u2212 1 is divisible by 8 for all n \u2208 \u2115.\",a:\"(a) P(1): LHS = 1/2, RHS = 1 \u2212 1/2 = 1/2 \u2713. Assume P(k). Then 1/2 + \u2026 + 1/2^k + 1/2^(k+1) = 1 \u2212 1/2^k + 1/2^(k+1) = 1 \u2212 2/2^(k+1) + 1/2^(k+1) = 1 \u2212 1/2^(k+1). So P(k+1) is true, and by induction P(n) holds for all n.\u003cbr>(b) P(1): 9 \u2212 1 = 8 \u2713. Assume 9^k \u2212 1 = 8m. Then 9^(k+1) \u2212 1 = 9(8m + 1) \u2212 1 = 72m + 8 = 8(9m + 1). So P(k+1) is true, and by induction it holds for all n \u2208 \u2115.\"},\n{q:\"a, b are positive reals. Either prove \u201cIf a \u003c b then a\u00b2 \u003c b\u00b3\u201d or give a counterexample.\",a:\"It is false. Take a = 1/2 and b = 3/5: a \u003c b but a\u00b2 = 1/4 = 0.25 > 27/125 = 0.216 = b\u00b3.\u003cbr>\u003ci>Note: the booklet\u2019s printed counterexample (a = 2/5, b = 2/3) does not work, since 4/25 \u003c 8/27. The one above does.\u003c/i>\"},\n{q:\"a and b are positive integers with a \u003c b and 1/a + 1/b = 1/4. Show there are only two such pairs (a, b).\",a:\"Both fractions are positive, so 1/a \u003c 1/4, giving a \u2265 5. If a \u2265 9 then 1/a + 1/b \u003c 2/9 \u003c 1/4, so a \u2264 8 (and a = 8 would give b = 8, which is not allowed since a \u003c b).\u003cbr>a = 5: 1/b = 1/4 \u2212 1/5 = 1/20 \u21d2 b = 20.\u003cbr>a = 6: 1/b = 1/12 \u21d2 b = 12.\u003cbr>a = 7: 1/b = 3/28, not an integer b.\u003cbr>So only (5, 20) and (6, 12).\"},\n{q:\"(a) Determine the prime factorisation of 40. (b) Hence find the least positive integer n such that 40n is a square. (c) Write the prime factorisation of 80. (d) Prove there is no positive integer n such that 40n and 80n are both square numbers.\",a:\"(a) 40 = 2\u00b3 \u00d7 5.\u003cbr>(b) n needs at least one more 2 and one more 5: n = 2 \u00d7 5 = 10.\u003cbr>(c) 80 = 2\u2074 \u00d7 5.\u003cbr>(d) Suppose 40n = a\u00b2 and 80n = b\u00b2. Dividing: (b/a)\u00b2 = 2, so \u221a2 = b/a would be rational, which is false. \u220e\"},\n{q:\"Prove by contradiction that \u221b3 > \u221a2.\",a:\"Suppose \u221b3 \u2264 \u221a2, i.e. 3^(1/3) \u2264 2^(1/2). Raise both sides to the power 6: (3^(1/3))\u2076 \u2264 (2^(1/2))\u2076, so 3\u00b2 \u2264 2\u00b3, i.e. 9 \u2264 8. This is a contradiction, so \u221b3 > \u221a2. \u220e\"},\n{q:\"Prove that (n + 2)\u00b2 \u2212 n\u00b2 is a multiple of 8 if and only if n is an odd number.\",a:\"(n+2)\u00b2 \u2212 n\u00b2 = 4n + 4.\u003cbr>(\u21d2) If 4n + 4 = 8k then n + 1 = 2k, so n = 2k \u2212 1 is odd.\u003cbr>(\u21d0) If n = 2k + 1 then 4n + 4 = 4(2k+1) + 4 = 8k + 8 = 8(k + 1), a multiple of 8. \u220e\"},\n{q:\"(a) Suppose d is a divisor of n and d is a divisor of m. Prove d is a divisor of n \u2212 m. (b) Hence show that the consecutive integers n and n + 1 have no common divisor except 1.\",a:\"(a) n = pd and m = qd, so n \u2212 m = pd \u2212 qd = d(p \u2212 q). \u220e\u003cbr>(b) A common divisor d of n and n + 1 would divide (n + 1) \u2212 n = 1, so d = 1. \u220e\"},\n{q:\"A rectangle has sides of integer length. When 3 units are added to the height and 2 units to the width, the area is tripled. Prove there are only three such rectangles.\",a:\"Let the sides be m and n, so (m + 3)(n + 2) = 3mn. Expanding: mn + 2m + 3n + 6 = 3mn, so n(2m \u2212 3) = 2m + 6 and n = (2m + 6)/(2m \u2212 3).\u003cbr>m \u2265 2 (otherwise n is negative), and n > 1. Also n \u003c 2 once m > 6, so only m = 2, \u2026, 6 can give integers:\u003cbr>m = 2: n = 10 \u00b7 m = 3: n = 4 \u00b7 m = 4: 14/5 \u00b7 m = 5: 16/7 \u00b7 m = 6: n = 2.\u003cbr>So (m, n) = (2, 10), (3, 4), (6, 2). \u220e\"}]}]},\nb4:{t:\"Chapter 4 Further algebra\",tag:\"Extra (not on your planner)\",parts:[\n{n:\"Technology-free\",mc:[\n{q:\"If a(x + 2)\u00b2 + b(x + 1) = x\u00b2, then the values of a and b are:\",o:[\"a = 1, b = \u22124\",\"a = 1, b = \u22122\",\"a = 1, b = 1\",\"a = 1, b = 2\"],a:0,e:\"x\u00b2 coefficient gives a = 1. Then x: 4 + b = 0, so b = \u22124. Constant: 4 + b = 0 \u2713.\"},\n{q:\"If (a\u00b2 + 2a + 4)x\u00b2 + (a\u00b2 + a \u2212 10)x = 12x\u00b2 + 2x, then a is:\",o:[\"\u22121\",\"\u22122\",\"\u22123\",\"\u22124\"],a:3,e:\"a\u00b2 + 2a \u2212 8 = 0 \u21d2 a = 2 or \u22124. a\u00b2 + a \u2212 12 = 0 \u21d2 a = 3 or \u22124. Common value: a = \u22124.\"},\n{q:\"If (x + 8)/((x \u2212 1)(x + 2)) = a/(x \u2212 1) + b/(x + 2), then b is:\",o:[\"\u22123\",\"\u22122\",\"0\",\"3\"],a:1,e:\"Cover-up at x = \u22122: b = (\u22122 + 8)/(\u22122 \u2212 1) = \u22122.\"},\n{q:\"The x coordinates of the intersection of y = 3x \u2212 5 and x\u00b2 + y\u00b2 = 9 satisfy:\",o:[\"10x\u00b2 \u2212 15x + 8 = 0\",\"9x\u00b2 \u2212 30x + 16 = 0\",\"10x\u00b2 \u2212 30x + 16 = 0\",\"9x\u00b2 \u2212 30x + 25 = 0\"],a:2,e:\"x\u00b2 + (3x \u2212 5)\u00b2 = 9 \u21d2 10x\u00b2 \u2212 30x + 16 = 0.\"},\n{q:\"A car travels d km at x km/h and then 2d km at y km/h. The 2d km takes 1 hour more than the d km. An equation is:\",o:[\"dx \u2212 2dy = 1\",\"2d/y \u2212 d/x + 1 = 0\",\"d/x \u2212 2d/y \u2212 1 = 0\",\"2d/y \u2212 d/x \u2212 1 = 0\"],a:3,e:\"Time for 2d is 2d/y; time for d is d/x; difference is 1.\"},\n{q:\"The line y = x + a intersects the circle x\u00b2 + y\u00b2 = 1 twice if and only if:\",o:[\"a > 0\",\"\u2212\u221a2 \u003c a \u003c \u221a2\",\"a\u00b2 > 2\",\"a \u2264 2\"],a:1,e:\"Substitute: 2x\u00b2 + 2ax + a\u00b2 \u2212 1 = 0; discriminant 4a\u00b2 \u2212 8(a\u00b2 \u2212 1) > 0 \u21d2 a\u00b2 \u003c 2.\"}],\nsr:[\n{q:\"By finding a, b and c, express x\u00b3 in the form (x + 2)\u00b3 + a(x + 2)\u00b2 + b(x + 2) + c.\",a:\"Let u = x + 2, so x = u \u2212 2 and x\u00b3 = u\u00b3 \u2212 6u\u00b2 + 12u \u2212 8. Hence a = \u22126, b = 12, c = \u22128.\"},\n{q:\"Express x/((x \u2212 3)(x + 2)) in partial fractions.\",a:\"3/(5(x \u2212 3)) + 2/(5(x + 2)).\"},\n{q:\"Express (x\u00b2 + 1)/(x\u00b2 \u2212 1) in partial fractions.\",a:\"Divide first: (x\u00b2+1)/(x\u00b2\u22121) = 1 + 2/(x\u00b2\u22121) = 1 + 1/(x \u2212 1) \u2212 1/(x + 1).\"},\n{q:\"Solve for x: (a) x\u00b2 \u2212 x = 10 (b) x\u00b2 \u2212 5tx = \u22123t\u00b2.\",a:\"(a) x = (1 \u00b1 \u221a41)/2.\u003cbr>(b) x\u00b2 \u2212 5tx + 3t\u00b2 = 0 \u21d2 x = t(5 \u00b1 \u221a13)/2.\"},\n{q:\"Solve for x, where c is a positive constant: (a) x\u00b2 \u2212 3cx = 10c\u00b2 (b) x \u2212 1/x = c.\",a:\"(a) (x \u2212 5c)(x + 2c) = 0 \u21d2 x = \u22122c or 5c.\u003cbr>(b) x\u00b2 \u2212 cx \u2212 1 = 0 \u21d2 x = (c \u00b1 \u221a(c\u00b2 + 4))/2.\"}]},\n{n:\"Technology-active\",mc:[\n{q:\"The parabola y = x\u00b2 \u2212 5x \u2212 8 crosses the x axis at:\",o:[\"x = 6.27 and x = 1.27\",\"x = \u22126.27 and x = \u22121.27\",\"x = \u22126.27 and x = 1.27\",\"x = 6.27 and x = \u22121.27\"],a:3,e:\"x = (5 \u00b1 \u221a57)/2 \u2248 6.27, \u22121.27.\"},\n{q:\"The line y = x intersects the hyperbola y = 1/(x \u2212 a) + a when:\",o:[\"x = a only\",\"x = a or x = \u2212a\",\"x = a + 1 or x = a \u2212 1\",\"x = 0 or x = a\"],a:2,e:\"x \u2212 a = 1/(x \u2212 a) \u21d2 (x \u2212 a)\u00b2 = 1 \u21d2 x = a \u00b1 1.\"},\n{q:\"If (a \u2212 b)x\u00b2 + (a + b)x = 6x\u00b2 \u2212 10x, the values of a and b are:\",o:[\"a = 6, b = 0\",\"a = 6, b = \u221210\",\"a = 8, b = 2\",\"a = \u22122, b = \u22128\"],a:3,e:\"a \u2212 b = 6 and a + b = \u221210, so a = \u22122, b = \u22128.\"},\n{q:\"The solutions to 5x\u00b2 + 13x + 7 = 0, correct to 2 decimal places, are:\",o:[\"x = 1.84 and x = 0.76\",\"x = \u22120.46 and x = 3.06\",\"x = \u22121.84 and x = \u22120.76\",\"x = 0.92 and x = \u22126.12\"],a:2,e:\"x = (\u221213 \u00b1 \u221a29)/10 \u2248 \u22121.84, \u22120.76.\"},\n{q:\"The parabola y = x\u00b2 + 3 intersects the hyperbola y = 1/x at (a, b). Correct to 2 d.p., a and b are:\",o:[\"a = 0.55, b = 3.30\",\"a = 0.32, b = 3.10\",\"a = 0.33, b = 3.10\",\"a = 0.45, b = 2.21\"],a:1,e:\"Solve x\u00b3 + 3x \u2212 1 = 0 on a calculator: x \u2248 0.322, and b = 1/x \u2248 3.10.\"},\n{q:\"The line x + y = 4 touches the circle x\u00b2 + y\u00b2 = k at one point. The value of k is:\",o:[\"4\",\"16\",\"\u221a8\",\"8\"],a:3,e:\"The distance from the origin to the line is 4/\u221a2 = 2\u221a2, so k = (2\u221a2)\u00b2 = 8.\"}],\nsr:[\n{q:\"Solve each pair of simultaneous equations (2 d.p.): (a) x + y = 2 and xy + y \u2212 2 = 0 (b) xy = 1/2 and x + y = 2.\",a:\"(a) Substitute y = 2 \u2212 x: x(1 \u2212 x) = 0. So (x, y) = (0, 2) or (1, 1).\u003cbr>(b) x\u00b2 \u2212 2x + 1/2 = 0 \u21d2 x = 1 \u00b1 \u221a(1/2): (1.71, 0.29) or (0.29, 1.71).\"},\n{q:\"Find the points of intersection of the line x + y = 2 and the circle x\u00b2 + y\u00b2 = 8.\",a:\"Substituting y = 2 \u2212 x: x\u00b2 \u2212 2x \u2212 2 = 0, x = 1 \u00b1 \u221a3. Points (2.73, \u22120.73) and (\u22120.73, 2.73).\"},\n{q:\"Find the points of intersection of the line x + y = 4 and the parabola y = x\u00b2 + 2.\",a:\"4 \u2212 x = x\u00b2 + 2 \u21d2 x\u00b2 + x \u2212 2 = 0 \u21d2 x = \u22122 or 1. Points (\u22122, 6) and (1, 3).\"},\n{q:\"A day-trip boat hire costs $240. With x people originally booked, three extra people join and the cost per person falls by $4. How many people were originally booked?\",a:\"240/x \u2212 240/(x + 3) = 4 \u21d2 720 = 4x(x + 3) \u21d2 x\u00b2 + 3x \u2212 180 = 0 \u21d2 x = 12. So 12 people.\"},\n{q:\"A salesman travelled 280 km to Melbourne. For the last 100 km he travelled 10 km/h faster than for the first 180 km. The journey took 3 hours. (a) Time for the first 180 km. (b) Time for the last 100 km. (c) Find the speeds.\",a:\"(a) 180/x, where x is the speed for the first 180 km.\u003cbr>(b) 100/(x + 10).\u003cbr>(c) 180/x + 100/(x + 10) = 3 \u21d2 3x\u00b2 \u2212 250x \u2212 1800 = 0 \u21d2 x = 90. Speeds: 90 km/h and 100 km/h.\"}]}]}\n};\n\nconst nav=document.getElementById(\"nav\"),main=document.getElementById(\"main\");\nlet P={};try{P=JSON.parse(localStorage.getItem(\"sm-prog\")||\"{}\")}catch(e){}\nconst save=()=>{try{localStorage.setItem(\"sm-prog\",JSON.stringify(P))}catch(e){}};\nlet pg=\"learn\",tp=\"ov\",filt=\"all\",qry=\"\";\nconst tl={c:\"In class\",h:\"At home\",x:\"Extension\"};\nconst SH={\"7A\":\"Direct proof\",\"7B\":\"Contrapositive\",\"7C\":\"Contradiction\",\"7D\":\"Equivalence\",\"7E\":\"Disproving\",\"C1\":\"Arithmetic\",\"C2\":\"Polar form\",\"C3\":\"Roots & loci\"};\nconst BL={\"7A\":\"Assume P and chain steps to Q. Even/odd algebra, divisibility, inequalities.\",\"7B\":\"Negations, De Morgan, and proving P \u21d2 Q by proving (not Q) \u21d2 (not P).\",\"7C\":\"Assume the opposite and reach an impossibility (\u221a2, primes, parity).\",\"7D\":\"Converses and \u201cif and only if\u201d: prove both directions.\",\"7E\":\"Counterexamples, and disproving \u201cthere exists\u201d statements.\",\"C1\":\"i, arithmetic, conjugates, division, quadratics, square roots.\",\"C2\":\"Argand diagram, modulus, argument and polar (cis) form.\",\"C3\":\"de Moivre, nth roots, polynomial roots and loci.\"};\nconst EX={\n\"7A\":[[`Prove that for every real x > 0, x + 1/x \u2265 2.`,`Show the difference is non-negative: x + 1/x \u2212 2 = (x\u00b2 \u2212 2x + 1)/x = ((x \u2212 1)\u00b2)/x. Since (x\u22121)\u00b2 \u2265 0 and x > 0, the fraction is \u2265 0, so x + 1/x \u2265 2. \u220e`],[`Prove the product of two consecutive integers is even.`,`Let the integers be n and n+1.\u003cbr>Case 1: n even, n=2k, so n(n+1) = 2(k(2k+1)), even.\u003cbr>Case 2: n odd, so n+1 = 2k is even and n(n+1) = 2(nk), even. \u220e`]],\n\"7B\":[[`Prove: if n\u00b2 is even then n is even (n \u2208 \u2124).`,`Contrapositive: if n is odd then n\u00b2 is odd. Let n=2k+1: n\u00b2 = 4k\u00b2+4k+1 = 2(2k\u00b2+2k)+1, odd. The contrapositive is true, so the original is true. \u220e`],[`Prove: if n\u00b2 \u2212 6n + 5 is even then n is odd.`,`Contrapositive: n even \u21d2 n\u00b2 \u2212 6n + 5 odd. Let n=2k: 4k\u00b2 \u2212 12k + 5 = 2(2k\u00b2 \u2212 6k + 2) + 1, odd. \u220e`]],\n\"7C\":[[`Prove \u221a2 is irrational.`,`Suppose \u221a2 = p/q in lowest terms. Then p\u00b2 = 2q\u00b2, so p\u00b2 is even and p is even (7B). Let p=2m: 4m\u00b2 = 2q\u00b2, so q\u00b2 = 2m\u00b2 and q is even too. Now p, q share the factor 2, contradicting lowest terms. So \u221a2 is irrational. \u220e`],[`Prove there are infinitely many primes.`,`Suppose there are finitely many: p\u2081, \u2026, p\u2099. Let N = p\u2081p\u2082\u2026p\u2099 + 1. N leaves remainder 1 when divided by each p\u1d62, yet N has some prime factor. That prime is not on the list: contradiction. \u220e`]],\n\"7D\":[[`Prove n is even \u21d4 n\u00b2 is even (n \u2208 \u2124).`,`(\u21d2) n=2k \u21d2 n\u00b2 = 2(2k\u00b2), even.\u003cbr>(\u21d0) The contrapositive is \u201cn odd \u21d2 n\u00b2 odd\u201d, shown in 7B. Both directions hold. \u220e`],[`Is x = 3 \u21d4 x\u00b2 = 9 true for real x?`,`(\u21d2) x=3 \u21d2 x\u00b2=9 is true. (\u21d0) x\u00b2=9 \u21d2 x=3 is false: x=\u22123 is a counterexample. So they are not equivalent.`]],\n\"7E\":[[`Disprove: for all n \u2208 \u2115, n\u00b2 + n + 41 is prime.`,`One counterexample is enough. n = 41: 41\u00b2 + 41 + 41 = 41(41+1+1) = 41 \u00d7 43, composite.`],[`Disprove: there exists n \u2208 \u2115 with n\u00b2 + 13n + 42 prime.`,`Prove the negation: for all n it is not prime. n\u00b2 + 13n + 42 = (n+6)(n+7) and for n \u2265 1 both factors are at least 7, so it is composite. \u220e`]],\n\"C1\":[[`Simplify (3 \u2212 2i)(4 + i).`,`12 + 3i \u2212 8i \u2212 2i\u00b2 = 12 \u2212 5i + 2 = 14 \u2212 5i.`],[`Write (2 + i)/(3 \u2212 i) as a + bi.`,`Multiply top and bottom by 3 + i. Numerator: (2+i)(3+i) = 6+2i+3i+i\u00b2 = 5+5i. Denominator: 9+1 = 10. Answer: 1/2 + (1/2)i.`],[`Solve z\u00b2 + 2z + 5 = 0.`,`Discriminant 4 \u2212 20 = \u221216, so \u221a(\u221216) = 4i. z = (\u22122 \u00b1 4i)/2 = \u22121 \u00b1 2i, a conjugate pair.`]],\n\"C2\":[[`Write z = \u22122 + 2i in polar form.`,`r = \u221a(4+4) = 2\u221a2. \u03b1 = arctan(2/2) = \u03c0/4. Second quadrant: Arg = \u03c0 \u2212 \u03c0/4 = 3\u03c0/4. So z = 2\u221a2 cis(3\u03c0/4).`],[`Find Arg z for z = 3 \u2212 3\u221a3 i.`,`r = \u221a(9+27) = 6. \u03b1 = arctan(\u221a3) = \u03c0/3. Fourth quadrant: Arg = \u2212\u03c0/3.`]],\n\"C3\":[[`Calculate (\u221a3 + i)\u2076.`,`\u221a3 + i = 2 cis(\u03c0/6) (r = 2, tan \u03b1 = 1/\u221a3). De Moivre: 2\u2076 cis(6 \u00d7 \u03c0/6) = 64 cis \u03c0 = \u221264.`],[`Solve z\u2074 = 16 in \u2102.`,`16 = 16 cis 0, so z = 2 cis(2\u03c0k/4) = 2 cis(\u03c0k/2), k = 0,1,2,3, giving 2, 2i, \u22122, \u22122i. They are equally spaced on the circle |z| = 2.`]]};\nconst FC=[\n[\"Direct proof\",\"Assume P, then chain steps to reach Q. Even n=2k, odd n=2k+1 (k\u2208\u2124).\"],\n[\"Contrapositive of P \u21d2 Q\",\"(not Q) \u21d2 (not P). Logically equivalent to the original.\"],\n[\"Converse of P \u21d2 Q\",\"Q \u21d2 P. NOT equivalent, and may be false.\"],\n[\"Negation of \u201cP and Q\u201d\",\"(not P) or (not Q) (De Morgan).\"],\n[\"Negation of \u201cfor all x, P(x)\u201d\",\"There exists x with not P(x). (Swap \u2200\u2194\u2203 then negate.)\"],\n[\"Disprove a \u201cfor all\u201d statement\",\"Give ONE counterexample.\"],\n[\"Disprove a \u201cthere exists\u201d statement\",\"Prove its negation (for all \u2026 not \u2026), often by factorising.\"],\n[\"Proof by contradiction: steps\",\"1 Assume the statement is false. 2 Derive something impossible. 3 So the assumption was wrong, the statement is true.\"],\n[\"Prove P \u21d4 Q\",\"Prove (\u21d2) P \u21d2 Q and (\u21d0) Q \u21d2 P.\"],\n[\"Proof that \u221a2 is irrational\",\"Assume \u221a2=p/q in lowest terms \u21d2 p\u00b2=2q\u00b2 \u21d2 p even \u21d2 q even, contradicting lowest terms.\"],\n[\"i\u00b2 and powers of i\",\"i\u00b2 = \u22121. Powers cycle: i, \u22121, \u2212i, 1.\"],\n[\"z\u00b7z\u0304 for z = a+bi\",\"a\u00b2+b\u00b2 = |z|\u00b2 (real).\"],\n[\"Divide complex numbers\",\"Multiply top and bottom by the conjugate of the denominator.\"],\n[\"Range of principal Arg z\",\"\u2212\u03c0 \u003c Arg z \u2264 \u03c0\"],\n[\"Arg in quadrants 2, 3, 4 (\u03b1 acute reference angle)\",\"Q2: \u03c0\u2212\u03b1 \u00b7 Q3: \u2212(\u03c0\u2212\u03b1) \u00b7 Q4: \u2212\u03b1\"],\n[\"Multiply in polar form\",\"Multiply moduli, add arguments: r\u2081r\u2082 cis(\u03b8\u2081+\u03b8\u2082).\"],\n[\"Divide in polar form\",\"Divide moduli, subtract arguments: (r\u2081/r\u2082) cis(\u03b8\u2081\u2212\u03b8\u2082).\"],\n[\"de Moivre\u2019s theorem\",\"(r cis \u03b8)\u207f = r\u207f cis(n\u03b8)\"],\n[\"nth roots of r cis \u03b8\",\"r^(1/n) cis((\u03b8+2\u03c0k)/n), k = 0, 1, \u2026, n\u22121 (equally spaced on a circle).\"],\n[\"Complex roots of a real-coefficient polynomial\",\"Come in conjugate pairs. A pair \u03b1, \u1fb1 gives factor x\u00b2 \u2212 2Re(\u03b1)x + |\u03b1|\u00b2.\"],\n[\"|z \u2212 w| = r\",\"Circle, centre w, radius r.\"],\n[\"|z \u2212 u| = |z \u2212 w|\",\"Perpendicular bisector of the points u and w (a line).\"],\n[\"Arg(z \u2212 w) = \u03b8\",\"Ray from w at angle \u03b8 (w itself excluded).\"]];\nconst fc={i:0,f:false,o:FC.map((_,i)=>i)};\nconst plain=h=>h.replace(/\u003c[^>]+>/g,\" \").toLowerCase();\nconst esc=t=>t.replace(/&/g,\"&amp;\").replace(/\"/g,\"&quot;\").replace(/\u003c/g,\"&lt;\");\nconst Qm={};D.forEach(s=>s.qs.forEach(q=>Qm[s.id+q.r]=q));\nconst dn=s=>s.qs.filter(q=>P[s.id+q.r]).length;\nfunction stat(){let t=0,d=0;D.forEach(s=>{t+=s.qs.length;d+=dn(s)});const p=Math.round(100*d/t);document.querySelector(\"#bar i\").style.width=p+\"%\";document.getElementById(\"pc\").textContent=d+\" of \"+t+\" questions done (\"+p+\"%)\";navR()}\nfunction navR(){\n const T=[[\"learn\",\"\ud83d\udcd6 Learn\"],[\"q\",\"\u270f\ufe0f Questions\"],[\"rev\",\"\ud83c\udccf Revise\"]];\n let h='\u003cdiv class=\"tabs\">'+T.map(t=>`\u003cbutton class=\"tab${pg==t[0]?\" on\":\"\"}\" data-go=\"${t[0]}\">${t[1]}\u003c/button>`).join(\"\")+'\u003cbutton id=\"th\" style=\"margin-left:auto\" aria-label=\"Toggle dark mode\">\u25d0\u003c/button>\u003c/div>';\n (q.a)}\u003c/div>\u003c/details>\u003c/div>`}\nconst FL=[[\"all\",\"All\"],[\"c\",\"In class\"],[\"h\",\"At home\"],[\"x\",\"Extension\"],[\"f\",\"\u2605 Flagged\"]];\nfunction qP(){return `\u003cdiv class=\"tb\">\u003cinput id=\"sq\" type=\"search\" placeholder=\"Search all questions and solutions\u2026\" value=\"${esc(qry)}\">`+FL.map(f=>`\u003cbutton data-f=\"${f[0]}\" class=\"${f[0]==filt?\"on\":\"\"}\">${f[1]}\u003c/button>`).join(\"\")+`\u003cbutton id=\"rn\">\ud83c\udfb2 Random\u003c/button>\u003c/div>\u003cdiv id=\"res\">\u003c/div>`}\nfunction fill(){\n const k=qry.toLowerCase(),all=tp==\"all\"||!!k;\n const ok=(s,q)=>(filt==\"all\"||(filt==\"f\"?P[\"f:\"+s.id+q.r]:q.t==filt))&&(!k||plain(q.r+\" \"+q.q+\" \"+q.a).includes(k));\n let h=\"\";\n D.forEach(s=>{if(!all&&s.id!=tp)return;const qs=s.qs.filter(q=>ok(s,q));if(!qs.length)return;\n  h+=`\u003csection>\u003cspan class=\"wk\">${s.wk}\u003c/span> \u003cspan class=\"wk\">${dn(s)}/${s.qs.length} done\u003c/span>\u003ch2>${s.title}\u003c/h2>\u003cdiv class=\"acts\" style=\"margin:0 0 4px\">\u003cbutton data-go=\"learn/${s.id}\">\ud83d\udcd6 Theory for ${s.id}\u003c/button>\u003c/div>`;\n  [\"c\",\"h\",\"x\"].forEach(t=>{const g=qs.filter(q=>q.t==t);if(g.length)h+=`\u003ch3>${s.id[0]==\"C\"?\"Practice\":tl[t]} (${g.length})\u003c/h3>`+g.map(q=>qCard(s,q)).join(\"\")});\n  h+=\"\u003c/section>\"});\n document.getElementById(\"res\").innerHTML=h||\"\u003cp class=sub>No questions match. Try another search or filter.\u003c/p>\"}\nfunction drawFC(){const c=document.getElementById(\"fcard\");if(!c)return;const x=FC[fc.o[fc.i]];c.className=\"fcard\"+(fc.f?\" bk\":\"\");c.innerHTML=fm(fc.f?x[1]:x[0]);document.getElementById(\"fcn\").textContent=(fc.i+1)+\" / \"+FC.length+(fc.f?\"\":\" (tap card to flip)\")}\nfunction revP(){return `\u003csection id=\"FC\">\u003cspan class=\"wk\">Revision\u003c/span>\u003ch2>Flashcards & cheat sheet\u003c/h2>\u003cdiv id=\"fcard\" class=\"fcard\" tabindex=\"0\">\u003c/div>\u003cdiv cl
