03cdiv class=\"chips\" id=\"ch\">\u003c/div>\n\u003cdiv id=\"kp\">\u003cb>Use the tutor in this file\u003c/b>\u003cbr>This copy is open outside Claude, so it needs your own Anthropic API key (from console.anthropic.com; API usage is billed separately from a claude.ai plan). The key is kept only in this browser and sent only to Anthropic.\u003cinput id=\"ki\" type=\"password\" placeholder=\"sk-ant-\u2026\" autocomplete=\"off\">\u003cbutton id=\"ks\">Save key\u003c/button> \u003cbutton id=\"kc\">Remove key\u003c/button> \u003cspan id=\"kst\">\u003c/span>\u003c/div>\n\u003cdiv id=\"tf\">\u003ctextarea id=\"ti\" rows=\"2\" placeholder=\"Type your question\u2026\">\u003c/textarea>\u003cbutton id=\"ts\">Send\u003c/button>\u003c/div>\u003c/aside>\n\u003cscript>\nconst SITE={\"key\": \"y10psych\", \"title\": \"Year 10 Psychology Study Hub\", \"sub\": \"Topic 1: Role of the brain \u00b7 Topic 2: Intelligence \u00b7 Emotion and wellbeing. Tick questions off as you go. Try each question first, then reveal the answer.\", \"foot\": \"Notes based on your class slides (lessons 5, 6, 7, 9, 10) and your Topic 1 and Topic 2 success criteria. Practice questions, worked examples and tests were written for this hub, so check details against your teacher's notes.\", \"link\": \"https://claude.ai/artifact/Cizieb5a3NjstqNbTBXu4i\", \"hi\": \"Hi! Ask me anything about the brain, intelligence or emotion: explain an idea, check your answer, or ask for a hint instead of the full answer.\", \"sys\": \"You are a friendly psychology tutor for an Australian Year 10 student. Course topics: Topic 1 Role of the brain (neuron structure, hindbrain/midbrain/forebrain, lobes and localisation of function, Broca's and Wernicke's areas, history of invasive brain research and ethics, nervous system) and Topic 2 Intelligence (IQ and the psychometric approach, Stanford-Binet, WAIS-IV, WISC-V, validity and reliability, twin/family/adoption studies including the Minnesota Study of Twins Reared Apart, nature versus nurture, IQ versus EQ), plus theories of emotion (two-factor, appraisal), coping, the limbic system and LeDoux, happiness and flow. Teach the idea, not just the answer: if asked for a hint, give a nudge first; if they paste an answer, give feedback on what is correct and what is missing against the question. Be concise and encouraging. Write in plain text with no markdown headings. If asked something outside psychology, briefly help or steer back.\", \"sug\": [\"Explain the three parts of the brain simply\", \"How do twin studies show heritability?\", \"Validity vs reliability with an example\", \"Check my answer (I'll paste it)\"]};\nconst Q=(t,r,q,a)=>({t,r,q,a});\nconst D=[{\"id\": \"B1\", \"wk\": \"Topic 1: Role of the brain\", \"title\": \"B1 The neuron\", \"th\": \"\u003cdiv class=\\\"box\\\">\u003cb>Success criterion:\u003c/b> I can label and explain the function of the dendrites, cell body, axon, myelin sheath and axon terminals.\u003c/div>\u003cp>Neurons are the nerve cells that carry information around the nervous system (the human brain has roughly 86 billion of them). Each neuron has the same five key parts.\u003c/p>\\n\u003cfigure>\u003csvg viewBox=\\\"0 0 700 262\\\" role=\\\"img\\\" aria-label=\\\"Structure of a neuron\\\">\u003cdefs>\u003cmarker id=\\\"m8\\\" viewBox=\\\"0 0 10 10\\\" refX=\\\"9\\\" refY=\\\"5\\\" markerWidth=\\\"7\\\" markerHeight=\\\"7\\\" orient=\\\"auto-start-reverse\\\">\u003cpath d=\\\"M0 0L10 5L0 10z\\\" style=\\\"fill:var(--a)\\\"/>\u003c/marker>\u003c/defs>\u003cg class=\\\"ln2\\\">\u003cpath d=\\\"M140 104 C115 90 100 70 75 58\\\" class=\\\"dn\\\"/>\u003cpath d=\\\"M104 80 L72 86\\\" class=\\\"dn\\\"/>\u003cpath d=\\\"M134 120 L62 120\\\" class=\\\"dn\\\"/>\u003cpath d=\\\"M96 120 L70 100\\\" class=\\\"dn\\\"/>\u003cpath d=\\\"M140 136 C115 150 100 170 75 182\\\" class=\\\"dn\\\"/>\u003cpath d=\\\"M104 160 L72 154\\\" class=\\\"dn\\\"/>\u003c/g>\u003ccircle cx=\\\"170\\\" cy=\\\"120\\\" r=\\\"36\\\" class=\\\"n\\\"/>\u003ccircle cx=\\\"170\\\" cy=\\\"120\\\" r=\\\"12\\\" style=\\\"fill:var(--a);fill-opacity:.55\\\"/>\u003cline x1=\\\"206\\\" y1=\\\"120\\\" x2=\\\"565\\\" y2=\\\"120\\\" class=\\\"dn\\\" style=\\\"stroke-width:5\\\"/>\u003crect x=\\\"225\\\" y=\\\"106\\\" width=\\\"75\\\" height=\\\"28\\\" rx=\\\"14\\\" fill=\\\"#e8c06a\\\" stroke=\\\"#b8860b\\\" stroke-width=\\\"1.5\\\"/>\u003crect x=\\\"308\\\" y=\\\"106\\\" width=\\\"75\\\" height=\\\"28\\\" rx=\\\"14\\\" fill=\\\"#e8c06a\\\" stroke=\\\"#b8860b\\\" stroke-width=\\\"1.5\\\"/>\u003crect x=\\\"391\\\" y=\\\"106\\\" width=\\\"75\\\" height=\\\"28\\\" rx=\\\"14\\\" fill=\\\"#e8c06a\\\" stroke=\\\"#b8860b\\\" stroke-width=\\\"1.5\\\"/>\u003crect x=\\\"474\\\" y=\\\"106\\\" width=\\\"66\\\" height=\\\"28\\\" rx=\\\"14\\\" fill=\\\"#e8c06a\\\" stroke=\\\"#b8860b\\\" stroke-width=\\\"1.5\\\"/>\u003cpath d=\\\"M565 120 L605 82\\\" class=\\\"dn\\\"/>\u003cpath d=\\\"M565 120 L616 120\\\" class=\\\"dn\\\"/>\u003cpath d=\\\"M565 120 L605 158\\\" class=\\\"dn\\\"/>\u003ccircle cx=\\\"609\\\" cy=\\\"78\\\" r=\\\"8\\\" class=\\\"n hi\\\"/>\u003ccircle cx=\\\"622\\\" cy=\\\"120\\\" r=\\\"8\\\" class=\\\"n hi\\\"/>\u003ccircle cx=\\\"609\\\" cy=\\\"162\\\" r=\\\"8\\\" class=\\\"n hi\\\"/>\u003ctext class=\\\"b\\\" x=\\\"20\\\" y=\\\"22\\\" text-anchor=\\\"start\\\">Dendrites\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"20\\\" y=\\\"36\\\" text-anchor=\\\"start\\\">receive signals\u003c/text>\u003cpath class=\\\"ln\\\" d=\\\"M60 40 L78 58\\\"/>\u003ctext class=\\\"b\\\" x=\\\"215\\\" y=\\\"22\\\" text-anchor=\\\"middle\\\">Axon\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"215\\\" y=\\\"36\\\" text-anchor=\\\"middle\\\">carries the impulse\u003c/text>\u003cpath class=\\\"ln\\\" d=\\\"M215 42 L215 114\\\"/>\u003ctext class=\\\"b\\\" x=\\\"400\\\" y=\\\"22\\\" text-anchor=\\\"middle\\\">Myelin sheath\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"400\\\" y=\\\"36\\\" text-anchor=\\\"middle\\\">insulates and speeds the signal\u003c/text>\u003cpath class=\\\"ln\\\" d=\\\"M420 42 L420 106\\\"/>\u003ctext class=\\\"b\\\" x=\\\"150\\\" y=\\\"196\\\" text-anchor=\\\"middle\\\">Cell body (soma)\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"150\\\" y=\\\"210\\\" text-anchor=\\\"middle\\\">nucleus; keeps the cell alive,\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"150\\\" y=\\\"224\\\" text-anchor=\\\"middle\\\">combines incoming signals\u003c/text>\u003cpath class=\\\"ln\\\" d=\\\"M160 160 L160 180\\\"/>\u003ctext class=\\\"s\\\" x=\\\"335\\\" y=\\\"172\\\" text-anchor=\\\"middle\\\">Node of Ranvier (gap)\u003c/text>\u003cpath class=\\\"ln\\\" d=\\\"M304 160 L304 134\\\"/>\u003cpath class=\\\"ln\\\" d=\\\"M304 160 L330 162\\\"/>\u003ctext class=\\\"b\\\" x=\\\"585\\\" y=\\\"196\\\" text-anchor=\\\"middle\\\">Axon terminals\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"585\\\" y=\\\"210\\\" text-anchor=\\\"middle\\\">release neurotransmitters\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"585\\\" y=\\\"224\\\" text-anchor=\\\"middle\\\">into the synapse\u003c/text>\u003cpath class=\\\"ln\\\" d=\\\"M600 183 L608 172\\\"/>\u003cpath class=\\\"ar\\\" d=\\\"M230 252 L520 252\\\" marker-end=\\\"url(#m8)\\\"/>\u003ctext class=\\\"xs\\\" x=\\\"375\\\" y=\\\"246\\\" text-anchor=\\\"middle\\\">direction of the signal\u003c/text>\u003c/svg>\u003cfigcaption>Schematic neuron (not to scale). The signal travels dendrites \u2192 cell body \u2192 axon \u2192 axon terminals, then crosses the synapse to the next neuron.\u003c/figcaption>\u003c/figure>\\n\\n\u003cdiv class=\\\"tw\\\">\u003ctable>\\n\u003ctr>\u003cth>Part\u003c/th>\u003cth>Structure\u003c/th>\u003cth>Function\u003c/th>\u003c/tr>\\n\u003ctr>\u003ctd>\u003cb>Dendrites\u003c/b>\u003c/td>\u003ctd>Short, branching extensions from the cell body\u003c/td>\u003ctd>Receive signals (neurotransmitters) from other neurons and pass them to the cell body\u003c/td>\u003c/tr>\\n\u003ctr>\u003ctd>\u003cb>Cell body (soma)\u003c/b>\u003c/td>\u003ctd>Contains the nucleus and organelles\u003c/td>\u003ctd>Keeps the cell alive and combines incoming signals to \\\"decide\\\" whether the neuron will fire\u003c/td>\u003c/tr>\\n\u003ctr>\u003ctd>\u003cb>Axon\u003c/b>\u003c/td>\u003ctd>One long fibre leaving the cell body\u003c/td>\u003ctd>Carries the electrical impulse away from the cell body toward other cells\u003c/td>\u003c/tr>\\n\u003ctr>\u003ctd>\u003cb>Myelin sheath\u003c/b>\u003c/td>\u003ctd>Fatty insulating layer wrapped around the axon in segments, with small gaps called nodes of Ranvier\u003c/td>\u003ctd>Insulates and protects the axon and makes the impulse travel much faster (it \\\"jumps\\\" between the nodes). Damage to myelin slows or disrupts messages (as in multiple sclerosis)\u003c/td>\u003c/tr>\\n\u003ctr>\u003ctd>\u003cb>Axon terminals\u003c/b> (terminal buttons)\u003c/td>\u003ctd>Branched ends of the axon containing vesicles of neurotransmitter\u003c/td>\u003ctd>Release neurotransmitters into the synapse (the tiny gap) to pass the message to the next neuron\u003c/td>\u003c/tr>\\n\u003c/table>\u003c/div>\\n\u003cdiv class=\\\"box\\\">\u003cb>Relay analogy (from Lesson 7):\u003c/b> dendrites receive the baton, the cell body decides what to do, the axon runs the race, the terminal buttons hand over the baton, and neurotransmitters are the baton. \u003cb>Direction:\u003c/b> dendrites \u2192 cell body \u2192 axon \u2192 axon terminals \u2192 synapse \u2192 next neuron.\u003c/div>\\n\u003cp>\u003cb>Types of neuron:\u003c/b> sensory neurons carry information from the body to the CNS; motor neurons carry commands from the CNS to muscles and glands; interneurons connect neurons within the brain and spinal cord.\u003c/p>\", \"qs\": [{\"t\": \"c\", \"r\": \"Q1\", \"q\": \"Label and explain the function of the parts of a neuron.\", \"a\": \"Dendrites receive signals; the cell body keeps the cell alive and combines signals; the axon carries the impulse away; the myelin sheath insulates the axon and speeds up transmission; axon terminals release neurotransmitters across the synapse to the next neuron.\"}, {\"t\": \"x\", \"r\": \"Q2\", \"q\": \"Explain why damage to the myelin sheath causes problems with movement or sensation.\", \"a\": \"Myelin insulates the axon and lets the impulse travel quickly. If it is damaged, messages slow down or are disrupted, so signals reach muscles or the brain late or not at all, causing weakness, numbness or poor coordination.\"}, {\"t\": \"c\", \"r\": \"Q3\", \"q\": \"Put these in the order a signal travels through one neuron: axon, dendrites, axon terminals, cell body.\", \"a\": \"Dendrites \u2192 cell body \u2192 axon \u2192 axon terminals (then across the synapse to the next neuron).\"}]}, {\"id\": \"B2\", \"wk\": \"Topic 1: Role of the brain\", \"title\": \"B2 Hindbrain, midbrain and forebrain\", \"th\": \"\u003cdiv class=\\\"box\\\">\u003cb>Success criterion:\u003c/b> I can describe the hindbrain, midbrain and forebrain and explain what types of behaviours each controls.\u003c/div>\u003cp>The brain can be viewed as discrete areas, each controlling different types of behaviour. In general, the lower, older areas control automatic survival functions and the higher areas control complex thinking and emotion.\u003c/p>\\n\u003cfigure>\u003csvg viewBox=\\\"0 0 720 295\\\" role=\\\"img\\\" aria-label=\\\"Forebrain, midbrain and hindbrain\\\">\u003cellipse cx=\\\"340\\\" cy=\\\"205\\\" rx=\\\"65\\\" ry=\\\"28\\\" fill=\\\"#8e5bb5\\\" fill-opacity=\\\".4\\\" stroke=\\\"#8e5bb5\\\" stroke-width=\\\"2\\\"/>\u003cellipse cx=\\\"247\\\" cy=\\\"218\\\" rx=\\\"28\\\" ry=\\\"17\\\" fill=\\\"#8e5bb5\\\" fill-opacity=\\\".4\\\" stroke=\\\"#8e5bb5\\\" stroke-width=\\\"2\\\"/>\u003cpath d=\\\"M232 232 L262 232 L256 285 L240 285 Z\\\" fill=\\\"#8e5bb5\\\" fill-opacity=\\\".4\\\" stroke=\\\"#8e5bb5\\\" stroke-width=\\\"2\\\"/>\u003crect x=\\\"228\\\" y=\\\"168\\\" width=\\\"38\\\" height=\\\"34\\\" rx=\\\"6\\\" fill=\\\"#e08a1e\\\" fill-opacity=\\\".45\\\" stroke=\\\"#e08a1e\\\" stroke-width=\\\"2\\\"/>\u003cpath d=\\\"M60 140 C50 70 130 25 230 25 C330 22 400 55 410 115 C416 150 390 165 360 168 L300 170 L260 172 L180 170 C120 175 70 175 60 140Z\\\" fill=\\\"#3b82c4\\\" fill-opacity=\\\".35\\\" stroke=\\\"#3b82c4\\\" stroke-width=\\\"2\\\"/>\u003ctext class=\\\"b\\\" x=\\\"235\\\" y=\\\"95\\\" text-anchor=\\\"middle\\\">FOREBRAIN\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"235\\\" y=\\\"111\\\" text-anchor=\\\"middle\\\">(cerebrum shown)\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"340\\\" y=\\\"209\\\" text-anchor=\\\"middle\\\">cerebellum\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"220\\\" y=\\\"189\\\" text-anchor=\\\"end\\\">midbrain\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"214\\\" y=\\\"222\\\" text-anchor=\\\"end\\\">pons\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"226\\\" y=\\\"262\\\" text-anchor=\\\"end\\\">medulla\u003c/text>\u003crect x=\\\"440\\\" y=\\\"29\\\" width=\\\"13\\\" height=\\\"13\\\" rx=\\\"3\\\" fill=\\\"#3b82c4\\\" fill-opacity=\\\".5\\\" stroke=\\\"#3b82c4\\\" stroke-width=\\\"2\\\"/>\u003ctext class=\\\"b\\\" x=\\\"460\\\" y=\\\"40\\\" text-anchor=\\\"start\\\">Forebrain\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"460\\\" y=\\\"55\\\" text-anchor=\\\"start\\\">cerebrum, thalamus, hypothalamus,\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"460\\\" y=\\\"69\\\" text-anchor=\\\"start\\\">limbic system, basal ganglia\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"460\\\" y=\\\"83\\\" text-anchor=\\\"start\\\">thought, emotion, memory, movement\u003c/text>\u003crect x=\\\"440\\\" y=\\\"114\\\" width=\\\"13\\\" height=\\\"13\\\" rx=\\\"3\\\" fill=\\\"#e08a1e\\\" fill-opacity=\\\".5\\\" stroke=\\\"#e08a1e\\\" stroke-width=\\\"2\\\"/>\u003ctext class=\\\"b\\\" x=\\\"460\\\" y=\\\"125\\\" text-anchor=\\\"start\\\">Midbrain\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"460\\\" y=\\\"140\\\" text-anchor=\\\"start\\\">superior/inferior colliculi,\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"460\\\" y=\\\"154\\\" text-anchor=\\\"start\\\">substantia nigra, reticular formation\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"460\\\" y=\\\"168\\\" text-anchor=\\\"start\\\">reflexes to sight and sound, arousal\u003c/text>\u003crect x=\\\"440\\\" y=\\\"199\\\" width=\\\"13\\\" height=\\\"13\\\" rx=\\\"3\\\" fill=\\\"#8e5bb5\\\" fill-opacity=\\\".5\\\" stroke=\\\"#8e5bb5\\\" stroke-width=\\\"2\\\"/>\u003ctext class=\\\"b\\\" x=\\\"460\\\" y=\\\"210\\\" text-anchor=\\\"start\\\">Hindbrain\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"460\\\" y=\\\"225\\\" text-anchor=\\\"start\\\">medulla, pons, cerebellum\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"460\\\" y=\\\"239\\\" text-anchor=\\\"start\\\">breathing, heart rate, balance,\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"460\\\" y=\\\"253\\\" text-anchor=\\\"start\\\">coordination\u003c/text>\u003c/svg>\u003cfigcaption>Schematic side view (not to scale). The brainstem (midbrain, pons, medulla) joins the forebrain to the spinal cord; the cerebellum sits at the back, under the cerebrum.\u003c/figcaption>\u003c/figure>\\n\\n\u003cdiv class=\\\"tw\\\">\u003ctable>\\n\u003ctr>\u003cth>Region\u003c/th>\u003cth>Structures\u003c/th>\u003cth>What it controls\u003c/th>\u003c/tr>\\n\u003ctr>\u003ctd rowspan=\\\"3\\\">\u003cb>Hindbrain\u003c/b>\u003cbr>(base of brain, joins the spinal cord; automatic survival and coordination)\u003c/td>\u003ctd>\u003cb>Medulla\u003c/b>\u003c/td>\u003ctd>Heart rate, breathing, blood pressure, swallowing, vomiting. Damage can be life-threatening\u003c/td>\u003c/tr>\\n\u003ctr>\u003ctd>\u003cb>Pons\u003c/b>\u003c/td>\u003ctd>Relays messages between the cerebrum and cerebellum; involved in sleep and arousal, facial movement and sensation, and regulating breathing\u003c/td>\u003c/tr>\\n\u003ctr>\u003ctd>\u003cb>Cerebellum\u003c/b>\u003c/td>\u003ctd>Balance, posture, coordination of smooth voluntary movement, fine motor skills and motor learning (e.g. riding a bike, catching a ball)\u003c/td>\u003c/tr>\\n\u003ctr>\u003ctd>\u003cb>Midbrain\u003c/b>\u003cbr>(small region above the pons)\u003c/td>\u003ctd>Superior and inferior colliculi; substantia nigra; part of the reticular formation\u003c/td>\u003ctd>Automatic reflex responses to sights and sounds (turning toward a loud noise), eye movement, alertness and arousal, and movement control (substantia nigra uses dopamine)\u003c/td>\u003c/tr>\\n\u003ctr>\u003ctd rowspan=\\\"5\\\">\u003cb>Forebrain\u003c/b>\u003cbr>(largest region; complex thought, emotion and voluntary behaviour)\u003c/td>\u003ctd>\u003cb>Cerebrum\u003c/b> (cerebral cortex, four lobes, two hemispheres joined by the corpus callosum)\u003c/td>\u003ctd>Perception, thinking, planning, language, memory, voluntary movement (see topic B3)\u003c/td>\u003c/tr>\\n\u003ctr>\u003ctd>\u003cb>Thalamus\u003c/b>\u003c/td>\u003ctd>Sensory relay station; sends incoming information (except smell) to the right brain areas\u003c/td>\u003c/tr>\\n\u003ctr>\u003ctd>\u003cb>Hypothalamus\u003c/b>\u003c/td>\u003ctd>Regulates body temperature, hunger, thirst and sleep; controls the stress response and hormones (through the pituitary gland)\u003c/td>\u003c/tr>\\n\u003ctr>\u003ctd>\u003cb>Limbic system\u003c/b> (amygdala, hippocampus, etc.)\u003c/td>\u003ctd>Emotion, motivation, memory and learning (see topic E3)\u003c/td>\u003c/tr>\\n\u003ctr>\u003ctd>\u003cb>Basal ganglia\u003c/b>\u003c/td>\u003ctd>Smooth voluntary movement, habits, reward and decision-making\u003c/td>\u003c/tr>\\n\u003c/table>\u003c/div>\\n\u003cp>\u003cb>Memory hook:\u003c/b> hindbrain = \u003ci>keeps you alive and balanced\u003c/i>; midbrain = \u003ci>quick reflexes and alertness\u003c/i>; forebrain = \u003ci>think, feel, decide\u003c/i>. The \u003cb>brainstem\u003c/b> is the stalk made of the midbrain, pons and medulla.\u003c/p>\", \"qs\": [{\"t\": \"c\", \"r\": \"Q1\", \"q\": \"Describe the hindbrain, midbrain and forebrain and the behaviours each controls.\", \"a\": \"Hindbrain (medulla, pons, cerebellum): breathing, heart rate, balance and coordination. Midbrain: reflex responses to sights and sounds, alertness and some movement control. Forebrain (cerebrum, thalamus, hypothalamus, limbic system): thinking, language, memory, emotion and voluntary movement.\"}, {\"t\": \"h\", \"r\": \"Q2\", \"q\": \"A person has a stroke that damages the medulla. Why is this so dangerous?\", \"a\": \"The medulla controls breathing, heart rate and blood pressure. Damage can stop these automatic survival functions, so it can be life-threatening.\"}, {\"t\": \"h\", \"r\": \"Q3\", \"q\": \"A person can move their muscles but cannot balance or coordinate smooth movements. Which brain region is most likely damaged? Explain.\", \"a\": \"The cerebellum (hindbrain). It coordinates balance, posture and smooth voluntary movement, so damage causes clumsy, unsteady movement.\"}]}, {\"id\": \"B3\", \"wk\": \"Topic 1: Role of the brain\", \"title\": \"B3 Cortex and the four lobes (Lesson 5)\", \"th\": \"\u003cdiv class=\\\"box\\\">\u003cb>Success criterion:\u003c/b> I can use brain localisation to predict how damage to specific areas would affect cognition or behaviour.\u003c/div>\u003ch3>The cerebral cortex\u003c/h3>\\n\u003cul>\\n\u003cli>Thin outer layer of the cerebrum (about 3 mm) containing billions of neurons.\u003c/li>\\n\u003cli>Humans have the largest, most complex cortex, which supports higher thinking (perception, memory, thinking, language, voluntary movement).\u003c/li>\\n\u003cli>It is folded to increase surface area. \u003cb>Gyri\u003c/b> = raised folds. \u003cb>Sulci\u003c/b> = grooves/valleys. Folds make room for more neurons and blood vessels (which deliver oxygen and glucose).\u003c/li>\\n\u003cli>Each hemisphere is divided into \u003cb>four lobes\u003c/b>.\u003c/li>\\n\u003c/ul>\\n\u003cdiv class=\\\"tw\\\">\u003ctable>\\n\u003ctr>\u003cth>Lobe\u003c/th>\u003cth>Memory hook\u003c/th>\u003cth>Functions\u003c/th>\u003cth>Primary area\u003c/th>\u003cth>If damaged\u003c/th>\u003c/tr>\\n\u003ctr>\u003ctd>\u003cb>Frontal\u003c/b>\u003c/td>\u003ctd>DO\u003c/td>\u003ctd>Planning, decision-making, problem-solving, attention, impulse control, social behaviour, abstract thought, speech production (Broca's area), voluntary movement\u003c/td>\u003ctd>Primary motor cortex\u003c/td>\u003ctd>Poor decisions, repeats mistakes, acts without thinking, struggles to plan\u003c/td>\u003c/tr>\\n\u003ctr>\u003ctd>\u003cb>Parietal\u003c/b>\u003c/td>\u003ctd>FEEL\u003c/td>\u003ctd>Touch, temperature, pressure, pain, spatial awareness/orientation, coordinating movement in the environment\u003c/td>\u003ctd>Primary somatosensory cortex\u003c/td>\u003ctd>Trouble processing sensations or judging where the body/objects are\u003c/td>\u003c/tr>\\n\u003ctr>\u003ctd>\u003cb>Temporal\u003c/b>\u003c/td>\u003ctd>HEAR and REMEMBER\u003c/td>\u003ctd>Hearing, language, recognising voices/faces/objects, memory, linking sounds to emotions\u003c/td>\u003ctd>Primary auditory cortex\u003c/td>\u003ctd>Primary auditory damage: forms of deafness. Right auditory association cortex: trouble recognising non-verbal sounds or locating where a sound comes from\u003c/td>\u003c/tr>\\n\u003ctr>\u003ctd>\u003cb>Occipital\u003c/b>\u003c/td>\u003ctd>Occipital = Observe (SEE)\u003c/td>\u003ctd>Vision: colour, shape, movement, interpreting what you see\u003c/td>\u003ctd>Primary visual cortex\u003c/td>\u003ctd>Vision problems\u003c/td>\u003c/tr>\\n\u003c/table>\u003c/div>\\n\u003cfigure>\u003csvg viewBox=\\\"0 0 700 272\\\" role=\\\"img\\\" aria-label=\\\"Side view of the left cerebral hemisphere with the four lobes\\\">\u003cclipPath id=\\\"bc\\\">\u003cpath d=\\\"M70 170 C60 90 140 40 240 38 C340 34 420 70 430 140 C436 175 410 190 380 192 L330 195 C300 230 240 235 200 215 C170 205 150 200 120 200 C90 200 72 190 70 170 Z\\\"/>\u003c/clipPath>\u003cg clip-path=\\\"url(#bc)\\\">\u003cpolygon points=\\\"0,0 250,0 238,157 140,172 100,300 0,300\\\" fill=\\\"#3b82c4\\\" fill-opacity=\\\".38\\\" stroke=\\\"#3b82c4\\\" stroke-width=\\\"2\\\"/>\u003cpolygon points=\\\"250,0 360,0 350,140 238,157\\\" fill=\\\"#2e9e6b\\\" fill-opacity=\\\".38\\\" stroke=\\\"#2e9e6b\\\" stroke-width=\\\"2\\\"/>\u003cpolygon points=\\\"140,172 238,157 350,140 350,300 100,300\\\" fill=\\\"#d98a1f\\\" fill-opacity=\\\".38\\\" stroke=\\\"#d98a1f\\\" stroke-width=\\\"2\\\"/>\u003cpolygon points=\\\"360,0 700,0 700,300 350,300 350,140\\\" fill=\\\"#a855a8\\\" fill-opacity=\\\".38\\\" stroke=\\\"#a855a8\\\" stroke-width=\\\"2\\\"/>\u003c/g>\u003cpath d=\\\"M70 170 C60 90 140 40 240 38 C340 34 420 70 430 140 C436 175 410 190 380 192 L330 195 C300 230 240 235 200 215 C170 205 150 200 120 200 C90 200 72 190 70 170 Z\\\" fill=\\\"none\\\" style=\\\"stroke:var(--ink)\\\" stroke-width=\\\"2\\\"/>\u003cline x1=\\\"243\\\" y1=\\\"40\\\" x2=\\\"231\\\" y2=\\\"150\\\" stroke=\\\"#1d4f8a\\\" stroke-width=\\\"7\\\" stroke-linecap=\\\"round\\\"/>\u003cline x1=\\\"257\\\" y1=\\\"40\\\" x2=\\\"245\\\" y2=\\\"150\\\" stroke=\\\"#14704a\\\" stroke-width=\\\"7\\\" stroke-linecap=\\\"round\\\"/>\u003ctext class=\\\"xs\\\" x=\\\"238\\\" y=\\\"16\\\" text-anchor=\\\"end\\\">primary motor cortex\u003c/text>\u003ctext class=\\\"xs\\\" x=\\\"262\\\" y=\\\"16\\\" text-anchor=\\\"start\\\">primary somatosensory cortex\u003c/text>\u003cpath d=\\\"M240 20 L240 33\\\" class=\\\"ln\\\"/>\u003cpath d=\\\"M260 20 L260 33\\\" class=\\\"ln\\\"/>\u003ctext class=\\\"b\\\" x=\\\"150\\\" y=\\\"100\\\" text-anchor=\\\"middle\\\">Frontal\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"150\\\" y=\\\"116\\\" text-anchor=\\\"middle\\\">DO\u003c/text>\u003ctext class=\\\"b\\\" x=\\\"305\\\" y=\\\"84\\\" text-anchor=\\\"middle\\\">Parietal\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"305\\\" y=\\\"100\\\" text-anchor=\\\"middle\\\">FEEL\u003c/text>\u003ctext class=\\\"b\\\" x=\\\"392\\\" y=\\\"104\\\" text-anchor=\\\"middle\\\">Occipital\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"392\\\" y=\\\"120\\\" text-anchor=\\\"middle\\\">SEE\u003c/text>\u003ctext class=\\\"b\\\" x=\\\"255\\\" y=\\\"188\\\" text-anchor=\\\"middle\\\">Temporal\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"255\\\" y=\\\"203\\\" text-anchor=\\\"middle\\\">HEAR + REMEMBER\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"60\\\" y=\\\"262\\\" text-anchor=\\\"start\\\">\u2190 front\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"440\\\" y=\\\"262\\\" text-anchor=\\\"end\\\">back \u2192\u003c/text>\u003crect x=\\\"450\\\" y=\\\"29\\\" width=\\\"13\\\" height=\\\"13\\\" rx=\\\"3\\\" fill=\\\"#3b82c4\\\" fill-opacity=\\\".5\\\" stroke=\\\"#3b82c4\\\" stroke-width=\\\"2\\\"/>\u003ctext class=\\\"b\\\" x=\\\"470\\\" y=\\\"40\\\" text-anchor=\\\"start\\\">Frontal: DO\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"470\\\" y=\\\"55\\\" text-anchor=\\\"start\\\">planning, decisions, movement,\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"470\\\" y=\\\"69\\\" text-anchor=\\\"start\\\">speech production (Broca's area)\u003c/text>\u003crect x=\\\"450\\\" y=\\\"87\\\" width=\\\"13\\\" height=\\\"13\\\" rx=\\\"3\\\" fill=\\\"#2e9e6b\\\" fill-opacity=\\\".5\\\" stroke=\\\"#2e9e6b\\\" stroke-width=\\\"2\\\"/>\u003ctext class=\\\"b\\\" x=\\\"470\\\" y=\\\"98\\\" text-anchor=\\\"start\\\">Parietal: FEEL\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"470\\\" y=\\\"113\\\" text-anchor=\\\"start\\\">touch, pain, temperature,\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"470\\\" y=\\\"127\\\" text-anchor=\\\"start\\\">spatial awareness\u003c/text>\u003crect x=\\\"450\\\" y=\\\"145\\\" width=\\\"13\\\" height=\\\"13\\\" rx=\\\"3\\\" fill=\\\"#d98a1f\\\" fill-opacity=\\\".5\\\" stroke=\\\"#d98a1f\\\" stroke-width=\\\"2\\\"/>\u003ctext class=\\\"b\\\" x=\\\"470\\\" y=\\\"156\\\" text-anchor=\\\"start\\\">Temporal: HEAR + REMEMBER\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"470\\\" y=\\\"171\\\" text-anchor=\\\"start\\\">sound, language, memory,\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"470\\\" y=\\\"185\\\" text-anchor=\\\"start\\\">recognising voices and faces\u003c/text>\u003crect x=\\\"450\\\" y=\\\"203\\\" width=\\\"13\\\" height=\\\"13\\\" rx=\\\"3\\\" fill=\\\"#a855a8\\\" fill-opacity=\\\".5\\\" stroke=\\\"#a855a8\\\" stroke-width=\\\"2\\\"/>\u003ctext class=\\\"b\\\" x=\\\"470\\\" y=\\\"214\\\" text-anchor=\\\"start\\\">Occipital: SEE\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"470\\\" y=\\\"229\\\" text-anchor=\\\"start\\\">vision: colour, shape, movement\u003c/text>\u003c/svg>\u003cfigcaption>Schematic side view of one hemisphere (not to scale). Front of the brain is on the left. The motor and somatosensory strips sit either side of the central sulcus.\u003c/figcaption>\u003c/figure>\\n\u003cdiv class=\\\"box\\\">\u003cb>Frontal lobe extras:\u003c/b> largest lobe, last to fully develop, still developing through adolescence (\\\"the brain's CEO\\\"). Waving to a friend uses three areas: \u003cb>Prefrontal\u003c/b> (plans) \u2192 \u003cb>Premotor\u003c/b> (organises) \u2192 \u003cb>Primary motor\u003c/b> (sends signals to muscles). Hook: Plan \u2192 Prepare \u2192 Perform.\u003c/div>\\n\u003cdiv class=\\\"box\\\">\u003cb>Contralateral organisation:\u003c/b> each hemisphere controls the \u003ci>opposite\u003c/i> side of the body. Left hemisphere \u2192 right body. Right hemisphere \u2192 left body. So damage to the right primary motor cortex affects the \u003cb>left\u003c/b> side.\u003c/div>\\n\u003cp>\u003cb>M\u00fcller-Lyer illusion:\u003c/b> two lines look different but are the same length, showing the brain \u003ci>interprets\u003c/i> what the eyes send it. \u003cb>Temporal example:\u003c/b> hearing a song from primary school and instantly remembering a school camp. Electrical stimulation of the temporal lobe can make people hear sounds that are not there.\u003c/p>\", \"qs\": [{\"t\": \"c\", \"r\": \"Q1\", \"q\": \"Identify the four lobes and one key function of each.\", \"a\": \"Frontal: planning, decision-making, voluntary movement. Parietal: processes touch and spatial awareness. Temporal: processes sound; contributes to memory and recognition. Occipital: processes visual information.\"}, {\"t\": \"c\", \"r\": \"Q2\", \"q\": \"Describe the cerebral cortex and why it matters.\", \"a\": \"The thin, folded outer layer of the cerebrum with billions of neurons. It handles perception, memory, thinking, language and voluntary movement. Folds increase surface area so more neurons fit in the skull.\"}, {\"t\": \"h\", \"r\": \"Q3\", \"q\": \"Two functions each of the frontal and temporal lobes, with real-life examples.\", \"a\": \"Frontal: planning/decision-making (organising study time before an exam); voluntary movement (kicking a football). Temporal: auditory processing (recognising a favourite song); memory (remembering details of a birthday party).\"}, {\"t\": \"h\", \"r\": \"Q4\", \"q\": \"Explain contralateral organisation using an example.\", \"a\": \"Each hemisphere controls the opposite side of the body. For example, damage to the right primary motor cortex weakens or paralyses the left side of the body.\"}]}, {\"id\": \"B4\", \"wk\": \"Topic 1: Role of the brain\", \"title\": \"B4 Language areas and localisation of function\", \"th\": \"\u003cdiv class=\\\"box\\\">\u003cb>Success criterion:\u003c/b> I can use brain localisation to predict how damage to specific areas would affect cognition or behaviour.\u003c/div>\u003cp>\u003cb>Localisation of function:\u003c/b> different brain areas perform different functions. Psychologists use it to predict the effects of damage (e.g. occipital damage \u2192 vision problems; frontal damage \u2192 planning, decision-making and impulse control problems).\u003c/p>\\n\u003cdiv class=\\\"tw\\\">\u003ctable>\\n\u003ctr>\u003cth>\u003c/th>\u003cth>Broca's area\u003c/th>\u003cth>Wernicke's area\u003c/th>\u003cth>Geschwind's territory\u003c/th>\u003c/tr>\\n\u003ctr>\u003ctd>\u003cb>Location\u003c/b>\u003c/td>\u003ctd>Left frontal lobe, near motor cortex\u003c/td>\u003ctd>Left temporal lobe, near auditory cortex\u003c/td>\u003ctd>Inferior parietal lobule, between Broca's and Wernicke's\u003c/td>\u003c/tr>\\n\u003ctr>\u003ctd>\u003cb>Main function\u003c/b>\u003c/td>\u003ctd>Speech production\u003c/td>\u003ctd>Language comprehension and interpretation\u003c/td>\u003ctd>Links understanding and production of language\u003c/td>\u003c/tr>\\n\u003ctr>\u003ctd>\u003cb>Helps us\u003c/b>\u003c/td>\u003ctd>Form words and sentences; coordinate lips, tongue, vocal cords\u003c/td>\u003ctd>Understand spoken/written language; produce grammatically correct speech\u003c/td>\u003ctd>Connect sounds, meanings and symbols; link words to objects and concepts\u003c/td>\u003c/tr>\\n\u003ctr>\u003ctd>\u003cb>Processing\u003c/b>\u003c/td>\u003ctd>Motor planning for speech\u003c/td>\u003ctd>Meaning and interpretation\u003c/td>\u003ctd>Multimodal (auditory + visual together)\u003c/td>\u003c/tr>\\n\u003ctr>\u003ctd>\u003cb>If damaged\u003c/b>\u003c/td>\u003ctd>\u003cb>Broca's aphasia:\u003c/b> slow, effortful, halting speech; understanding mostly intact\u003c/td>\u003ctd>\u003cb>Wernicke's aphasia:\u003c/b> fluent but meaningless speech; poor understanding\u003c/td>\u003ctd>\u003cb>Conduction aphasia:\u003c/b> trouble repeating words; fluent with errors; understanding mostly intact\u003c/td>\u003c/tr>\\n\u003ctr>\u003ctd>\u003cb>Development\u003c/b>\u003c/td>\u003ctd>Present early\u003c/td>\u003ctd>Present early\u003c/td>\u003ctd>Develops around ages 5 to 7\u003c/td>\u003c/tr>\\n\u003c/table>\u003c/div>\\n\u003cfigure>\u003csvg viewBox=\\\"0 0 680 290\\\" role=\\\"img\\\" aria-label=\\\"How the language areas connect\\\">\u003cdefs>\u003cmarker id=\\\"m2\\\" viewBox=\\\"0 0 10 10\\\" refX=\\\"9\\\" refY=\\\"5\\\" markerWidth=\\\"7\\\" markerHeight=\\\"7\\\" orient=\\\"auto-start-reverse\\\">\u003cpath d=\\\"M0 0L10 5L0 10z\\\" style=\\\"fill:var(--a)\\\"/>\u003c/marker>\u003c/defs>\u003crect class=\\\"n\\\" x=\\\"20\\\" y=\\\"95\\\" width=\\\"190\\\" height=\\\"70\\\" rx=\\\"7\\\"/>\u003ctext class=\\\"b\\\" x=\\\"115.0\\\" y=\\\"120.0\\\" text-anchor=\\\"middle\\\">Wernicke's area\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"115.0\\\" y=\\\"134.0\\\" text-anchor=\\\"middle\\\">left temporal lobe\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"115.0\\\" y=\\\"148.0\\\" text-anchor=\\\"middle\\\">understands language\u003c/text>\u003crect class=\\\"n\\\" x=\\\"470\\\" y=\\\"95\\\" width=\\\"190\\\" height=\\\"70\\\" rx=\\\"7\\\"/>\u003ctext class=\\\"b\\\" x=\\\"565.0\\\" y=\\\"120.0\\\" text-anchor=\\\"middle\\\">Broca's area\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"565.0\\\" y=\\\"134.0\\\" text-anchor=\\\"middle\\\">left frontal lobe\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"565.0\\\" y=\\\"148.0\\\" text-anchor=\\\"middle\\\">produces speech\u003c/text>\u003crect class=\\\"n\\\" x=\\\"245\\\" y=\\\"180\\\" width=\\\"190\\\" height=\\\"62\\\" rx=\\\"7\\\"/>\u003ctext class=\\\"b\\\" x=\\\"340.0\\\" y=\\\"201.0\\\" text-anchor=\\\"middle\\\">Geschwind's territory\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"340.0\\\" y=\\\"215.0\\\" text-anchor=\\\"middle\\\">inferior parietal lobule\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"340.0\\\" y=\\\"229.0\\\" text-anchor=\\\"middle\\\">multimodal link (ages 5-7)\u003c/text>\u003cpath class=\\\"ar\\\" d=\\\"M115 95 C115 25 565 25 565 95\\\" marker-end=\\\"url(#m2)\\\"/>\u003ctext class=\\\"s\\\" x=\\\"340\\\" y=\\\"40\\\" text-anchor=\\\"middle\\\">arcuate fasciculus (direct link)\u003c/text>\u003cpath class=\\\"ar\\\" d=\\\"M115 165 L115 211 L245 211\\\" marker-end=\\\"url(#m2)\\\"/>\u003cpath class=\\\"ar\\\" d=\\\"M435 211 L565 211 L565 165\\\" marker-end=\\\"url(#m2)\\\"/>\u003ctext class=\\\"s\\\" x=\\\"340\\\" y=\\\"276\\\" text-anchor=\\\"middle\\\">Hear a word \u2192 understand its meaning \u2192 produce speech\u003c/text>\u003c/svg>\u003cfigcaption>Two routes link Wernicke's and Broca's areas: the arcuate fasciculus and Geschwind's territory (a parallel pathway). Arrows show the order: hear, understand, speak.\u003c/figcaption>\u003c/figure>\\n\u003ch3>Key studies and facts\u003c/h3>\\n\u003cul>\\n\u003cli>\u003cb>Broca (1861):\u003c/b> patient \\\"Tan\\\" understood language but could only say \\\"tan, tan\\\". He was intellectually normal, used gestures, and had right-side paralysis (so left-hemisphere damage). Autopsy found a lesion in the left frontal lobe. Broca later studied eight more patients with damage in the same area. This was the first strong evidence for localisation of function.\u003c/li>\\n\u003cli>\u003cb>Wernicke (1873):\u003c/b> studied a patient with a different language problem and linked it to a different region, supporting localisation (Broca's theory had been criticised at first).\u003c/li>\\n\u003cli>\u003cb>Geschwind:\u003c/b> neurologist who predicted the link between the two areas. Works alongside the \u003cb>arcuate fasciculus\u003c/b>, a parallel pathway also linking Broca's and Wernicke's. Supports classification, interpretation, abstract thinking and complex language.\u003c/li>\\n\u003cli>Pathway idea: hear a sound \u2192 understand its meaning \u2192 produce speech.\u003c/li>\\n\u003c/ul>\\n\\n\u003ch3>Using localisation to predict the effects of damage\u003c/h3>\\n\u003cdiv class=\\\"tw\\\">\u003ctable>\\n\u003ctr>\u003cth>Area damaged\u003c/th>\u003cth>Function lost or changed\u003c/th>\u003cth>Predicted effect on cognition or behaviour\u003c/th>\u003c/tr>\\n\u003ctr>\u003ctd>Prefrontal cortex\u003c/td>\u003ctd>Planning, judgement, impulse control\u003c/td>\u003ctd>Poor decisions, acts without thinking, personality change (as in Phineas Gage)\u003c/td>\u003c/tr>\\n\u003ctr>\u003ctd>Primary motor cortex (e.g. right side)\u003c/td>\u003ctd>Voluntary movement\u003c/td>\u003ctd>Weakness or paralysis on the \u003cb>opposite\u003c/b> side of the body (contralateral)\u003c/td>\u003c/tr>\\n\u003ctr>\u003ctd>Broca's area (left frontal)\u003c/td>\u003ctd>Speech production\u003c/td>\u003ctd>Slow, effortful speech, but understanding mostly intact\u003c/td>\u003c/tr>\\n\u003ctr>\u003ctd>Wernicke's area (left temporal)\u003c/td>\u003ctd>Language comprehension\u003c/td>\u003ctd>Fluent but meaningless speech; poor understanding\u003c/td>\u003c/tr>\\n\u003ctr>\u003ctd>Primary somatosensory cortex (parietal)\u003c/td>\u003ctd>Touch, pain, temperature, body position\u003c/td>\u003ctd>Reduced sensation on the opposite side; trouble judging where the body is in space\u003c/td>\u003c/tr>\\n\u003ctr>\u003ctd>Occipital lobe\u003c/td>\u003ctd>Vision\u003c/td>\u003ctd>Vision problems or loss, even though the eyes work\u003c/td>\u003c/tr>\\n\u003ctr>\u003ctd>Primary auditory cortex (temporal)\u003c/td>\u003ctd>Hearing\u003c/td>\u003ctd>Forms of deafness; right auditory association cortex: trouble recognising or locating non-verbal sounds\u003c/td>\u003c/tr>\\n\u003ctr>\u003ctd>Hippocampus\u003c/td>\u003ctd>Forming new memories\u003c/td>\u003ctd>Cannot form new long-term memories (as in patient H.M.)\u003c/td>\u003c/tr>\\n\u003ctr>\u003ctd>Amygdala\u003c/td>\u003ctd>Detecting danger, fear\u003c/td>\u003ctd>Reduced fear responses and trouble recognising fear in others\u003c/td>\u003c/tr>\\n\u003ctr>\u003ctd>Cerebellum\u003c/td>\u003ctd>Balance and coordination\u003c/td>\u003ctd>Clumsy, unsteady movement; trouble with fine motor tasks\u003c/td>\u003c/tr>\\n\u003ctr>\u003ctd>Medulla\u003c/td>\u003ctd>Breathing and heart rate\u003c/td>\u003ctd>Life-threatening\u003c/td>\u003c/tr>\\n\u003c/table>\u003c/div>\\n\u003cp>\u003cb>How to answer a prediction question:\u003c/b> (1) name the area, (2) state its function, (3) predict the specific change to thinking, feeling or behaviour, and (4) give a short example. \u003cb>Limits:\u003c/b> many behaviours involve several areas working together, damage is often spread across regions, and the brain can partly recover (plasticity), so predictions are likely effects rather than certainties.\u003c/p>\", \"qs\": [{\"t\": \"h\", \"r\": \"Q1\", \"q\": \"How can psychologists use localisation of function to predict the effects of brain damage?\", \"a\": \"Because different regions have different roles, knowing which area is damaged predicts the change. Occipital damage \u2192 vision problems. Frontal damage \u2192 planning, decision-making and impulse control problems.\"}, {\"t\": \"h\", \"r\": \"Q2\", \"q\": \"A person has damage to Broca's area. Predict the effects.\", \"a\": \"Speech production is affected: speech would be slow, halting and effortful, but understanding of language is mostly intact (Broca's aphasia). This is predicted because language production is localised to the left frontal lobe.\"}, {\"t\": \"h\", \"r\": \"Q3\", \"q\": \"Compare Broca's aphasia and Wernicke's aphasia.\", \"a\": \"Broca's aphasia (left frontal lobe): slow, effortful, halting speech but understanding mostly intact. Wernicke's aphasia (left temporal lobe): speech is fluent but meaningless and understanding is poor.\"}]}, {\"id\": \"B5\", \"wk\": \"Topic 1: Role of the brain\", \"title\": \"B5 How we learned about the brain: risky and invasive practices\", \"th\": \"\u003cdiv class=\\\"box\\\">\u003cb>Success criterion:\u003c/b> I can explain how early knowledge about the brain came from risky or invasive practices and why this raises ethical concerns.\u003c/div>\u003cp>Much early knowledge about the brain came from accidents, disease, surgery and experiments on patients and animals. This gave major discoveries but often came at a serious cost to the people involved.\u003c/p>\\n\u003cdiv class=\\\"tw\\\">\u003ctable>\\n\u003ctr>\u003cth>Case or method\u003c/th>\u003cth>What happened\u003c/th>\u003cth>What it taught us\u003c/th>\u003cth>Ethical concern\u003c/th>\u003c/tr>\\n\u003ctr>\u003ctd>\u003cb>Phineas Gage\u003c/b> (1848)\u003c/td>\u003ctd>An iron rod passed through his left frontal lobe in a railway accident. He survived\u003c/td>\u003ctd>Frontal lobe damage changed personality, planning and impulse control\u003c/td>\u003ctd>Single case with limited records; he was displayed publicly; no consent or protection for his privacy\u003c/td>\u003c/tr>\\n\u003ctr>\u003ctd>\u003cb>Broca's patient \\\"Tan\\\"\u003c/b> (1861) and \u003cb>Wernicke\u003c/b> (1873)\u003c/td>\u003ctd>Patients with language problems were studied; autopsies after death found brain lesions\u003c/td>\u003ctd>Localisation of function (Broca's and Wernicke's areas)\u003c/td>\u003ctd>Relied on patients suffering damage; research on a person who could not give meaningful consent\u003c/td>\u003c/tr>\\n\u003ctr>\u003ctd>\u003cb>Lobotomy\u003c/b> (Moniz 1935; Freeman 1940s)\u003c/td>\u003ctd>Nerve fibres in the frontal lobes were cut or damaged to treat mental illness. Freeman's transorbital version went through the eye socket, often without an operating theatre\u003c/td>\u003ctd>Showed the frontal lobes' role in personality and emotion\u003c/td>\u003ctd>Little evidence it worked; often done on vulnerable patients (including children) without real consent; caused apathy, loss of personality, brain damage and death. Thousands of people were affected\u003c/td>\u003c/tr>\\n\u003ctr>\u003ctd>\u003cb>Electrical stimulation\u003c/b> (Penfield, 1930s onward)\u003c/td>\u003ctd>Awake epilepsy patients had the cortex stimulated during surgery\u003c/td>\u003ctd>Mapped motor and sensory areas of the cortex\u003c/td>\u003ctd>Risky surgery; the research was done during treatment, so patients' consent and wellbeing had to come first\u003c/td>\u003c/tr>\\n\u003ctr>\u003ctd>\u003cb>H.M.\u003c/b> (1953)\u003c/td>\u003ctd>Both hippocampi were removed to treat severe epilepsy; he could no longer form new memories\u003c/td>\u003ctd>The hippocampus is essential for forming long-term memories\u003c/td>\u003ctd>Irreversible harm from an experimental operation; questions about his ability to give informed consent as he kept being studied for decades\u003c/td>\u003c/tr>\\n\u003ctr>\u003ctd>\u003cb>Split-brain surgery\u003c/b> (Sperry and Gazzaniga, 1960s)\u003c/td>\u003ctd>The corpus callosum was cut to treat severe epilepsy\u003c/td>\u003ctd>Left and right hemispheres have different specialisations\u003c/td>\u003ctd>Major surgery; research followed treatment\u003c/td>\u003c/tr>\\n\u003ctr>\u003ctd>\u003cb>Animal lesion studies\u003c/b>\u003c/td>\u003ctd>Parts of animal brains were removed or damaged to see what behaviour changed\u003c/td>\u003ctd>Linked brain areas to functions\u003c/td>\u003ctd>Animal suffering and welfare; results may not transfer fully to humans\u003c/td>\u003c/tr>\\n\u003c/table>\u003c/div>\\n\u003ch3>Why these raise ethical concerns\u003c/h3>\\n\u003cul>\\n\u003cli>\u003cb>Informed consent:\u003c/b> patients (especially children or those with mental illness or brain damage) may not understand risks or be able to agree.\u003c/li>\\n\u003cli>\u003cb>Harm versus benefit:\u003c/b> researchers must avoid or minimise harm, and benefits must justify the risks. Lobotomy caused great harm with little benefit.\u003c/li>\\n\u003cli>\u003cb>Vulnerable people:\u003c/b> patients in institutions or with serious illness were more easily pressured or exploited.\u003c/li>\\n\u003cli>\u003cb>Privacy and respect:\u003c/b> identifying details of patients such as Gage and H.M. became public.\u003c/li>\\n\u003cli>\u003cb>Animal welfare:\u003c/b> animals cannot consent and may suffer.\u003c/li>\\n\u003cli>\u003cb>Limits of the evidence:\u003c/b> case studies of one person are hard to generalise and have no control group.\u003c/li>\\n\u003c/ul>\\n\u003cp>\u003cb>Today:\u003c/b> research follows ethical guidelines (e.g. the Nuremberg Code, Declaration of Helsinki, and in Australia the NHMRC National Statement) and is approved by ethics committees. Key principles: informed consent, the right to withdraw, minimising harm, confidentiality, and weighing risk against benefit. Non-invasive tools such as MRI, fMRI, CT, PET and EEG now let researchers study living brains safely.\u003c/p>\", \"qs\": [{\"t\": \"h\", \"r\": \"Q1\", \"q\": \"Explain why some early brain research raises ethical concerns.\", \"a\": \"Much early knowledge came from accidents, surgery on patients and animal experiments (e.g. lobotomies, H.M.'s surgery). Concerns include lack of informed consent, serious and permanent harm, use of vulnerable patients, loss of privacy and animal suffering. Modern research requires ethics approval, informed consent and minimising harm.\"}, {\"t\": \"c\", \"r\": \"Q2\", \"q\": \"What did the case of Phineas Gage suggest about the frontal lobe?\", \"a\": \"After an iron rod damaged his left frontal lobe, his personality, planning and impulse control changed, suggesting the frontal lobe is involved in these functions.\"}]}, {\"id\": \"B6\", \"wk\": \"Topic 1: Role of the brain\", \"title\": \"B6 The nervous system (Lesson 6)\", \"th\": \"\u003cp>\u003cb>Basic flow:\u003c/b> sensory input \u2192 processing \u2192 response. Receptors (eyes, ears, skin, nose, tongue) send information in; the nervous system sends signals out to \u003cb>muscles\u003c/b> (movement) and \u003cb>glands\u003c/b> (hormones). Example: touching a hot pan, where skin receptors detect heat, the CNS processes it, and signals tell muscles to pull away.\u003c/p>\\n\u003cdiv class=\\\"sc\\\">\u003cb>Structure at a glance\u003c/b>\\n\u003cul>\\n\u003cli>\u003cb>Central Nervous System (CNS):\u003c/b> brain + spinal cord\u003c/li>\\n\u003cli>\u003cb>Peripheral Nervous System (PNS):\u003c/b> all nerves outside the brain and spinal cord\\n\u003cul>\u003cli>\u003cb>Somatic\u003c/b> (voluntary)\u003c/li>\u003cli>\u003cb>Autonomic\u003c/b> (automatic)\\n\u003cul>\u003cli>\u003cb>Sympathetic\u003c/b> (\\\"go\\\")\u003c/li>\u003cli>\u003cb>Parasympathetic\u003c/b> (\\\"rest and digest\\\")\u003c/li>\u003c/ul>\u003c/li>\u003c/ul>\u003c/li>\\n\u003c/ul>\u003c/div>\\n\u003cfigure>\u003csvg viewBox=\\\"0 0 745 322\\\" role=\\\"img\\\" aria-label=\\\"Divisions of the nervous system\\\">\u003crect class=\\\"n\\\" x=\\\"200\\\" y=\\\"8\\\" width=\\\"150\\\" height=\\\"42\\\" rx=\\\"7\\\"/>\u003ctext class=\\\"b\\\" x=\\\"275.0\\\" y=\\\"26.0\\\" text-anchor=\\\"middle\\\">Nervous system\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"275.0\\\" y=\\\"40.0\\\" text-anchor=\\\"middle\\\">two main divisions\u003c/text>\u003crect class=\\\"n\\\" x=\\\"55\\\" y=\\\"90\\\" width=\\\"150\\\" height=\\\"44\\\" rx=\\\"7\\\"/>\u003ctext class=\\\"b\\\" x=\\\"130.0\\\" y=\\\"109.0\\\" text-anchor=\\\"middle\\\">CNS\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"130.0\\\" y=\\\"123.0\\\" text-anchor=\\\"middle\\\">brain + spinal cord\u003c/text>\u003crect class=\\\"n\\\" x=\\\"335\\\" y=\\\"90\\\" width=\\\"190\\\" height=\\\"44\\\" rx=\\\"7\\\"/>\u003ctext class=\\\"b\\\" x=\\\"430.0\\\" y=\\\"109.0\\\" text-anchor=\\\"middle\\\">PNS\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"430.0\\\" y=\\\"123.0\\\" text-anchor=\\\"middle\\\">all nerves outside the CNS\u003c/text>\u003crect class=\\\"n\\\" x=\\\"5\\\" y=\\\"175\\\" width=\\\"125\\\" height=\\\"44\\\" rx=\\\"7\\\"/>\u003ctext class=\\\"b\\\" x=\\\"67.5\\\" y=\\\"194.0\\\" text-anchor=\\\"middle\\\">Brain\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"67.5\\\" y=\\\"208.0\\\" text-anchor=\\\"middle\\\">thoughts, emotions\u003c/text>\u003crect class=\\\"n\\\" x=\\\"140\\\" y=\\\"175\\\" width=\\\"125\\\" height=\\\"44\\\" rx=\\\"7\\\"/>\u003ctext class=\\\"b\\\" x=\\\"202.5\\\" y=\\\"194.0\\\" text-anchor=\\\"middle\\\">Spinal cord\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"202.5\\\" y=\\\"208.0\\\" text-anchor=\\\"middle\\\">messages + reflexes\u003c/text>\u003crect class=\\\"n\\\" x=\\\"280\\\" y=\\\"175\\\" width=\\\"170\\\" height=\\\"44\\\" rx=\\\"7\\\"/>\u003ctext class=\\\"b\\\" x=\\\"365.0\\\" y=\\\"194.0\\\" text-anchor=\\\"middle\\\">Somatic\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"365.0\\\" y=\\\"208.0\\\" text-anchor=\\\"middle\\\">voluntary, skeletal muscle\u003c/text>\u003crect class=\\\"n\\\" x=\\\"470\\\" y=\\\"175\\\" width=\\\"170\\\" height=\\\"44\\\" rx=\\\"7\\\"/>\u003ctext class=\\\"b\\\" x=\\\"555.0\\\" y=\\\"194.0\\\" text-anchor=\\\"middle\\\">Autonomic\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"555.0\\\" y=\\\"208.0\\\" text-anchor=\\\"middle\\\">automatic, involuntary\u003c/text>\u003crect class=\\\"n sy\\\" x=\\\"380\\\" y=\\\"262\\\" width=\\\"170\\\" height=\\\"48\\\" rx=\\\"7\\\"/>\u003ctext class=\\\"b\\\" x=\\\"465.0\\\" y=\\\"283.0\\\" text-anchor=\\\"middle\\\">Sympathetic\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"465.0\\\" y=\\\"297.0\\\" text-anchor=\\\"middle\\\">speeds up: fight/flight\u003c/text>\u003crect class=\\\"n pa\\\" x=\\\"565\\\" y=\\\"262\\\" width=\\\"170\\\" height=\\\"48\\\" rx=\\\"7\\\"/>\u003ctext class=\\\"b\\\" x=\\\"650.0\\\" y=\\\"283.0\\\" text-anchor=\\\"middle\\\">Parasympathetic\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"650.0\\\" y=\\\"297.0\\\" text-anchor=\\\"middle\\\">calms: rest + digest\u003c/text>\u003cpath class=\\\"ln\\\" d=\\\"M275 50 L275 70 L130 70 L130 90\\\"/>\u003cpath class=\\\"ln\\\" d=\\\"M275 50 L275 70 L430 70 L430 90\\\"/>\u003cpath class=\\\"ln\\\" d=\\\"M130 134 L130 152 L67 152 L67 175\\\"/>\u003cpath class=\\\"ln\\\" d=\\\"M130 134 L130 152 L202 152 L202 175\\\"/>\u003cpath class=\\\"ln\\\" d=\\\"M430 134 L430 152 L365 152 L365 175\\\"/>\u003cpath class=\\\"ln\\\" d=\\\"M430 134 L430 152 L555 152 L555 175\\\"/>\u003cpath class=\\\"ln\\\" d=\\\"M555 219 L555 240 L465 240 L465 262\\\"/>\u003cpath class=\\\"ln\\\" d=\\\"M555 219 L555 240 L650 240 L650 262\\\"/>\u003c/svg>\u003cfigcaption>The nervous system splits into the CNS and PNS. The PNS has somatic and autonomic parts, and the autonomic system has two opposing branches.\u003c/figcaption>\u003c/figure>\\n\u003ch3>CNS: the control centre\u003c/h3>\\n\u003cul>\\n\u003cli>\u003cb>Brain:\u003c/b> processes sensory information; controls thoughts, emotions and behaviour; regulates survival functions (breathing, heart rate, body temperature). The \u003cb>brainstem\u003c/b> connects brain to spinal cord.\u003c/li>\\n\u003cli>\u003cb>Spinal cord:\u003c/b> thick bundle of nerve fibres that (1) carries sensory information up to the brain, (2) carries motor commands down to the body, and (3) controls \u003cb>reflexes\u003c/b>.\u003c/li>\\n\u003cli>\u003cb>Reflexes:\u003c/b> fast protective responses controlled by the spinal cord without the brain (hand from hot stove, knee-jerk, stepping back from something sharp).\u003c/li>\\n\u003cli>Example: you step on a Lego. Sensory info travels up the spinal cord, the brain interprets pain, motor signals travel back down, you move your foot.\u003c/li>\\n\u003c/ul>\\n\u003cfigure>\u003csvg viewBox=\\\"0 0 680 228\\\" role=\\\"img\\\" aria-label=\\\"Touching a hot stove: reflex pathway\\\">\u003cdefs>\u003cmarker id=\\\"m4\\\" viewBox=\\\"0 0 10 10\\\" refX=\\\"9\\\" refY=\\\"5\\\" markerWidth=\\\"7\\\" markerHeight=\\\"7\\\" orient=\\\"auto-start-reverse\\\">\u003cpath d=\\\"M0 0L10 5L0 10z\\\" style=\\\"fill:var(--a)\\\"/>\u003c/marker>\u003c/defs>\u003crect class=\\\"n\\\" x=\\\"10\\\" y=\\\"120\\\" width=\\\"118\\\" height=\\\"66\\\" rx=\\\"7\\\"/>\u003ctext class=\\\"b\\\" x=\\\"69.0\\\" y=\\\"143.0\\\" text-anchor=\\\"middle\\\">Hand\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"69.0\\\" y=\\\"157.0\\\" text-anchor=\\\"middle\\\">skin receptors\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"69.0\\\" y=\\\"171.0\\\" text-anchor=\\\"middle\\\">detect heat/pain\u003c/text>\u003crect class=\\\"n\\\" x=\\\"150\\\" y=\\\"120\\\" width=\\\"118\\\" height=\\\"66\\\" rx=\\\"7\\\"/>\u003ctext class=\\\"b\\\" x=\\\"209.0\\\" y=\\\"143.0\\\" text-anchor=\\\"middle\\\">PNS\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"209.0\\\" y=\\\"157.0\\\" text-anchor=\\\"middle\\\">sensory neurons\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"209.0\\\" y=\\\"171.0\\\" text-anchor=\\\"middle\\\">carry the signal\u003c/text>\u003crect class=\\\"n hi\\\" x=\\\"290\\\" y=\\\"120\\\" width=\\\"118\\\" height=\\\"66\\\" rx=\\\"7\\\"/>\u003ctext class=\\\"b\\\" x=\\\"349.0\\\" y=\\\"143.0\\\" text-anchor=\\\"middle\\\">Spinal cord\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"349.0\\\" y=\\\"157.0\\\" text-anchor=\\\"middle\\\">triggers the\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"349.0\\\" y=\\\"171.0\\\" text-anchor=\\\"middle\\\">reflex\u003c/text>\u003crect class=\\\"n\\\" x=\\\"430\\\" y=\\\"120\\\" width=\\\"118\\\" height=\\\"66\\\" rx=\\\"7\\\"/>\u003ctext class=\\\"b\\\" x=\\\"489.0\\\" y=\\\"143.0\\\" text-anchor=\\\"middle\\\">PNS\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"489.0\\\" y=\\\"157.0\\\" text-anchor=\\\"middle\\\">motor neurons\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"489.0\\\" y=\\\"171.0\\\" text-anchor=\\\"middle\\\">send the command\u003c/text>\u003crect class=\\\"n\\\" x=\\\"570\\\" y=\\\"120\\\" width=\\\"100\\\" height=\\\"66\\\" rx=\\\"7\\\"/>\u003ctext class=\\\"b\\\" x=\\\"620.0\\\" y=\\\"143.0\\\" text-anchor=\\\"middle\\\">Muscles\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"620.0\\\" y=\\\"157.0\\\" text-anchor=\\\"middle\\\">pull hand\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"620.0\\\" y=\\\"171.0\\\" text-anchor=\\\"middle\\\">away\u003c/text>\u003crect class=\\\"n\\\" x=\\\"270\\\" y=\\\"18\\\" width=\\\"158\\\" height=\\\"56\\\" rx=\\\"7\\\"/>\u003ctext class=\\\"b\\\" x=\\\"349.0\\\" y=\\\"36.0\\\" text-anchor=\\\"middle\\\">Brain\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"349.0\\\" y=\\\"50.0\\\" text-anchor=\\\"middle\\\">processes the signal,\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"349.0\\\" y=\\\"64.0\\\" text-anchor=\\\"middle\\\">recognises it as pain\u003c/text>\u003cpath class=\\\"ar\\\" d=\\\"M128 153 L150 153\\\" marker-end=\\\"url(#m4)\\\"/>\u003cpath class=\\\"ar\\\" d=\\\"M268 153 L290 153\\\" marker-end=\\\"url(#m4)\\\"/>\u003cpath class=\\\"ar\\\" d=\\\"M408 153 L430 153\\\" marker-end=\\\"url(#m4)\\\"/>\u003cpath class=\\\"ar\\\" d=\\\"M548 153 L570 153\\\" marker-end=\\\"url(#m4)\\\"/>\u003cpath class=\\\"ar\\\" d=\\\"M349 120 L349 74\\\" marker-end=\\\"url(#m4)\\\"/>\u003ctext class=\\\"xs\\\" x=\\\"358\\\" y=\\\"100\\\" text-anchor=\\\"start\\\">also up to the brain\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"340\\\" y=\\\"214\\\" text-anchor=\\\"middle\\\">Reflexes are controlled by the spinal cord, so the response is very quick.\u003c/text>\u003c/svg>\u003cfigcaption>Sensory information travels in through the PNS, the spinal cord triggers the withdrawal reflex, and the brain interprets the sensation as pain.\u003c/figcaption>\u003c/figure>\\n\u003ch3>PNS: connects the body to the CNS\u003c/h3>\\n\u003cp>Two jobs: send \u003cb>sensory\u003c/b> information from the body (outside world and inside the body) to the CNS, and send \u003cb>motor\u003c/b> information from the CNS to organs, glands and muscles.\u003c/p>\\n\u003cdiv class=\\\"tw\\\">\u003ctable>\\n\u003ctr>\u003cth>\u003c/th>\u003cth>Somatic nervous system\u003c/th>\u003cth>Autonomic nervous system (ANS)\u003c/th>\u003c/tr>\\n\u003ctr>\u003ctd>\u003cb>Control\u003c/b>\u003c/td>\u003ctd>Voluntary\u003c/td>\u003ctd>Involuntary/automatic, no conscious effort\u003c/td>\u003c/tr>\\n\u003ctr>\u003ctd>\u003cb>Works with\u003c/b>\u003c/td>\u003ctd>Skeletal (striped) muscles\u003c/td>\u003ctd>Smooth (visceral) muscles, cardiac muscle, glands\u003c/td>\u003c/tr>\\n\u003ctr>\u003ctd>\u003cb>Neurons\u003c/b>\u003c/td>\u003ctd>Sensory neurons: body \u2192 CNS. Motor neurons: CNS \u2192 muscles\u003c/td>\u003ctd>Communicates between CNS and internal organs\u003c/td>\u003c/tr>\\n\u003ctr>\u003ctd>\u003cb>Regulates\u003c/b>\u003c/td>\u003ctd>Movement you choose\u003c/td>\u003ctd>Heart rate, breathing, digestion, blood vessels, glands, liver, pupil size, adrenal glands\u003c/td>\u003c/tr>\\n\u003ctr>\u003ctd>\u003cb>Examples\u003c/b>\u003c/td>\u003ctd>Taking notes, kicking a ball, raising your hand\u003c/td>\u003ctd>Breathing while asleep, heartbeat, digestion; heart jumping at a loud dog bark\u003c/td>\u003c/tr>\\n\u003c/table>\u003c/div>\\n\u003ch3>Two branches of the ANS (opposite effects, work together)\u003c/h3>\\n\u003cdiv class=\\\"tw\\\">\u003ctable>\\n\u003ctr>\u003cth>\u003c/th>\u003cth>Sympathetic\u003c/th>\u003cth>Parasympathetic\u003c/th>\u003c/tr>\\n\u003ctr>\u003ctd>\u003cb>Role\u003c/b>\u003c/td>\u003ctd>Emergency response; speeds the body up\u003c/td>\u003ctd>Calm and restore; returns body to normal (homeostasis)\u003c/td>\u003c/tr>\\n\u003ctr>\u003ctd>\u003cb>Active when\u003c/b>\u003c/td>\u003ctd>Stressed, perceiving danger or threat\u003c/td>\u003ctd>Relaxed, no immediate danger\u003c/td>\u003c/tr>\\n\u003ctr>\u003ctd>\u003cb>Effects\u003c/b>\u003c/td>\u003ctd>Heart rate \u2191, breathing \u2191, pupils dilate, digestion stops, blood redirected to muscles, more oxygen\u003c/td>\u003ctd>Heart rate \u2193, breathing normalises, digestion resumes\u003c/td>\u003c/tr>\\n\u003ctr>\u003ctd>\u003cb>Response\u003c/b>\u003c/td>\u003ctd>Fight (confront) and Flight (escape)\u003c/td>\u003ctd>Freeze is largely parasympathetic-dominated\u003c/td>\u003c/tr>\\n\u003c/table>\u003c/div>\", \"qs\": [{\"t\": \"c\", \"r\": \"Q1\", \"q\": \"Name the two parts of the CNS and the role of each.\", \"a\": \"Brain: processes information; controls thoughts, emotions, behaviour. Spinal cord: carries messages between brain and body and controls some reflexes.\"}, {\"t\": \"c\", \"r\": \"Q2\", \"q\": \"Describe the PNS and how it helps the body communicate with the CNS.\", \"a\": \"All nerves outside the brain and spinal cord, made of the somatic and autonomic systems. It carries sensory information to the CNS and motor commands from the CNS to the body.\"}, {\"t\": \"h\", \"r\": \"Q3\", \"q\": \"Two functions of the spinal cord with examples.\", \"a\": \"Carries sensory information to the brain (pain from touching something hot). Carries motor commands from the brain to muscles (moving your hand to pick up a pencil). It also controls reflexes such as the withdrawal reflex.\"}, {\"t\": \"c\", \"r\": \"Q4\", \"q\": \"Role of the somatic nervous system (everyday example).\", \"a\": \"Controls voluntary movement and carries sensory information to the CNS. Raising your hand in class: signals go from the brain to the arm muscles.\"}, {\"t\": \"h\", \"r\": \"Q5\", \"q\": \"Student touches a hot stove and pulls away: roles of spinal cord, brain and PNS.\", \"a\": \"The PNS carries pain information from the hand to the spinal cord. The spinal cord triggers a reflex that pulls the hand away. The brain then processes the information and recognises the sensation as pain.\"}, {\"t\": \"h\", \"r\": \"Q6\", \"q\": \"Compare the sympathetic and parasympathetic nervous systems.\", \"a\": \"Sympathetic: active under stress or danger; speeds up heart rate and breathing, stops digestion (fight or flight). Parasympathetic: active when relaxed; slows heart rate, restores normal breathing and digestion (rest and digest).\"}]}, {\"id\": \"I1\", \"wk\": \"Topic 2: Intelligence\", \"title\": \"I1 What is intelligence? The psychometric approach and IQ\", \"th\": \"\u003cdiv class=\\\"box\\\">\u003cb>Success criterion:\u003c/b> I can describe what IQ is and explain how intelligence is measured and compared.\u003c/div>\u003cul>\\n\u003cli>\u003cb>Intelligence\u003c/b> is generally described as the ability to learn from experience, reason, solve problems and adapt to the environment. Psychologists do not all agree on one definition.\u003c/li>\\n\u003cli>The \u003cb>psychometric approach\u003c/b> treats intelligence as a quantity that can be \u003cb>measured by standardised tests\u003c/b> and \u003cb>compared between people\u003c/b>. It assumes intelligence is a trait that varies in degree and is relatively stable.\u003c/li>\\n\u003cli>\u003cb>Spearman (1904)\u003c/b> noticed that people who do well on one mental test tend to do well on others, and proposed a \u003cb>general intelligence factor (g)\u003c/b> plus specific abilities (s). Later models separate \u003cb>fluid intelligence\u003c/b> (reasoning with new problems) from \u003cb>crystallised intelligence\u003c/b> (knowledge and skills learned over time).\u003c/li>\\n\u003c/ul>\\n\u003ch3>History of IQ\u003c/h3>\\n\u003cul>\\n\u003cli>\u003cb>Binet and Simon (1905):\u003c/b> developed the first practical test in France to identify children needing extra help at school. Results gave a \u003cb>mental age\u003c/b> (the age level a child performs at).\u003c/li>\\n\u003cli>\u003cb>Stern (1912)\u003c/b> introduced the \u003cb>intelligence quotient\u003c/b>: IQ = (mental age \u00f7 chronological age) \u00d7 100. A 10-year-old performing like a 12-year-old: (12 \u00f7 10) \u00d7 100 = 120.\u003c/li>\\n\u003cli>\u003cb>Terman (1916)\u003c/b> adapted the test at Stanford University (the Stanford-Binet).\u003c/li>\\n\u003cli>\u003cb>Wechsler (1939)\u003c/b> introduced \u003cb>deviation IQ\u003c/b>: a score shows how far a person is from the average of their own age group. Modern tests use this method.\u003c/li>\\n\u003c/ul>\\n\u003cdiv class=\\\"box\\\">\u003cb>How IQ is scored today:\u003c/b> scores are compared to a \u003cb>standardisation sample\u003c/b> (norms) of people the same age. The average is set at \u003cb>100\u003c/b> with a \u003cb>standard deviation of 15\u003c/b>, producing a normal (bell) curve. Tests are re-normed every so often because average raw scores rise over time (the \u003cb>Flynn effect\u003c/b>, about 3 IQ points per decade through much of the 20th century).\u003c/div>\\n\u003cfigure>\u003csvg viewBox=\\\"0 0 700 258\\\" role=\\\"img\\\" aria-label=\\\"IQ normal distribution\\\">\u003cpath d=\\\"M60.0 215 L60.0 213.4 L79.3 212.1 L98.7 210.1 L118.0 206.9 L137.3 202.1 L156.7 195.4 L176.0 186.3 L195.3 174.7 L214.7 160.6 L234.0 144.4 L253.3 127.1 L272.7 109.7 L292.0 93.9 L311.3 81.1 L330.7 72.9 L350.0 70.0 L369.3 72.9 L388.7 81.1 L408.0 93.9 L427.3 109.7 L446.7 127.1 L466.0 144.4 L485.3 160.6 L504.7 174.7 L524.0 186.3 L543.3 195.4 L562.7 202.1 L582.0 206.9 L601.3 210.1 L620.7 212.1 L640.0 213.4 L640.0 215 Z\\\" fill=\\\"#0f6b73\\\" fill-opacity=\\\"0.12\\\"/>\u003cpath d=\\\"M156.7 215 L156.7 195.4 L169.6 189.6 L182.4 182.7 L195.3 174.7 L208.2 165.5 L221.1 155.4 L234.0 144.4 L246.9 132.9 L259.8 121.2 L272.7 109.7 L285.6 98.9 L298.4 89.2 L311.3 81.1 L324.2 75.1 L337.1 71.3 L350.0 70.0 L362.9 71.3 L375.8 75.1 L388.7 81.1 L401.6 89.2 L414.4 98.9 L427.3 109.7 L440.2 121.2 L453.1 132.9 L466.0 144.4 L478.9 155.4 L491.8 165.5 L504.7 174.7 L517.6 182.7 L530.4 189.6 L543.3 195.4 L543.3 215 Z\\\" fill=\\\"#0f6b73\\\" fill-opacity=\\\"0.22\\\"/>\u003cpath d=\\\"M253.3 215 L253.3 127.1 L259.8 121.2 L266.2 115.4 L272.7 109.7 L279.1 104.2 L285.6 98.9 L292.0 93.9 L298.4 89.2 L304.9 85.0 L311.3 81.1 L317.8 77.8 L324.2 75.1 L330.7 72.9 L337.1 71.3 L343.6 70.3 L350.0 70.0 L356.4 70.3 L362.9 71.3 L369.3 72.9 L375.8 75.1 L382.2 77.8 L388.7 81.1 L395.1 85.0 L401.6 89.2 L408.0 93.9 L414.4 98.9 L420.9 104.2 L427.3 109.7 L433.8 115.4 L440.2 121.2 L446.7 127.1 L446.7 215 Z\\\" fill=\\\"#0f6b73\\\" fill-opacity=\\\"0.38\\\"/>\u003cpath d=\\\"M60.0 213.4 L69.7 212.8 L79.3 212.1 L89.0 211.2 L98.7 210.1 L108.3 208.6 L118.0 206.9 L127.7 204.7 L137.3 202.1 L147.0 199.0 L156.7 195.4 L166.3 191.2 L176.0 186.3 L185.7 180.8 L195.3 174.7 L205.0 167.9 L214.7 160.6 L224.3 152.7 L234.0 144.4 L243.7 135.8 L253.3 127.1 L263.0 118.3 L272.7 109.7 L282.3 101.5 L292.0 93.9 L301.7 87.0 L311.3 81.1 L321.0 76.4 L330.7 72.9 L340.3 70.7 L350.0 70.0 L359.7 70.7 L369.3 72.9 L379.0 76.4 L388.7 81.1 L398.3 87.0 L408.0 93.9 L417.7 101.5 L427.3 109.7 L437.0 118.3 L446.7 127.1 L456.3 135.8 L466.0 144.4 L475.7 152.7 L485.3 160.6 L495.0 167.9 L504.7 174.7 L514.3 180.8 L524.0 186.3 L533.7 191.2 L543.3 195.4 L553.0 199.0 L562.7 202.1 L572.3 204.7 L582.0 206.9 L591.7 208.6 L601.3 210.1 L611.0 211.2 L620.7 212.1 L630.3 212.8 L640.0 213.4\\\" fill=\\\"none\\\" style=\\\"stroke:var(--ink)\\\" stroke-width=\\\"2\\\"/>\u003cline x1=\\\"60\\\" y1=\\\"215\\\" x2=\\\"640\\\" y2=\\\"215\\\" class=\\\"ln\\\"/>\u003ctext class=\\\"s\\\" x=\\\"60.0\\\" y=\\\"232\\\" text-anchor=\\\"middle\\\">55\u003c/text>\u003cline x1=\\\"60.0\\\" y1=\\\"215\\\" x2=\\\"60.0\\\" y2=\\\"220\\\" class=\\\"ln\\\"/>\u003ctext class=\\\"s\\\" x=\\\"156.66666666666669\\\" y=\\\"232\\\" text-anchor=\\\"middle\\\">70\u003c/text>\u003cline x1=\\\"156.66666666666669\\\" y1=\\\"215\\\" x2=\\\"156.66666666666669\\\" y2=\\\"220\\\" class=\\\"ln\\\"/>\u003ctext class=\\\"s\\\" x=\\\"253.33333333333334\\\" y=\\\"232\\\" text-anchor=\\\"middle\\\">85\u003c/text>\u003cline x1=\\\"253.33333333333334\\\" y1=\\\"215\\\" x2=\\\"253.33333333333334\\\" y2=\\\"220\\\" class=\\\"ln\\\"/>\u003ctext class=\\\"s\\\" x=\\\"350.0\\\" y=\\\"232\\\" text-anchor=\\\"middle\\\">100\u003c/text>\u003cline x1=\\\"350.0\\\" y1=\\\"215\\\" x2=\\\"350.0\\\" y2=\\\"220\\\" class=\\\"ln\\\"/>\u003ctext class=\\\"s\\\" x=\\\"446.6666666666667\\\" y=\\\"232\\\" text-anchor=\\\"middle\\\">115\u003c/text>\u003cline x1=\\\"446.6666666666667\\\" y1=\\\"215\\\" x2=\\\"446.6666666666667\\\" y2=\\\"220\\\" class=\\\"ln\\\"/>\u003ctext class=\\\"s\\\" x=\\\"543.3333333333334\\\" y=\\\"232\\\" text-anchor=\\\"middle\\\">130\u003c/text>\u003cline x1=\\\"543.3333333333334\\\" y1=\\\"215\\\" x2=\\\"543.3333333333334\\\" y2=\\\"220\\\" class=\\\"ln\\\"/>\u003ctext class=\\\"s\\\" x=\\\"640.0\\\" y=\\\"232\\\" text-anchor=\\\"middle\\\">145\u003c/text>\u003cline x1=\\\"640.0\\\" y1=\\\"215\\\" x2=\\\"640.0\\\" y2=\\\"220\\\" class=\\\"ln\\\"/>\u003ctext class=\\\"xs\\\" x=\\\"108.33333333333334\\\" y=\\\"250\\\" text-anchor=\\\"middle\\\">2.1%\u003c/text>\u003ctext class=\\\"xs\\\" x=\\\"205.0\\\" y=\\\"250\\\" text-anchor=\\\"middle\\\">13.6%\u003c/text>\u003ctext class=\\\"xs\\\" x=\\\"301.6666666666667\\\" y=\\\"250\\\" text-anchor=\\\"middle\\\">34.1%\u003c/text>\u003ctext class=\\\"xs\\\" x=\\\"398.33333333333337\\\" y=\\\"250\\\" text-anchor=\\\"middle\\\">34.1%\u003c/text>\u003ctext class=\\\"xs\\\" x=\\\"495.0\\\" y=\\\"250\\\" text-anchor=\\\"middle\\\">13.6%\u003c/text>\u003ctext class=\\\"xs\\\" x=\\\"591.6666666666666\\\" y=\\\"250\\\" text-anchor=\\\"middle\\\">2.1%\u003c/text>\u003cline x1=\\\"156.66666666666669\\\" y1=\\\"20\\\" x2=\\\"543.3333333333334\\\" y2=\\\"20\\\" class=\\\"ln\\\"/>\u003ctext class=\\\"s\\\" x=\\\"350.0\\\" y=\\\"14\\\" text-anchor=\\\"middle\\\">about 95% of people score 70\u2013130\u003c/text>\u003cline x1=\\\"253.33333333333334\\\" y1=\\\"46\\\" x2=\\\"446.6666666666667\\\" y2=\\\"46\\\" class=\\\"ln\\\"/>\u003ctext class=\\\"s\\\" x=\\\"350.0\\\" y=\\\"40\\\" text-anchor=\\\"middle\\\">about 68% score 85\u2013115\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"350.0\\\" y=\\\"205\\\" text-anchor=\\\"middle\\\">mean = 100\u003c/text>\u003c/svg>\u003cfigcaption>IQ scores follow a normal (bell) curve with mean 100 and standard deviation 15. The percentages under the axis show the share of people in each band.\u003c/figcaption>\u003c/figure>\\n\\n\u003cdiv class=\\\"tw\\\">\u003ctable>\\n\u003ctr>\u003cth>IQ range\u003c/th>\u003cth>Wechsler classification\u003c/th>\u003c/tr>\\n\u003ctr>\u003ctd>130 and above\u003c/td>\u003ctd>Very superior\u003c/td>\u003c/tr>\u003ctr>\u003ctd>120\u2013129\u003c/td>\u003ctd>Superior\u003c/td>\u003c/tr>\u003ctr>\u003ctd>110\u2013119\u003c/td>\u003ctd>High average\u003c/td>\u003c/tr>\u003ctr>\u003ctd>90\u2013109\u003c/td>\u003ctd>Average\u003c/td>\u003c/tr>\u003ctr>\u003ctd>80\u201389\u003c/td>\u003ctd>Low average\u003c/td>\u003c/tr>\u003ctr>\u003ctd>70\u201379\u003c/td>\u003ctd>Borderline\u003c/td>\u003c/tr>\u003ctr>\u003ctd>69 and below\u003c/td>\u003ctd>Extremely low (a diagnosis of intellectual disability also requires difficulty with everyday adaptive skills)\u003c/td>\u003c/tr>\\n\u003c/table>\u003c/div>\\n\u003cp>\u003cb>Standardisation\u003c/b> means the test is given and scored the same way for everyone, so scores can be compared fairly.\u003c/p>\", \"qs\": [{\"t\": \"c\", \"r\": \"Q1\", \"q\": \"What is IQ and how is it measured and compared?\", \"a\": \"IQ (intelligence quotient) is a score from a standardised test that compares a person's performance to others of the same age. It is set so the average is 100 with a standard deviation of 15, which allows intelligence to be measured and compared.\"}, {\"t\": \"h\", \"r\": \"Q2\", \"q\": \"A child has a mental age of 12 and a chronological age of 10. Calculate the ratio IQ.\", \"a\": \"IQ = (mental age \u00f7 chronological age) \u00d7 100 = (12 \u00f7 10) \u00d7 100 = 120.\"}, {\"t\": \"c\", \"r\": \"Q3\", \"q\": \"About what percentage of people score between 85 and 115 on an IQ test, and why?\", \"a\": \"About 68%. IQ scores follow a normal curve with mean 100 and standard deviation 15, so 85 to 115 is within one standard deviation of the mean.\"}]}, {\"id\": \"I2\", \"wk\": \"Topic 2: Intelligence\", \"title\": \"I2 How intelligence is measured: Stanford-Binet, WAIS-IV and WISC-V\", \"th\": \"\u003cdiv class=\\\"box\\\">\u003cb>Success criterion:\u003c/b> I can describe how the Stanford-Binet, WAIS-IV and WISC-V assess intelligence.\u003c/div>\u003cdiv class=\\\"tw\\\">\u003ctable>\\n\u003ctr>\u003cth>\u003c/th>\u003cth>Stanford-Binet (5th ed., SB5)\u003c/th>\u003cth>WAIS-IV\u003c/th>\u003cth>WISC-V\u003c/th>\u003c/tr>\\n\u003ctr>\u003ctd>\u003cb>Full name\u003c/b>\u003c/td>\u003ctd>Stanford-Binet Intelligence Scales\u003c/td>\u003ctd>Wechsler Adult Intelligence Scale, 4th ed.\u003c/td>\u003ctd>Wechsler Intelligence Scale for Children, 5th ed.\u003c/td>\u003c/tr>\\n\u003ctr>\u003ctd>\u003cb>Origin\u003c/b>\u003c/td>\u003ctd>Binet-Simon (1905) \u2192 Terman at Stanford (1916); current edition 2003\u003c/td>\u003ctd>Wechsler (1939 original); WAIS-IV published 2008\u003c/td>\u003ctd>Wechsler; WISC-V published 2014\u003c/td>\u003c/tr>\\n\u003ctr>\u003ctd>\u003cb>Ages\u003c/b>\u003c/td>\u003ctd>About 2 to 85+ years\u003c/td>\u003ctd>16 to 90 years\u003c/td>\u003ctd>6 to 16 years\u003c/td>\u003c/tr>\\n\u003ctr>\u003ctd>\u003cb>What it measures\u003c/b>\u003c/td>\u003ctd>Five factors: fluid reasoning, knowledge, quantitative reasoning, visual-spatial processing, working memory. Each is tested with verbal and nonverbal tasks\u003c/td>\u003ctd>Four index scores: Verbal Comprehension, Perceptual Reasoning, Working Memory, Processing Speed\u003c/td>\u003ctd>Five primary index scores: Verbal Comprehension, Visual Spatial, Fluid Reasoning, Working Memory, Processing Speed\u003c/td>\u003c/tr>\\n\u003ctr>\u003ctd>\u003cb>Subtests\u003c/b>\u003c/td>\u003ctd>10 subtests (5 verbal, 5 nonverbal)\u003c/td>\u003ctd>10 core subtests (15 in total)\u003c/td>\u003ctd>16 subtests; 10 primary subtests; 7 of them give the Full Scale IQ\u003c/td>\u003c/tr>\\n\u003ctr>\u003ctd>\u003cb>Scores\u003c/b>\u003c/td>\u003ctd>Full Scale IQ plus Verbal and Nonverbal IQ\u003c/td>\u003ctd>Full Scale IQ plus four index scores\u003c/td>\u003ctd>Full Scale IQ plus five index scores\u003c/td>\u003c/tr>\\n\u003c/table>\u003c/div>\\n\u003cp>\u003cb>Features common to all three:\u003c/b> individually administered by a trained psychologist; standardised instructions and scoring; scores compared with age-group norms (mean 100, SD 15); a mix of verbal and non-verbal tasks.\u003c/p>\\n\u003cdiv class=\\\"tw\\\">\u003ctable>\\n\u003ctr>\u003cth>Index\u003c/th>\u003cth>Example tasks\u003c/th>\u003c/tr>\\n\u003ctr>\u003ctd>\u003cb>Verbal comprehension\u003c/b>\u003c/td>\u003ctd>Similarities (how are a cat and a mouse alike?); Vocabulary (define words); Information (general knowledge)\u003c/td>\u003c/tr>\\n\u003ctr>\u003ctd>\u003cb>Perceptual reasoning / visual-spatial / fluid reasoning\u003c/b>\u003c/td>\u003ctd>Block Design (build a pattern with blocks); Matrix Reasoning (choose the missing piece in a pattern); Visual Puzzles; Figure Weights\u003c/td>\u003c/tr>\\n\u003ctr>\u003ctd>\u003cb>Working memory\u003c/b>\u003c/td>\u003ctd>Digit Span (repeat numbers forwards or backwards); Arithmetic (mental maths); Picture Span\u003c/td>\u003c/tr>\\n\u003ctr>\u003ctd>\u003cb>Processing speed\u003c/b>\u003c/td>\u003ctd>Coding (match symbols to numbers quickly); Symbol Search\u003c/td>\u003c/tr>\\n\u003c/table>\u003c/div>\", \"qs\": [{\"t\": \"h\", \"r\": \"Q1\", \"q\": \"Compare the Stanford-Binet, WAIS-IV and WISC-V.\", \"a\": \"All are individually administered, standardised IQ tests with a mean of 100 and SD 15. The Stanford-Binet (from Binet and Simon, 1905) covers ages about 2 to 85+ and measures five factors. The WAIS-IV is for ages 16 to 90 and gives four index scores. The WISC-V is for ages 6 to 16 and gives five index scores.\"}, {\"t\": \"h\", \"r\": \"Q2\", \"q\": \"Which Wechsler test suits a 12-year-old and what index scores does it give?\", \"a\": \"The WISC-V (ages 6 to 16). Its five primary index scores are Verbal Comprehension, Visual Spatial, Fluid Reasoning, Working Memory and Processing Speed, plus a Full Scale IQ.\"}]}, {\"id\": \"I3\", \"wk\": \"Topic 2: Intelligence\", \"title\": \"I3 Validity and reliability of intelligence tests\", \"th\": \"\u003cdiv class=\\\"box\\\">\u003cb>Success criterion:\u003c/b> I can explain validity and reliability and apply them to IQ tests.\u003c/div>\u003cdiv class=\\\"g2\\\">\\n\u003cdiv class=\\\"sc\\\">\u003ch3>Reliability = consistency\u003c/h3>\u003cp>Would the test give the same result each time?\u003c/p>\u003cul>\\n\u003cli>\u003cb>Test-retest:\u003c/b> same person, same test, later date\u003c/li>\\n\u003cli>\u003cb>Split-half / internal consistency:\u003c/b> two halves of the test give similar scores\u003c/li>\\n\u003cli>\u003cb>Inter-rater:\u003c/b> different examiners score the same answers the same way\u003c/li>\u003c/ul>\\n\u003cp>Modern IQ tests are \u003cb>highly reliable\u003c/b> (reliability coefficients of Full Scale IQ are typically around .90 or higher). Scores are also fairly stable across life: in a Scottish study, IQ at age 11 correlated roughly .6 to .7 with IQ in old age.\u003c/p>\u003c/div>\\n\u003cdiv class=\\\"sc\\\">\u003ch3>Validity = measures what it claims to\u003c/h3>\u003cp>Does the test really measure intelligence?\u003c/p>\u003cul>\\n\u003cli>\u003cb>Content:\u003c/b> covers a wide range of mental abilities\u003c/li>\\n\u003cli>\u003cb>Construct:\u003c/b> fits the theory of intelligence (e.g. g); correlates with other IQ tests\u003c/li>\\n\u003cli>\u003cb>Predictive/criterion:\u003c/b> predicts outcomes such as school results (correlation around .5) and, more moderately, job performance\u003c/li>\u003c/ul>\\n\u003cp>IQ tests are reasonably valid for predicting \u003cb>academic achievement\u003c/b>, but a correlation of about .5 means IQ explains only around a quarter of the differences in results.\u003c/p>\u003c/div>\\n\u003c/div>\\n\u003cdiv class=\\\"box\\\">A test can be reliable without being valid (a faulty scale that always shows the same wrong weight is consistent but inaccurate). A test cannot be valid unless it is reliable.\u003c/div>\\n\u003ch3>Limits to validity and reliability\u003c/h3>\\n\u003cul>\\n\u003cli>\u003cb>Cultural bias:\u003c/b> items depend on language, schooling and cultural knowledge, so people from different backgrounds (including Aboriginal and Torres Strait Islander children, or people who speak English as an additional language) may score lower for reasons unrelated to ability. \\\"Culture-fair\\\" tests such as Raven's Progressive Matrices reduce, but do not remove, this.\u003c/li>\\n\u003cli>\u003cb>Testing conditions:\u003c/b> anxiety, motivation, tiredness, illness and the examiner can change a score. Scores have a margin of error of several points.\u003c/li>\\n\u003cli>\u003cb>Stereotype threat\u003c/b> (Steele and Aronson, 1995): fear of confirming a negative stereotype lowers performance.\u003c/li>\\n\u003cli>\u003cb>Narrow definition:\u003c/b> tests miss creativity, practical skills and emotional skills (Gardner's multiple intelligences; Sternberg's triarchic theory).\u003c/li>\\n\u003cli>\u003cb>Flynn effect:\u003c/b> rising scores mean old norms become inaccurate, so tests must be re-normed.\u003c/li>\\n\u003cli>\u003cb>Misuse:\u003c/b> early IQ tests were used to label people and support discrimination (e.g. U.S. immigration restrictions in the 1920s). A single score can unfairly label a child.\u003c/li>\\n\u003c/ul>\", \"qs\": [{\"t\": \"h\", \"r\": \"Q1\", \"q\": \"Explain validity and reliability and apply them to IQ tests.\", \"a\": \"Reliability is consistency (similar results on retest); IQ tests are highly reliable. Validity is whether a test measures what it claims; IQ tests predict school achievement reasonably well, but cultural bias, test anxiety and a narrow definition of intelligence limit their validity.\"}, {\"t\": \"h\", \"r\": \"Q2\", \"q\": \"Give one way to check the reliability and one way to check the validity of an IQ test.\", \"a\": \"Reliability: test-retest (same person gets a similar score on a later occasion). Validity: predictive validity, such as checking how well scores predict school achievement.\"}]}, {\"id\": \"I4\", \"wk\": \"Topic 2: Intelligence\", \"title\": \"I4 Is intelligence inherited? Twin, family and adoption studies\", \"th\": \"\u003cdiv class=\\\"box\\\">\u003cb>Success criterion:\u003c/b> I can summarise twin, family and adoption evidence (e.g. the Minnesota Twin Study) on the heritability of intelligence.\u003c/div>\u003cp>\u003cb>Heritability\u003c/b> is the proportion of the \u003ci>differences\u003c/i> in a trait within a population that is associated with genetic differences. Heritability of .50 does \u003cb>not\u003c/b> mean 50% of one person's intelligence is genetic. It also does not mean a trait cannot change, and it varies between groups and environments.\u003c/p>\\n\u003cdiv class=\\\"tw\\\">\u003ctable>\\n\u003ctr>\u003cth>Method\u003c/th>\u003cth>How it works\u003c/th>\u003cth>Key logic and limits\u003c/th>\u003c/tr>\\n\u003ctr>\u003ctd>\u003cb>Twin studies\u003c/b>\u003c/td>\u003ctd>Compare \u003cb>identical (MZ)\u003c/b> twins (about 100% of genes shared) with \u003cb>fraternal (DZ)\u003c/b> twins (about 50%, like other siblings)\u003c/td>\u003ctd>If genes matter, MZ twins should be more alike than DZ twins. Limit: MZ twins are often treated more alike (equal-environments assumption)\u003c/td>\u003c/tr>\\n\u003ctr>\u003ctd>\u003cb>Family studies\u003c/b>\u003c/td>\u003ctd>Compare IQ of relatives with different degrees of genetic relatedness (parent-child, siblings, cousins)\u003c/td>\u003ctd>IQ similarity rises with relatedness. Limit: relatives usually share an environment too\u003c/td>\u003c/tr>\\n\u003ctr>\u003ctd>\u003cb>Adoption studies\u003c/b>\u003c/td>\u003ctd>Compare adopted children with their biological relatives (shared genes, different home) and adoptive relatives (shared home, no shared genes)\u003c/td>\u003ctd>Separates genes from environment. Limit: adoptive homes are often similar and selected, and are not a full range of environments\u003c/td>\u003c/tr>\\n\u003c/table>\u003c/div>\\n\u003cfigure>\u003csvg viewBox=\\\"0 0 700 272\\\" role=\\\"img\\\" aria-label=\\\"IQ correlations by relationship\\\">\u003ctext class=\\\"s\\\" x=\\\"255\\\" y=\\\"28\\\" text-anchor=\\\"end\\\">Identical twins, reared together\u003c/text>\u003crect x=\\\"265\\\" y=\\\"14\\\" width=\\\"344\\\" height=\\\"20\\\" rx=\\\"3\\\" fill=\\\"#0f6b73\\\" fill-opacity=\\\".75\\\"/>\u003ctext class=\\\"b\\\" x=\\\"615.0\\\" y=\\\"28\\\" text-anchor=\\\"start\\\">.86\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"255\\\" y=\\\"58\\\" text-anchor=\\\"end\\\">Identical twins, reared apart\u003c/text>\u003crect x=\\\"265\\\" y=\\\"44\\\" width=\\\"288\\\" height=\\\"20\\\" rx=\\\"3\\\" fill=\\\"#0f6b73\\\" fill-opacity=\\\".75\\\"/>\u003ctext class=\\\"b\\\" x=\\\"559.0\\\" y=\\\"58\\\" text-anchor=\\\"start\\\">.72\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"255\\\" y=\\\"88\\\" text-anchor=\\\"end\\\">Fraternal twins, reared together\u003c/text>\u003crect x=\\\"265\\\" y=\\\"74\\\" width=\\\"240\\\" height=\\\"20\\\" rx=\\\"3\\\" fill=\\\"#3b82c4\\\" fill-opacity=\\\".75\\\"/>\u003ctext class=\\\"b\\\" x=\\\"511.0\\\" y=\\\"88\\\" text-anchor=\\\"start\\\">.60\u003c/text>\u003ctext class=\\\"s\\\" x=\\\"255\\\" y=\\\"118\\
